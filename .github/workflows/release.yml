name: Release

# Push a tag to release:  git tag v0.1.0 && git push origin v0.1.0
# A tag with a hyphen (v0.2.0-rc.1) is published as a pre-release. A Go module needs no artifacts: the tag is what
# `go get` fetches. This checks the tag and publishes a GitHub release whose notes are the tag's CHANGELOG.md section.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub release
    timeout-minutes: 15
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test -race ./...

      - name: The tag matches Version
        shell: bash
        run: |
          set -euo pipefail
          declared="v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' client.go)"
          case "$VERSION" in *-*) exit 0 ;; esac
          [ "$declared" = "$VERSION" ] || { echo "::error::Tag is $VERSION, client.go says $declared"; exit 1; }

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          # The lines after "## $VERSION " up to the next "## " heading.
          awk -v v="## $VERSION " 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          case "$VERSION" in
            *-*) [ -s notes.md ] || echo "Pre-release $VERSION." > notes.md ;;
            *)
              if ! grep -q '[^[:space:]]' notes.md; then
                echo "::error::CHANGELOG.md has no '## $VERSION' section: add it on main, then tag again"
                exit 1
              fi
              ;;
          esac
          cat notes.md

      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--title "$VERSION" --notes-file notes.md --verify-tag)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" "${flags[@]}"
          fi

      - name: Ask the Go module proxy to fetch the new version
        continue-on-error: true
        run: cd "$(mktemp -d)" && GOPROXY=https://proxy.golang.org go list -m "github.com/The-Orbits/orbits-go@$VERSION"
