        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Integrations]
      operationId: uninstallSlack
      summary: Uninstall Slack
      description: |
        **Status:** Implemented.

        Orbits stops posting and revokes its token in Slack. Messages already queued are dropped.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
