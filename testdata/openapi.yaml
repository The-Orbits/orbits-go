openapi: 3.1.0
info:
  title: Orbits Platform API
  version: 0.1.0-draft
  summary: Public API served by the Orbits api-gateway.
  description: |
    This contract includes implemented auth, team, membership and invitation endpoints alongside planned APIs.
    Each operation description identifies its implementation status and frontend call sequence.
    Planned operations are not available in the current backend; their flows and guarantees remain draft.
    Decisions: docs/decisions.md.

    Frontend integration
    - All operation paths are served below `/v1`; examples below include that prefix.
    - Obtain an opaque session `token` from email-link verification or a provider callback and send it as
      `Authorization: Bearer <token>`. Provider redirects return to the configured frontend origin.
    - Reuse known resource references and valid sessions; discovery/list calls explain where values come from,
      not a requirement to refetch every resource before every request.
    - API tokens (`orb_live_…`, made in Settings) are sent the same way, as `Authorization: Bearer <token>`. See
      "API tokens" below. Idempotent replay is not implemented at the gateway yet; the conventions below describe
      the target contract, not guarantees of all current handlers.

    Rate limits
    - Over a limit the API answers `429` with `Retry-After` (whole seconds) and a problem document; wait that long.
      Limits are token buckets: a short burst, then a steady rate.
    - Signed-in requests are limited per person (1,200 a minute, bursts of 400) and per API token (300 a minute,
      bursts of 100), not per address, so many people behind one server don't affect each other. A token has its own
      budget, apart from its person's.
    - Sign-in and account routes (`/v1/auth/...`, `/v1/me/...`, invite lookups) are limited per address (300 a minute),
      and asking for a sign-in email 30 a minute per address and 5 in a row per email address, then one every three
      minutes, whether or not the address has an account. An address that sends many bearer tokens the API refuses
      (300 a minute) waits, even with a good one.
    - A team has one budget of its own too (6,000 a minute), spent by its members and its API tokens together, so a
      `429` on a team's route can be the team's budget rather than the caller's (`RateLimit-Scope: team`).
    - Not limited here: webhooks from Git providers, the preview and flags SDK calls from deployed apps.
    - Limits are per instance and kept in memory; they restart with it.
    - The address is the connection's. The web app's server may name the visitor a request is for, with
      `X-Orbits-Client-IP` (a plain IP address) and `X-Orbits-Client-Key` (a secret shared with the API); the
      per-address limits then count that visitor. Without the right key the claim is ignored, and neither header is
      passed on to any service.
    - Every signed-in answer carries the caller's own budget, and every `429` the budget that ran out:
      `RateLimit-Limit` (the bucket's size: how many requests can be made at once), `RateLimit-Remaining` (whole
      requests left), `RateLimit-Reset` (seconds until it is full again) and `RateLimit-Scope` (`user`, `token`,
      `team`, `address` or `email`). A `429` also has `Retry-After`, the seconds until one request is allowed.

    API tokens
    - A token belongs to one team and acts as the person who made it, so it stops working when they leave the team
      (or when the team turns two-factor on and they have it off). It is a CLI or CI credential, not a login.
    - `read` tokens may only send `GET` and `HEAD`, and never read environment variable values. `full` tokens may
      send anything below, except what is listed next. A token limited to one project reaches only that project's routes,
      plus `GET /v1/teams/{team}`, `GET /v1/teams/{team}/projects` and `GET /v1/teams/{team}/deployments`, which list
      only that project.
    - It can call `GET /v1/me`, `GET /v1/teams`, `GET /v1/templates`, `GET /v1/operations/{id}` and
      `/v1/teams/{team}/...` for its own team. Anything else is 403 ("API tokens can't ..."): sign-in and account
      routes (`/v1/auth/...`, `/v1/me/...`), creating teams, accepting invites, token management, deleting the team,
      the team's security rules (two-factor, sign-in methods, session length, who can invite), members and invites,
      moving a project to another team, and Git or notification integrations (the list at
      `GET /v1/teams/{team}/integrations` is fine).
    - 401: the token is wrong, revoked or expired. A team's sign-in method and session-length rules don't apply to
      tokens; its two-factor rule applies to the person the token acts as.

    Conventions
    - REST/JSON, routes scoped as `/teams/{team}/...`. `{team}` accepts the slug or the `team_` id.
    - Public ids carry a prefix: `usr_`, `team_`, `prj_`, `dpl_`, `dom_`, `rec_`, `tok_`, `op_`.
    - Errors are RFC 9457 `application/problem+json`.
    - Every POST takes an `Idempotency-Key`. A replay with the same key and body returns the first result;
      the same key with a different body returns 422. A POST that doesn't list the `Idempotency-Key` parameter
      ignores it, and so does one whose description says so.
    - Anything slow returns `202` with an Operation (or the new Deployment). Clients poll or follow events.
    - Lists use cursor pagination: `limit` and `cursor` in, `items` and `next_cursor` out.
    - Timestamps are RFC 3339 UTC.

    Division of responsibility (proposed)
    - api-gateway: TLS, authentication (session or API token), rate limiting, request ids, routing, SSE fan-out.
    - orbits-api: team authorization, business rules, desired state. The gateway never decides team access.
    - A response of 202 means the intent is recorded. Observed state (what is running) is reported separately
      on `Deployment.runtime` and never written by callers.

    Not covered yet: paying for Pro (checkout, renewals, invoices), connect,
    firewall/CDN/images.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /v1
    description: API gateway on the current host.
  - url: https://api.theorbits.app/v1
    description: Production.
  - url: https://stagingapi.theorbits.app/v1
    description: Staging.
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Teams
  - name: Members
  - name: Billing
  - name: Projects
  - name: Deployments
  - name: Logs
  - name: Insights
    description: Analytics and Speed Insights, from the beacons the edge's scripts send, loaded by @useorbits/analytics and @useorbits/speed-insights.
  - name: Flags
    description: Feature flags, and what @useorbits/flags reads them with.
  - name: Workflows
    description: Durable workflows an app defines with @useorbits/workflows, and their runs.
  - name: Sandboxes
    description: On-demand dev machines for a project — clone the repo, run a dev server, seed data — with an interactive terminal.
  - name: Alerts
  - name: Environment variables
  - name: Domains
  - name: DNS
  - name: Integrations
  - name: Tokens
  - name: Usage and activity
  - name: Webhooks
  - name: Edge
    description: 'Edge-only: routes the Nginx edge calls (or sends a visitor''s browser to) for protected previews. Not for API clients: they are marked `x-internal: true`, and the SDKs and the API reference leave them out.'

paths:
  # ---------- Auth ----------
  /auth/email-links:
    post:
      tags: [Auth]
      operationId: sendSignInLink
      summary: Send a sign-in link
      description: |
        **Status:** Implemented.

        Send a sign-in link.

        One endpoint serves sign-in and account creation; an account is created when the email link is verified. Resending uses this same request. An address may be sent 5 emails in a row, then one every three minutes, and an address (the web app's server) 30 requests a minute; past that this answers 429 with `Retry-After`, the same whether or not the address has an account.

        **Frontend flow:**

        No prior API calls are required for ordinary sign-in or registration. No authentication is required.

        1. Collect `email` and optionally `name` from the form, then call this endpoint.
        2. In an invitation flow, first call `GET /v1/invites/{token}` using the token from the invite URL; retain that URL token as request-body `invite_token`. The preview response does not return a token.
        3. After 202, wait for the email link. Its `token` query parameter is the input to `POST /v1/auth/email-links/verify`; 202 does not provide a session token.
        4. On 503 the email could not be sent (the mail server refused or was unreachable). Show the problem's `detail` and offer the Git providers instead; the request can be retried.
        5. On 429 show "Try again in N minutes" from `Retry-After` (seconds) and disable Resend until then.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. Idempotent replay/deduplication is not implemented in the current gateway/services; do not assume a retry is deduplicated.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string, minLength: 1, maxLength: 100, description: Full name from the Create account form. }
                invite_token: { type: string, description: Present when signing in to accept an invite. }
      responses:
        '202': { description: Link sent if the address is valid. }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: The sign-in email could not be sent. `detail` says so in words for the form.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/email-links/verify:
    post:
      tags: [Auth]
      operationId: verifySignInLink
      summary: Exchange a sign-in link token for a session
      description: |
        **Status:** Implemented.

        Exchange a sign-in link token for a session.

        **Frontend flow:**

        No authentication is required.

        1. First call `POST /v1/auth/email-links` with the email address, then wait for its sign-in email. An already received, unexpired email link can be used directly.
        2. Read the `token` query parameter from the frontend `/sign-in/verify` URL and send it as JSON `{ "token": "..." }` here. The token is single-use and expires after 15 minutes.
        3. Retain response `token`, `expires_at`, and `user`; use `token` as `Authorization: Bearer <token>` on protected calls such as `GET /v1/me` and `GET /v1/teams`.

        A new account is sent the welcome email. Send `client` with the browser's user agent and IP: an existing account signing in from a browser and system it hasn't used before is sent the new sign-in email. Without `client` no device is recorded and that email never goes.
        4. If the response has `two_factor_required: true` instead of `token`, the account has two-factor on: ask for the code and send it with `challenge_token` to `POST /v1/auth/two-factor`, which returns the session (and `invite_token`, when there is one).
        5. If response `invite_token` is present, retain it for `GET /v1/invites/{token}` and, after user confirmation, `POST /v1/invites/{token}/accept`. Verifying the email link does not itself join the team.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. Idempotent replay/deduplication is not implemented in the current gateway/services; do not assume a retry is deduplicated.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                client: { $ref: '#/components/schemas/SignInClient' }
      responses:
        '200':
          description: Session created (the token is opaque; the web app stores it in the `orbits_session` cookie), or, for an account with two-factor on, a challenge to finish with `POST /v1/auth/two-factor`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Session' }
                  - { $ref: '#/components/schemas/TwoFactorChallenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/providers/{provider}/authorize:
    get:
      tags: [Auth]
      operationId: getProviderAuthorizeUrl
      summary: Get the OAuth authorize URL for a provider
      description: |
        **Status:** Implemented.

        Get the OAuth authorize URL for a provider.

        The server keeps a single-use `state` and a PKCE verifier. The web app remembers where the user was
        going; the server accepts no redirect target, so it cannot be used as an open redirect.

        **Frontend flow:**

        No prior API calls or authentication are required to start provider sign-in. The selected provider must be configured on the backend; an unavailable provider returns 404.

        1. Put `github`, `gitlab`, or `bitbucket` in `{provider}` and call this endpoint.
        2. Navigate the browser to response `url`. The backend creates the single-use OAuth state and PKCE verifier; the frontend must not manufacture them.
        3. After provider consent, the browser returns to `<WEB_APP_URL>/auth/callback/{provider}`. Read `code` and `state` from its query string and pass them to `POST /v1/auth/providers/{provider}/callback`.
        Keep any intended post-login destination or invitation URL token in frontend state across the redirect.

      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/providers/{provider}/callback:
    post:
      tags: [Auth]
      operationId: completeProviderSignIn
      summary: Complete an OAuth sign-in
      description: |
        **Status:** Implemented.

        Complete an OAuth sign-in.

        If the provider identity is already linked, that account signs in. Otherwise the provider's verified
        email is matched to an existing account (and linked) or a new account is created. A provider account
        with no verified email is rejected with 422.

        **Frontend flow:**

        No existing session is required.

        1. Call `GET /v1/auth/providers/{provider}/authorize` and navigate to response `url`.
        2. Wait for the provider to redirect to the frontend callback. Send its query parameters `code` and `state` unchanged as this request's JSON fields, using the same `{provider}`. Do not call this endpoint with a fabricated code or state; state expires after 10 minutes and is single-use.
        3. Save response `token`, `expires_at`, and `user`. Use `token` in `Authorization: Bearer <token>` for `GET /v1/me`, `GET /v1/teams`, and later protected requests.

        A new account is sent the welcome email. Send `client` as for `POST /v1/auth/email-links/verify`, for the new sign-in email.
        4. If sign-in started from an invitation, use the invite URL token retained by the frontend to preview and accept the invite after sign-in. OAuth sign-in does not automatically accept it.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. Idempotent replay/deduplication is not implemented in the current gateway/services; do not assume a retry is deduplicated.
      security: []
      parameters:
        - { $ref: '#/components/parameters/Provider' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
                client: { $ref: '#/components/schemas/SignInClient' }
      responses:
        '200':
          description: Session created, or, for an account with two-factor on, a challenge to finish with `POST /v1/auth/two-factor`.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Session' }
                  - { $ref: '#/components/schemas/TwoFactorChallenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '502': { description: The provider could not be reached. }
  /auth/email-changes/verify:
    post:
      tags: [Auth]
      operationId: confirmEmailChange
      summary: Confirm a new email
      description: |
        **Status:** Implemented.

        Follows the link `POST /v1/me/email` mailed to the new address. No session is needed, since it may open in another browser. The account's email becomes the new address and sign-in links go there from now on; the old address is told it changed. Git provider sign-ins are unaffected. The token works once.

        **Frontend flow:**

        1. `/account/confirm-email?token=…` sends the token here.
        2. On 200, say "Your email is now <email>." On 401, the link expired or was used: ask for a new one from Account. On 409, another account already uses the address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string, format: email }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /auth/two-factor:
    post:
      tags: [Auth]
      operationId: completeTwoFactorSignIn
      summary: Finish signing in with a two-factor code
      description: |
        **Status:** Implemented.

        The second step of signing in for an account with two-factor on: the screen that asks for the code after the email link or the provider. A code from the app works once; a recovery code works once ever. The challenge lasts 10 minutes and yields one session.

        **Frontend flow:**

        No authentication is required.

        1. Sign in with `POST /v1/auth/email-links/verify` or `POST /v1/auth/providers/{provider}/callback`. When the response has `two_factor_required: true`, keep `challenge_token` (server side, like the session) and show the code screen, with a way to enter a recovery code instead.
        2. Send the code with `challenge_token`, and `client` as on the first step (the new sign-in email is sent here, not on the first step). A wrong code answers 422 on `code`: let the person try again with the same `challenge_token`. 401 means the challenge expired or was used: start signing in again. 429 means too many wrong codes: show the detail.
        3. Use the returned session exactly as the first step's would have been, `invite_token` included.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_token, code]
              properties:
                challenge_token: { type: string }
                code: { type: string, description: 'The 6-digit code from the authenticator app, or a recovery code (`abcd-efgh`; case, spaces and the dash are ignored).', examples: ['123456', 'k7pm-x2qa'] }
                client: { $ref: '#/components/schemas/SignInClient' }
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Five wrong codes in a row; codes are refused for 15 minutes. The detail says how long is left. }
  /auth/sessions/current:
    delete:
      tags: [Auth]
      operationId: signOut
      summary: Sign out
      description: |
        **Status:** Implemented.

        Sign out.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call this endpoint with the current session bearer token when signing out; `GET /v1/me` is optional, not a prerequisite. After 204, remove the frontend session and cached user/team state. This revokes only the supplied session.

      responses:
        '204': { description: Session revoked. }
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user
      description: |
        **Status:** Implemented.

        Current user, with their teams and each team's newest projects, so the app can render its shell from one call.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call this endpoint on app startup or when refreshing the signed-in profile. No team selection or other API call is required after obtaining a session. Use response `id` for actions targeting the current user, and `teams` for the team switcher and project lists; a 401 requires a new sign-in. A 502 means teams could not be loaded; the user is never returned without them.

      responses:
        '200':
          description: The signed-in user with their teams, each with its newest projects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      operationId: updateCurrentUser
      summary: Update profile
      description: |
        **Status:** Implemented.

        Update your own profile — `name`, `avatar_url`, or both.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Read `GET /v1/me` to populate the form, then submit changed `name` or `avatar_url` here. There is no `{user}` path value; the bearer identity selects the profile. No team selection is required.

        **Permissions:** Bearer authentication. The profile is the bearer's own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                username: { type: string, minLength: 2, maxLength: 39, pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$', description: Lowercased before it is checked. 409 when someone else has it. }
                avatar_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
                time_zone: { type: string, enum: [Africa/Lagos, Africa/Accra, Africa/Johannesburg, Africa/Nairobi, Africa/Cairo, Europe/London, America/New_York] }
                product_updates: { type: boolean }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Auth]
      operationId: deleteCurrentUser
      summary: Delete account
      description: |
        **Status:** Implemented.

        Deletes the signed-in account (Account > Danger zone). A team with nobody else in it goes with the account, as a team deletion would (Git connections, domains, projects, invites). A team they're the **only owner** of that has anyone else in it (an admin isn't an owner) **blocks** the deletion: 409, and nothing is touched, until another member is made an owner or the team is deleted, so nobody loses a team to someone else's account deletion. They leave every other team, whose other owners keep it. Their sessions, sign-in methods, two-factor and API tokens go as well. Signing in later with the same address makes a new account.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or a provider. Use the returned `token` as `Authorization: Bearer <token>`.
        2. When the Delete account dialog opens, call `GET /v1/me/memberships`. While `blocked` isn't empty, list those teams with what to do (make someone else an owner, or delete the team) and don't offer the delete. Otherwise name the teams in `deleted` ("… goes too"), with `project_count` from `GET /v1/me` for each.
        3. Send the account's email address, typed back, as `confirm`. On 204 the session no longer works: send the person to the signed-out site.

        **Permissions:** A session only; API tokens get 403. A wrong `confirm` is 422 and touches nothing. If a team can't be deleted (its Git providers can't be disconnected, say) the call answers that team's error and the account is kept; calling again is safe and picks up where it stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: "The account's email address, typed back. Case and surrounding spaces don't matter." }
      responses:
        '204': { description: Deleted. The session no longer works. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'A team they solely own still has others in it. `detail` names it; `GET /v1/me/memberships` lists it in `blocked`. Nothing was changed.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /me/email:
    post:
      tags: [Auth]
      operationId: requestEmailChange
      summary: Change email
      description: |
        **Status:** Implemented.

        Account > Profile > Email. Mails a confirm link to the new address; the account keeps its email until the link is followed (`POST /v1/auth/email-changes/verify`). The link works once and expires in an hour. Whether another account already has the address isn't said here, so this can't be used to find out who has signed up; the confirm refuses it (409).

        **Frontend flow:**

        1. Send the new address. On 202, say "We sent a link to <email>. Open it to switch." and keep showing the current address.
        2. The link opens `/account/confirm-email?token=…` in the web app, which calls `POST /v1/auth/email-changes/verify`.

        **Permissions:** A session only; API tokens get 403. Shares the sign-in email budget per address (429 with `RateLimit` headers).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Sent. Nothing has changed yet.
          content:
            application/json:
              schema:
                type: object
                required: [email, expires_at]
                properties:
                  email: { type: string, format: email, description: 'The new address, lowercased.' }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /me/memberships:
    get:
      tags: [Auth]
      operationId: getAccountDeletionPlan
      summary: What deleting the account does to your teams
      description: |
        **Status:** Implemented.

        For the Delete account dialog. Each team carries its `plan`: say that a team on `pro` loses its paid plan with it, with no refund. `deleted`: the teams that are only this person, which go with the account. `blocked`: teams they're the only owner of that have others in them (`members` counts everyone); while any is listed, `DELETE /v1/me` answers 409. `left`: the teams they would leave, which their other owners keep. `DELETE /v1/me` does exactly this. API tokens get 403.
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, blocked, left]
                properties:
                  deleted:
                    type: array
                    items: { type: object, required: [id, slug, name, plan], properties: { id: { type: string }, slug: { type: string }, name: { type: string }, plan: { $ref: '#/components/schemas/PlanId' } } }
                  blocked:
                    type: array
                    items: { type: object, required: [id, slug, name, members, plan], properties: { id: { type: string }, slug: { type: string }, name: { type: string }, members: { type: integer }, plan: { $ref: '#/components/schemas/PlanId' } } }
                  left:
                    type: array
                    items: { type: object, required: [id, slug, name, plan], properties: { id: { type: string }, slug: { type: string }, name: { type: string }, plan: { $ref: '#/components/schemas/PlanId' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------- Teams ----------
  /me/two-factor:
    get:
      tags: [Auth]
      operationId: getTwoFactor
      summary: Two-factor status
      description: |
        **Status:** Implemented.

        The Two-factor card on Account: whether it is on, since when, and how many recovery codes are left. `GET /v1/me` also has `two_factor_enabled`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call when Account opens. Show "Turn on two-factor" when `enabled` is false; otherwise the date and "N of 10 recovery codes left" with "Generate new codes" and "Turn off". Codes themselves are never shown again after they are made.

        **Permissions:** The signed-in user; a session is enough.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Auth]
      operationId: startTwoFactorSetup
      summary: Start turning on two-factor
      description: |
        **Status:** Implemented.

        The first step of "Turn on two-factor": a new secret for the authenticator app. Nothing is on until `POST /v1/me/two-factor/confirm` succeeds; starting again replaces the secret. 409 when two-factor is already on.

        Design note: Figma has no QR step yet (the stub turned two-factor on in one click); the modal should show the QR code, the key below it, and a 6-digit code field.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call when the person clicks Turn on two-factor. Render `otpauth_url` as a QR code and show `secret` for manual entry, then ask for the 6-digit code the app shows and send it to `POST /v1/me/two-factor/confirm`. Never store or log the secret.

        **Permissions:** The signed-in user; a session is enough.
      responses:
        '200':
          description: The secret to add to the app.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_url]
                properties:
                  secret: { type: string, description: 'Base32, for typing into the app by hand ("Can''t scan? Enter this key").', examples: [JBSWY3DPEHPK3PXP] }
                  otpauth_url: { type: string, description: 'Render as the QR code. It names the account as `Orbits:<email>`.', examples: ['otpauth://totp/Orbits%3Aada%40example.com?secret=JBSWY3DPEHPK3PXP&issuer=Orbits&algorithm=SHA1&digits=6&period=30'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/two-factor/confirm:
    post:
      tags: [Auth]
      operationId: confirmTwoFactor
      summary: Turn on two-factor with the first code
      description: |
        **Status:** Implemented.

        The second step: the first code from the app proves it was set up, and turns two-factor on. The response carries the 10 recovery codes, shown this once (stored as hashes only).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. First call `POST /v1/me/two-factor`. Send the code the app shows. On 200, show the recovery codes with Copy and Download, and say they won't be shown again. A wrong code answers 422 on `code` (check the phone's clock; the newest code); 409 means there is no setup in progress, or it's already on.

        **Permissions:** The signed-in user; a session is enough.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'A code from the authenticator app, or (to turn off or make new codes) a recovery code.' }
      responses:
        '200':
          description: Two-factor is on. The recovery codes are shown this once.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, since, recovery_codes]
                properties:
                  enabled: { const: true }
                  since: { type: string, format: date-time }
                  recovery_codes: { type: array, items: { type: string }, minItems: 10, maxItems: 10, examples: [[k7pm-x2qa, ra3d-hw9e]] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many wrong codes; try again after the time in the detail. }
  /me/two-factor/disable:
    post:
      tags: [Auth]
      operationId: disableTwoFactor
      summary: Turn off two-factor
      description: |
        **Status:** Implemented.

        Turn two-factor off. It takes a current code (or a recovery code), so a session on its own can't. A team that requires two-factor then refuses this person until it's back on.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. From the Two-factor card's Turn off, ask for a code and send it. After 204, refresh `GET /v1/me/two-factor`. 422 on `code` for a wrong one; 409 when it's already off.

        **Permissions:** The signed-in user; a session is enough.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'A code from the authenticator app, or (to turn off or make new codes) a recovery code.' }
      responses:
        '204': { description: Two-factor is off and the recovery codes are gone. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many wrong codes; try again after the time in the detail. }
  /me/two-factor/recovery-codes:
    post:
      tags: [Auth]
      operationId: regenerateRecoveryCodes
      summary: New recovery codes
      description: |
        **Status:** Implemented.

        "Generate new codes": replaces the recovery codes with 10 new ones, shown this once. Takes a current code (or a recovery code).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Ask for a code, send it, then show the new codes as after turning two-factor on. The old codes stop working at once.

        **Permissions:** The signed-in user; a session is enough.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'A code from the authenticator app, or (to turn off or make new codes) a recovery code.' }
      responses:
        '200':
          description: The new codes, shown this once. The old ones stop working.
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string }, minItems: 10, maxItems: 10 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { description: Too many wrong codes; try again after the time in the detail. }
  /teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: Teams the caller belongs to
      description: |
        **Status:** Implemented.

        Teams the caller belongs to.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. No team ID or other prerequisite API call is required after sign-in. Call this endpoint to populate the team switcher; retain `items[].id`, `items[].slug`, and `items[].role`. If `items` is empty, offer `POST /v1/teams` or invitation acceptance rather than calling a team-scoped route. Pagination is not implemented yet; `next_cursor` is currently null.

      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: Teams.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPage' }
    post:
      tags: [Teams]
      operationId: createTeam
      summary: Create a team
      description: |
        **Status:** Implemented.

        Create a team.

        The caller becomes the owner.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. No existing team or membership is required. An optional `GET /v1/teams` can check whether onboarding is needed. Collect `name` and a unique, non-reserved `slug`, then call this endpoint. The response is a Team: retain its `id` or `slug` for `{team}` and its `role` (owner). On 409, ask for another slug.
        3. Send the onboarding form's "Invite teammates" addresses in the same request as `invites` (up to 20). Each becomes a pending Member invite, written with the team in one transaction and emailed afterwards; duplicates and the caller's own address are dropped. No follow-up invite calls are needed; add more later with `POST /v1/teams/{team}/invites`.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { $ref: '#/components/schemas/Slug' }
                invites:
                  type: array
                  maxItems: 20
                  items: { type: string, format: email }
                  description: Teammates to invite as Members; each gets an email with a link to join.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Teams]
      operationId: getTeam
      summary: Get a team
      description: |
        **Status:** Implemented.

        Get a team.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The caller must already be a member. Use this endpoint to refresh the selected team and its current `role`; team creation is not required when a reference is already known. A missing team and a team the caller cannot access both return 404.

      responses:
        '200':
          description: The team, with its members and pending email invites.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Teams]
      operationId: updateTeam
      summary: Rename, change slug, avatar, default region, or security rules
      description: |
        **Status:** Implemented.

        Rename, change slug, avatar, default region, or security rules.

        Changing the slug breaks old dashboard links. All settings require an owner or admin.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}` to populate the settings form and inspect `role`. All setting changes require owner or admin, not only security changes. Send only edited fields. If `slug` changes, use the returned `slug` for subsequent frontend navigation and calls; the stable `id` remains usable.

        `sign_in_methods`, `session_max_age_days` and `require_two_factor` are the Security tab: a member whose session doesn't meet them gets 403 on the team with a sentence to show ("This team only allows signing in with GitHub…", "…sign in again every 7 days…"), while their other teams work. `sign_in_methods` answers 422 when it leaves out the method the caller signed in with (`GET /v1/me` `session.method`). `inviters` is "Who can invite". `notifications` changes Settings > Notifications switches; read them from `GET /v1/teams/{team}`.

        `require_two_factor`: turning it on answers 422 on `require_two_factor` unless the caller has two-factor on themselves. Once on, every `/v1/teams/{team}/...` route answers 403 ("This team requires two-factor authentication…") to members without it, except leaving the team (`DELETE /v1/teams/{team}/members/{their own id}`). The Security tab's "members without two-factor" is `members[].user.two_factor_enabled: false` in `GET /v1/teams/{team}`, as of each member's last visit.

      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: Delete a team
      description: |
        **Status:** Implemented.

        Delete team on Settings > General (Figma "Delete team"): the team goes once its URL is typed back. Its Git connections are disconnected first (GitHub's App is uninstalled from the account, GitLab and Bitbucket webhooks removed); if that fails nothing is deleted (503). Then its domains and Orbits DNS zones, every project with its deployments, variables and alerts, its activity, and the team with its members and pending invites. Deployed apps stop being served. A paid Pro plan ends with the team, with no refund: nothing is charged for it again and the saved card is forgotten, while the invoices already paid are kept as the record. Show a warning when `plan` is `pro`. It cannot be undone.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Show the modal only to an owner (`role: owner` from `GET /v1/teams/{team}`), with the counts the settings page already has. Send the typed URL as `confirm`. The answer is a finished Operation (`state: succeeded`); after it, the team answers 404, so leave for another team or create one. 422 on `confirm` when it isn't the team's URL.

        **Permissions:** Owner only. Admins, members and viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: "The team's URL (slug), typed back.", examples: [shady-ventures] }
      responses:
        '202':
          description: Deleted. A finished Operation the caller can read with `GET /v1/operations/{operation}`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { description: "The team's Git connections couldn't be disconnected; nothing was deleted." }
  /teams/{team}/ownership-transfers:
    post:
      tags: [Teams]
      operationId: transferTeamOwnership
      summary: Transfer ownership to another member
      description: |
        **Status:** Planned; not implemented in the current backend. The flow below is a draft and its planned endpoints are not callable on staging.

        Transfer ownership to another member.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The proposed flow calls `GET /v1/teams/{team}/members`, selects an active member, and sends that row's `user.id` as body `user_id`. Do not use an invited row or its `invite_id`. The draft does not yet define exact role checks or atomic transfer semantics for this route. Refresh the team and member list after success.

        **Permissions:** Bearer authentication is specified by the draft. Additional role checks are unimplemented; where this description does not name a role, the draft leaves it unspecified.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
      responses:
        '200':
          description: Ownership transferred.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /teams/{team}/overview:
    get:
      tags: [Teams]
      operationId: getTeamOverview
      summary: Dashboard overview for a time range
      description: |
        **Status:** Implemented.

        Dashboard overview for a time range, worked out when asked. `deployments.total` counts deployments started in the range, and `delta_vs_previous` compares it with the range before (the 24 hours, 7 or 30 days before that). `average_build_seconds` is the mean build of those that went ready, 0 when none did. `requests.total` counts requests to any of the team's deployments, production and previews, in the range; `month_to_date` since midnight on the 1st in Lagos. Both are 0 while the log store can't be reached. `projects.failing` and `needs_attention` are the projects whose latest deployment failed. `series` cuts the range into equal slices, oldest first (7 for `24h` and `7d`, 4 for `30d`), and gives each one's deployments, average ready build (0 when none) and requests, so `series.deployments` adds up to `deployments.total`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Any member may call this endpoint after team selection. Choose `range` from `24h`, `7d`, or `30d` (default `24h`). No project or deployment calls are prerequisites; an empty/new team can still load its overview.

      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { name: range, in: query, schema: { type: string, enum: [24h, 7d, 30d], default: 24h } }
      responses:
        '200':
          description: Aggregated figures and recent items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamOverview' }
  /teams/{team}/notifications:
    get:
      tags: [Teams]
      operationId: listNotifications
      summary: Notifications for the caller in this team
      description: |
        **Status:** Implemented.

        The top bar's notifications: the team activity lines worth a nudge, newest first, with whether the caller has read each. They are a failed deployment (`deployment.failed`), a domain going live (`domain.live`) or stopping pointing at Orbits (`domain.misconfigured`), a certificate that couldn't be issued or isn't renewing (`domain.certificate.failed`), a member joining (`team.member.added`, but not the caller's own) and an alert firing (`alert.fired`). The list goes back 30 days, and no further than when the caller joined the team. `unread_count` counts the unread ones, up to 100, whatever the page.

        **Frontend flow:**

        1. Sign in, then call `GET /v1/teams` and use the selected `items[].id` or `items[].slug` as `{team}`.
        2. Call this when the team's pages load, for the bell's badge (`unread_count`) and its list. `title` and `detail` are the two lines; `link` is a path of this API (`/teams/{team}/projects/{project}/deployments/{deployment}`, `/teams/{team}/domains/{domain}`, `/teams/{team}/members`, `/teams/{team}/projects/{project}/alerts/{alert}`) for the app to open as its own page, null when there's nowhere to go. Send `next_cursor` as `cursor` for the next page.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: unread, in: query, schema: { type: boolean }, description: Only the ones the caller hasn't read. }
      responses:
        '200':
          description: Notifications.
