        metric: { $ref: '#/components/schemas/AlertMetric' }
        direction: { type: string, enum: [above, below], description: '`below` only for `requests`.' }
        threshold: { type: number }
        window_minutes: { type: integer, enum: [1, 5, 10, 30] }
        routes: { type: array, items: { type: string }, description: 'Routes as Observability names them; a trailing `*` matches a prefix. Empty for all routes.' }
        channels: { type: array, items: { $ref: '#/components/schemas/AlertChannel' } }
        'on': { type: boolean }
        state: { type: string, enum: [ok, firing] }
        since: { type: string, format: date-time, description: 'When it last fired or resolved, or was created or changed.' }
        last_value: { type: [number, 'null'], description: 'The value at the last check; null before one, or with too little traffic.' }
        checked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertPage:
      type: object
      required: [items, webhook_configured]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Alert' } }
        webhook_configured: { type: boolean, description: 'Whether the team has a webhook, so `webhook` can be chosen.' }
    AlertCreate:
      type: object
      required: [name, metric, threshold, window_minutes, channels]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        metric: { $ref: '#/components/schemas/AlertMetric' }
        direction: { type: string, enum: [above, below], default: above }
        threshold: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        window_minutes: { type: integer, enum: [1, 5, 10, 30] }
        routes: { type: array, maxItems: 10, items: { type: string, maxLength: 200 }, default: [] }
        channels: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AlertChannel' } }
        'on': { type: boolean, default: true }
    AlertUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        metric: { $ref: '#/components/schemas/AlertMetric' }
        direction: { type: string, enum: [above, below] }
        threshold: { type: number, exclusiveMinimum: 0, maximum: 1000000 }
        window_minutes: { type: integer, enum: [1, 5, 10, 30] }
        routes: { type: array, maxItems: 10, items: { type: string, maxLength: 200 } }
        channels: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AlertChannel' } }
        'on': { type: boolean }
    AlertPreviewRequest:
      type: object
      required: [metric, window_minutes]
      properties:
        metric: { $ref: '#/components/schemas/AlertMetric' }
        direction: { type: string, enum: [above, below] }
        window_minutes: { type: integer, enum: [1, 5, 10, 30] }
        routes: { type: array, maxItems: 10, items: { type: string, maxLength: 200 } }
    AlertPreview:
      type: object
      required: [median_requests, minimum_requests, value]
      properties:
        median_requests: { type: number, description: 'Median requests per window over the last 24 hours.' }
        minimum_requests: { type: integer, description: 'What a window needs before the rule acts: 20, or 0 for `requests`.' }
        value: { type: [number, 'null'], description: 'The value over the last window, or null with too little traffic.' }
    AlertDelivery:
      type: object
      required: [channel, status, error, at]
      properties:
        channel: { $ref: '#/components/schemas/AlertChannel' }
        status: { type: string, enum: [pending, delivered, failed] }
        error: { type: [string, 'null'], description: 'Why the last try failed, e.g. "The webhook answered 500".' }
        at: { type: [string, 'null'], format: date-time, description: When it was delivered or given up on. }
    AlertEvent:
      type: object
      required: [id, kind, reason, value, at, deliveries]
      properties:
        id: { type: string }
        kind: { type: string, enum: [fired, resolved] }
        reason: { type: [string, 'null'], enum: [recovered, quiet, changed, 'off', deleted, null], description: 'Why it resolved: its value came back, its traffic went too quiet to measure (`value` is null), or it was changed, switched off or deleted while firing.' }
        value: { type: [number, 'null'] }
        at: { type: string, format: date-time }
        deliveries: { type: array, items: { $ref: '#/components/schemas/AlertDelivery' } }
    AlertEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AlertEvent' } }
        next_cursor: { type: [string, 'null'] }
    AlertWebhook:
      type: object
      required: [url, secret_last4, updated_at]
      properties:
        url: { type: string, format: uri }
        secret_last4: { type: string }
        updated_at: { type: string, format: date-time }
    AlertChannels:
      type: object
      required: [webhook]
      properties:
        webhook: { oneOf: [{ $ref: '#/components/schemas/AlertWebhook' }, { type: 'null' }] }
    AlertWebhookSet:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2000, description: An https URL without a user name or password. }
        rotate_secret: { type: boolean, default: false }
    AlertWebhookSaved:
      type: object
      required: [webhook, secret]
      properties:
        webhook: { $ref: '#/components/schemas/AlertWebhook' }
        secret: { type: [string, 'null'], description: 'The new secret (64 hex characters), shown this once; null when it was kept.' }
    AlertWebhookTest:
      type: object
      required: [delivered, status, error]
      properties:
        delivered: { type: boolean }
        status: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
    AlertWebhookPayload:
      type: object
      description: What the team's webhook receives for `alert.fired` and `alert.resolved`; `alert.test` carries `type`, `delivery_id`, `at` and `team` only.
      required: [type, delivery_id, event_id, at, reason, value, summary, measure, rule, project, team, url]
      properties:
        type: { type: string, enum: [alert.fired, alert.resolved] }
        delivery_id: { type: string, description: The same on every retry; drop a repeat. }
        event_id: { type: string }
        at: { type: string, format: date-time }
        reason: { type: [string, 'null'], enum: [recovered, quiet, changed, 'off', deleted, null] }
        value: { type: [number, 'null'] }
        summary: { type: [string, 'null'], examples: ['8% errors over 5 minutes'] }
        measure:
          oneOf:
            - type: object
              required: [requests, errors]
              properties:
                requests: { type: integer }
                errors: { type: integer }
            - type: 'null'
        rule:
          type: object
          required: [id, name, metric, direction, threshold, window_minutes, routes]
          properties:
            id: { type: string }
            name: { type: string }
            metric: { $ref: '#/components/schemas/AlertMetric' }
            direction: { type: string, enum: [above, below] }
            threshold: { type: number }
            window_minutes: { type: integer }
            routes: { type: array, items: { type: string } }
        project:
          type: object
          required: [id, slug, name]
          properties: { id: { type: string }, slug: { type: string }, name: { type: string } }
        team:
          type: object
          required: [id, slug]
          properties: { id: { type: string }, slug: { type: string } }
        url: { type: string, format: uri, description: The project's Observability page. }
    RuntimeLogPage:
      type: object
      required: [as_of, items, total, total_capped, next_cursor]
      properties:
        as_of: { type: string, format: date-time, description: The end of the range. }
        items: { type: array, items: { $ref: '#/components/schemas/RuntimeLog' } }
        total: { type: integer, maximum: 10000, description: 'Entries in the range that match the filters, counted up to 10,000.' }
        total_capped: { type: boolean, description: 'More than 10,000 entries match, so `total` is 10,000: show it as "10,000+".' }
        next_cursor: { type: [string, 'null'] }
    ProjectDeploymentPage:
      type: object
      required: [items, total, all, branches, current, auto_deploy_paused, domains, building, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Deployment' } }
        total: { type: integer, description: Deployments that match the filters. }
        all: { type: integer, description: 'Every deployment of the project, filters aside.' }
        branches: { type: array, items: { type: string }, description: 'Branches that have deployments, most recent first.' }
        current:
          description: What production serves; what the inspector shows when nothing is picked.
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/Deployment' }
        auto_deploy_paused: { type: boolean, description: 'True after a rollback, until a promote or `POST .../production` lifts it.' }
        domains: { type: array, items: { $ref: '#/components/schemas/ProjectDomain' }, description: "What production answers on, once it has a deployment: the team's domains serving the project's production (working ones first, not a branch's or a redirect), then its free address." }
        building: { type: boolean, description: Something is queued or building. }
        next_cursor: { type: [string, 'null'] }
    TeamDeploymentPage:
      type: object
      required: [items, total, this_week, projects, authors, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Deployment' } }
        total: { type: integer }
        this_week: { type: integer, description: Deployments created since Monday (UTC). }
        projects: { type: array, items: { $ref: '#/components/schemas/DeploymentProject' }, description: 'Projects that have deployments, for the Project filter.' }
        authors:
          type: array
          description: Commit authors, for the Author filter.
          items: { type: object, required: [name], properties: { name: { type: string } } }
        next_cursor: { type: [string, 'null'] }
    ProductionChange:
      type: object
      required: [deployment, auto_deploy_paused]
      properties:
        deployment: { $ref: '#/components/schemas/Deployment' }
        auto_deploy_paused: { type: boolean }

    # ----- Env vars -----
    EnvVarInput:
      type: object
      required: [key, value]
      properties:
        key: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z_][A-Za-z0-9_]*$', examples: [STRIPE_SECRET_KEY] }
        value: { type: string, maxLength: 32768, writeOnly: true, description: 'May be empty; at most 32 KiB (32,768 bytes) once encoded. Never returned except as described on `EnvVar.value`.' }
        environments:
          type: array
          minItems: 1
          uniqueItems: true
          default: [production, preview]
          description: Used by Production and Preview unless the user picks otherwise.
          items: { $ref: '#/components/schemas/EnvironmentName' }
        sensitive: { type: boolean, default: true, description: 'Write-only: nobody can read the value back, only replace it.' }
    EnvVarCreate:
      type: object
      required: [variables]
      properties:
        variables:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/EnvVarInput' }
        on_conflict:
          type: string
          enum: [fail, replace]
          default: fail
          description: '`fail` (Add variable): a key that already exists is 409 and nothing is saved. `replace` (Import .env): existing keys get the new value and environments.'
    EnvVarUpdate:
      type: object
      minProperties: 1
      properties:
        value: { type: string, maxLength: 32768, writeOnly: true }
        environments:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/EnvironmentName' }
    EnvVar:
      type: object
      required: [id, key, value, sensitive, environments, pending_redeploy, created_at, updated_at, updated_by]
      properties:
        id: { type: string, examples: [var_01J9ZK3Q] }
        key: { type: string }
        value: { type: [string, 'null'], description: 'Only for a non-sensitive variable whose key is meant for the browser (`NEXT_PUBLIC_`, `NUXT_PUBLIC_`, `PUBLIC_`, `VITE_`, `REACT_APP_`, `EXPO_PUBLIC_` prefix, or a `_PUBLIC_KEY` suffix). Otherwise null; use `POST .../env/{key}/reveal`.' }
        sensitive: { type: boolean }
        environments: { type: array, items: { $ref: '#/components/schemas/EnvironmentName' } }
        pending_redeploy: { type: boolean, description: 'Changed since the latest deployment; shows the "New" tag.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        updated_by: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
    EnvVarPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          required: [items, total, last_changed, redeploy]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/EnvVar' } }
            total: { type: integer, description: Variables matching the filters. }
            last_changed:
              oneOf:
                - { type: 'null' }
                - type: object
                  required: [at, by]
                  properties:
                    at: { type: string, format: date-time }
                    by: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
            redeploy:
              type: object
              required: [required, changed]
              properties:
                required: { type: boolean }
                changed: { type: integer }
    EnvVarBatchResult:
      type: object
      required: [items, created, replaced, redeploy_required]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EnvVar' } }
        created: { type: integer }
        replaced: { type: integer }
        redeploy_required: { type: boolean }
    EnvVarChange:
      type: object
      required: [item, redeploy_required]
      properties:
        item: { $ref: '#/components/schemas/EnvVar' }
        redeploy_required: { type: boolean }
    EnvVarDeleted:
      type: object
      required: [key, restorable_until, redeploy_required]
      properties:
        key: { type: string }
        restorable_until: { type: string, format: date-time }
        redeploy_required: { type: boolean }
    EnvVarValue:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
    EnvVarPull:
      type: object
      required: [environment, variables, skipped_sensitive]
      properties:
        environment: { $ref: '#/components/schemas/EnvironmentName' }
        variables: { type: object, additionalProperties: { type: string } }
        skipped_sensitive: { type: array, items: { type: string }, description: Keys left out because nobody can read them back. }

    # ----- Domains and DNS -----
    Redirect:
      type: object
      required: [to, status]
      properties:
        to: { type: string, description: 'The hostname it sends visitors to, keeping the path.' }
        status: { type: integer, enum: [301, 308] }
    DnsRecordType:
      type: string
      enum: [A, AAAA, CNAME, MX, TXT, CAA]
    DnsRecordInput:
      type: object
      required: [type, name, value, ttl]
      properties:
        type: { $ref: '#/components/schemas/DnsRecordType' }
        name: { type: string, maxLength: 253, examples: ['@', www, _dmarc], description: 'Relative to the zone; `@` for the apex.' }
        value: { type: string, maxLength: 2048, examples: ['10 mx.zoho.com', 'v=spf1 include:zoho.com ~all'], description: 'An MX record''s is its priority and server; a TXT record''s is its text without quotes.' }
        ttl: { type: integer, enum: [0, 60, 300, 3600, 86400], description: 'Seconds; `0` is Auto (5 minutes).' }
    DnsRecord:
      allOf:
        - { $ref: '#/components/schemas/DnsRecordInput' }
        - type: object
          required: [id, managed, used_by, updated_at]
          properties:
            id: { type: string, pattern: '^rec_' }
            managed: { type: boolean, description: Orbits keeps it for a project; it can't be changed here. }
            used_by:
              oneOf:
                - type: 'null'
                - type: object
                  required: [kind]
                  properties:
                    kind: { type: string, enum: [project, email] }
                    project:
                      type: object
                      required: [id, slug, name]
                      properties:
                        id: { type: string }
                        slug: { type: string }
                        name: { type: string }
            updated_at: { type: string, format: date-time }
    DnsRecordList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DnsRecord' } }
    DomainState:
      type: string
      enum: [pending, valid, misconfigured]
      description: '`pending`: its record isn''t there yet. `valid`: DNS points at Orbits. `misconfigured`: a record is there but points elsewhere (`seen` says where).'
    DnsMode:
      type: string
      enum: [external, orbits]
      description: '`external`: the team keeps its DNS provider and adds one record. `orbits`: the team hands the domain''s DNS to Orbits (an apex''s nameservers at its registrar, or NS records for a subdomain at its parent''s DNS).'
    Domain:
      type: object
      required: [id, name, apex, host, dns, state, project, branch, redirect, required_record, seen, nameservers, email, certificate, checked_at, created_at]
      properties:
        id: { type: string, pattern: '^dom_' }
        name: { type: string, examples: [shop.shadyventures.ng] }
        apex: { type: string, examples: [shadyventures.ng], description: 'The registrable part.' }
        host: { type: string, examples: [shop, '@'], description: 'What precedes the apex; `@` for the apex itself.' }
        dns: { $ref: '#/components/schemas/DnsMode' }
        state: { $ref: '#/components/schemas/DomainState' }
        project:
          description: What it serves or redirects for; null is "Not in use".
          oneOf:
            - type: 'null'
            - type: object
              required: [id, slug, name]
              properties:
                id: { type: string }
                slug: { type: string }
                name: { type: string }
        branch: { type: [string, 'null'], description: "The branch whose newest ready preview it serves; null for production." }
        redirect:
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/Redirect' }
        required_record:
          type: [object, 'null']
          description: 'The one record an external domain needs at its DNS provider: an A record at an apex (a CNAME can''t sit there), a CNAME below it. Null on Orbits DNS, which keeps the record itself.'
          required: [type, name, value]
          properties:
            type: { type: string, enum: [A, CNAME] }
            name: { type: string, examples: [shop, '@'] }
            value: { type: string, examples: [cname.theorbits.app] }
        seen: { type: [string, 'null'], examples: ['CNAME old-host.example.net', 'A 41.203.67.12', 'NS ns1.whogohost.com, ns2.whogohost.com'], description: 'What the last check found where the record (or, for an Orbits DNS zone, the nameservers) should be; null when nothing was there.' }
        nameservers:
          type: [object, 'null']
          description: 'An Orbits DNS zone''s nameservers: for an apex, to set at its registrar; for a subdomain zone, to add as NS records for it at its parent''s DNS. `pointing` once the zone is handed to them. Null for any other domain, including names inside a zone.'
          required: [names, pointing]
          properties:
            names: { type: array, items: { type: string }, examples: [[ns1.theorbits.app, ns2.theorbits.app]] }
            pointing: { type: boolean }
        email: { type: [string, 'null'], enum: [zoho, google, microsoft, null], description: 'The provider Email setup added records for, on an Orbits DNS zone.' }
        certificate:
          type: object
          required: [state, issued_at, expires_at]
          properties:
            state: { type: string, enum: [none, pending, active, failed], description: '`none`: not needed yet (DNS not found, or the domain isn''t in use). `pending`: DNS points here and the certificate is being issued; Orbits waits until public DNS answers for the name before asking Let''s Encrypt. `failed`: the last try failed; it is tried again 5, 15, 30, then 60 minutes after each failure.' }
            issued_at: { type: [string, 'null'], format: date-time }
            expires_at: { type: [string, 'null'], format: date-time, description: 'It renews on its own about 30 days before.' }
        checked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    DomainPreview:
      type: object
      required: [domain, apex, host, dns, zone, required_record, nameservers, existing]
      properties:
        domain: { type: string, examples: [pay.shadyventures.ng], description: 'As Add would store it: scheme, path and trailing dot off, lowercased.' }
        apex: { type: string }
        host: { type: string, examples: [pay, '@'] }
        dns: { $ref: '#/components/schemas/DnsMode', description: 'What it would use. A name inside one of the team''s zones is on Orbits DNS whatever was asked.' }
        zone: { type: [string, 'null'], examples: [shadyventures.com], description: 'The team''s Orbits DNS zone it would be in (itself, when it would become a zone); null on outside DNS.' }
        required_record:
          type: [object, 'null']
          description: The one record to add at the team's DNS provider, on outside DNS.
          required: [type, name, value]
          properties:
            type: { type: string, enum: [A, CNAME] }
            name: { type: string }
            value: { type: string }
        nameservers: { type: [array, 'null'], items: { type: string }, description: 'When it would become a zone: the nameservers to set (an apex) or add as NS records at its parent''s DNS (a subdomain).' }
        existing:
          description: The team has this domain already. Add links it to the request's project or redirect when it serves nothing; otherwise it's a 409.
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/Domain' }
    EmailSetup:
      type: object
      required: [zone, provider, email_records, providers]
      properties:
        zone: { type: string, examples: [shadyventures.com] }
        provider: { type: [string, 'null'], enum: [zoho, google, microsoft, null], description: 'Set up now: the Active badge. Null when none is.' }
        email_records: { type: integer, description: 'The zone''s mail records now (MX, SPF, Microsoft''s autodiscover), for "Already set up · 5 records".' }
        providers:
          type: array
          items:
            type: object
            required: [id, records]
            properties:
              id: { type: string, enum: [zoho, google, microsoft, other] }
              records: { type: array, items: { $ref: '#/components/schemas/DnsRecordInput' }, description: 'What Setup would add; empty for `other`.' }
    DomainList:
      type: object
      required: [as_of, items, summary, projects]
      properties:
        as_of: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/Domain' } }
        summary:
          type: object
          description: The team's domains whatever the filters.
          required: [total, apex, orbits, pending, misconfigured]
          properties:
            total: { type: integer }
            apex: { type: integer, description: 'How many are apex domains; the rest are subdomains.' }
            orbits: { type: array, items: { type: string }, description: 'Names of the domains on Orbits DNS.' }
            pending: { type: integer }
            misconfigured: { type: integer }
        projects:
          type: array
          description: The team's projects, for the project filter.
          items:
            type: object
            required: [id, slug, name]
            properties:
              id: { type: string }
              slug: { type: string }
              name: { type: string }

    # ----- Integrations -----
    Integration:
      type: object
      required: [key, name, category, installed]
      properties:
        key: { type: string, examples: [github] }
        name: { type: string, examples: [GitHub] }
        category: { type: string, enum: [source_code, notifications, payments, monitoring] }
        description: { type: string, examples: ['Import repositories and deploy on every push.'] }
        available: { type: boolean, description: False when the integration is listed but cannot be installed yet. }
        installed: { type: boolean }
        status: { type: [string, 'null'], enum: [connected, needs_attention, null] }
        summary: { type: [string, 'null'], description: 'One line for the Installed tab, e.g. "Repositories for shadyventures".' }
        scope: { type: [string, 'null'], examples: [All projects] }
        installed_at: { type: [string, 'null'], format: date-time }
        installed_by:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
        fields:
          type: array
          description: Inputs needed to install. Secret values are never returned.
          items:
            type: object
            required: [name, secret]
            properties:
              name: { type: string }
              label: { type: string }
              secret: { type: boolean }
        projects: { type: array, items: { type: string } }
    GithubIntegration:
      type: object
      required: [key, status, account, connected_at, repository_count, webhook_events_this_month, manage_url, settings]
      properties:
        key: { const: github }
        status: { type: string, enum: [connected, needs_attention, suspended] }
        account:
          type: object
          required: [login, type]
          properties:
            login: { type: string, examples: [shadyventures] }
            type: { type: string, enum: [organization, user] }
            avatar_url: { type: [string, 'null'], format: uri }
        connected_by:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
        connected_at: { type: string, format: date-time }
        repository_count: { type: integer, description: Repositories Orbits can see ("Orbits can see 14 repositories"). }
        webhook_events_this_month: { type: integer, description: Deliveries received since the first of the month (UTC). }
        manage_url: { type: string, format: uri, description: 'GitHub page where the user changes which repositories Orbits can see ("Change on GitHub").' }
        settings:
          type: object
          required: [comment_preview_link, report_deploy_status, build_fork_pull_requests]
          properties:
            comment_preview_link: { type: boolean }
            report_deploy_status: { type: boolean }
            build_fork_pull_requests: { type: boolean }
    ChatEvent:
      type: string
      enum: [deploy.failed, deploy.live, domain.attention, member.joined]
      description: What Slack and Teams post. `deploy.live` is a production deploy that now serves the site; `domain.attention` a domain verified or misconfigured.
    WebhookEvent:
      type: string
      enum: [deployment.created, deployment.ready, deployment.failed, domain.updated, member.joined, project.created]
    IntegrationScopeInput:
      description: '`all`, or project ids or slugs.'
      oneOf:
        - const: all
        - type: array
          minItems: 1
          items: { type: string }
    IntegrationScope:
      description: '`all`, or the projects it is limited to. Projects deleted since drop out.'
      oneOf:
        - const: all
        - type: array
          items:
            type: object
            required: [id, slug, name]
            properties:
              id: { type: string }
              slug: { type: string }
              name: { type: string }
    SlackChannel:
      type: object
      required: [id, name]
      properties:
        id: { type: string, examples: [C024BE91L] }
        name: { type: string, description: Without the `#`., examples: [alerts] }
    NotificationIntegrationBase:
      type: object
      description: What Slack, Microsoft Teams and webhooks have in common. Each one declares and requires its own `key`.
      required: [status, installed_at, installed_by, deliveries_this_month]
      properties:
        status: { type: string, enum: [connected, needs_attention] }
        installed_at: { type: string, format: date-time }
        installed_by:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        deliveries_this_month: { type: integer, description: Messages delivered since the first of the month (UTC). }
    SlackIntegration:
      allOf:
        - { $ref: '#/components/schemas/NotificationIntegrationBase' }
        - type: object
          required: [key, workspace, slack_team, channels, scope]
          properties:
            key: { const: slack }
            workspace: { type: string, examples: [shadyventures.slack.com] }
            slack_team:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            channels:
              type: object
              description: Where each event goes; null posts nothing for it.
              required: [deploy.failed, deploy.live, domain.attention, member.joined]
              properties:
                deploy.failed: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SlackChannel' }] }
                deploy.live: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SlackChannel' }] }
                domain.attention: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SlackChannel' }] }
                member.joined: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SlackChannel' }] }
              additionalProperties: { oneOf: [{ type: 'null' }, { $ref: '#/components/schemas/SlackChannel' }] }
            scope: { $ref: '#/components/schemas/IntegrationScope' }
    TeamsIntegration:
      allOf:
        - { $ref: '#/components/schemas/NotificationIntegrationBase' }
        - type: object
          required: [key, url, alerts]
          properties:
            key: { const: teams }
            url: { type: string, description: 'The workflow''s host only, e.g. `https://prod-12.westeurope.logic.azure.com/…`.' }
            alerts: { type: array, items: { $ref: '#/components/schemas/ChatEvent' } }
    WebhooksIntegration:
      allOf:
        - { $ref: '#/components/schemas/NotificationIntegrationBase' }
        - type: object
          required: [key, url, events, secret_last4, scope]
          properties:
            key: { const: webhooks }
            url: { type: string, format: uri }
            events: { type: array, items: { $ref: '#/components/schemas/WebhookEvent' } }
            secret_last4: { type: string, examples: [k3Qz] }
            scope: { $ref: '#/components/schemas/IntegrationScope' }
    GitProviderIntegration:
      type: object
      required: [key, status, account, connected_at, repository_count, webhook_events_this_month, manage_url, settings]
      properties:
        key: { type: string, enum: [gitlab, bitbucket] }
        status: { type: string, enum: [connected, needs_attention], description: '`needs_attention`: the provider stopped accepting the connection; connect again.' }
        account:
          type: object
          required: [login, type]
          description: The person who connected the provider; Orbits acts as them.
          properties:
            login: { type: string, examples: [ada] }
            type: { const: user }
            avatar_url: { type: [string, 'null'], format: uri }
        connected_by:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        connected_at: { type: string, format: date-time }
        repository_count: { type: integer, description: Repositories Orbits can deploy (where it can add a webhook). }
        webhook_events_this_month: { type: integer, description: Deliveries received since the first of the month (UTC). }
        manage_url: { type: string, format: uri, description: "The provider page where the connected person sees or revokes Orbits' access." }
        settings:
          type: object
          required: [comment_preview_link, report_deploy_status, build_fork_pull_requests]
          properties:
            comment_preview_link: { type: boolean }
            report_deploy_status: { type: boolean }
            build_fork_pull_requests: { type: boolean }
    Repository:
      type: object
      required: [full_name, name, default_branch, private]
      properties:
        full_name: { type: string, examples: [shadyventures/storefront] }
        name: { type: string, examples: [storefront] }
        default_branch: { type: string }
        private: { type: boolean }
        updated_at: { type: string, format: date-time }
        pushed_at: { type: [string, 'null'], format: date-time, description: 'Last push, for "Last push" and "Updated 20m ago".' }
        framework:
          oneOf:
            - type: 'null'
            - type: object
              required: [key, label]
              properties:
                key: { type: string, examples: [nextjs] }
                label: { type: string, examples: [Next.js] }
        project:
          oneOf:
            - type: 'null'
            - type: object
              description: The project already imported from this repository.
              required: [id, slug, name]
              properties:
                id: { type: string, pattern: '^prj_' }
                slug: { type: string }
                name: { type: string }
    RepositoryPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          required: [items, total_count]
          properties:
            owner:
              type: object
              properties:
                login: { type: string }
                avatar_url: { type: [string, 'null'], format: uri }
            total_count: { type: integer }
            items: { type: array, items: { $ref: '#/components/schemas/Repository' } }
    RepositoryDetection:
      type: object
      required: [framework, install_command, build_command, output_directory, node_version, root_directory, detected_from]
      properties:
        framework:
          oneOf:
            - type: 'null'
            - type: object
              required: [key, label]
              properties:
                key: { type: string }
                label: { type: string }
                version: { type: [string, 'null'], examples: ['15'] }
        package_manager: { type: [string, 'null'], enum: [pnpm, yarn, npm, bun, null] }
        install_command: { type: [string, 'null'], examples: [pnpm install --frozen-lockfile] }
        build_command: { type: [string, 'null'], examples: [pnpm build] }
        output_directory: { type: [string, 'null'], examples: [.next] }
        node_version: { type: [string, 'null'], examples: [22.x] }
        root_directory: { type: string, examples: ['./'] }
        detected_from: { type: array, items: { type: string }, description: 'Files the result came from, e.g. `package.json`, `pnpm-lock.yaml`.' }
        monorepo:
          description: |
            Set when the repository root holds several apps (and only for the root: a `root_directory` request answers null). The root itself usually has no
            framework then, so offer `apps` as the choices for the Configure step's root directory and prefill from the chosen one by calling this endpoint again
            with its `root_directory`. `apps` lists workspace directories with a package.json and a detected framework (libraries are left out), at most 30
            directories are checked, and it can be partial when the provider is slow. Empty `apps` with a `tool` still means a monorepo: ask for the directory.
            A root with no app of its own and no workspace tool, such as `web/` beside `server/`, answers `tool: folders` with the apps in its top-level directories,
            and null when it has none.
          oneOf:
            - type: 'null'
            - type: object
              required: [tool, apps]
              properties:
                tool: { type: string, enum: [turborepo, nx, lerna, rush, pnpm, workspaces, folders], description: 'The most specific tool found. `workspaces` is npm, yarn or bun workspaces; `folders` means no tool, only apps in top-level directories.' }
                apps:
                  type: array
                  items:
                    type: object
                    required: [name, root_directory, framework]
                    properties:
                      name: { type: string, examples: ['@acme/web'], description: 'The package name, or the directory name when it has none.' }
                      root_directory: { type: string, examples: ['./apps/web'] }
                      framework:
                        type: object
                        required: [key, label]
                        properties:
                          key: { type: string }
                          label: { type: string }
                          version: { type: [string, 'null'] }

    # ----- Tokens, usage, activity -----
    UsageTotals:
      type: object
      required: [requests, bandwidth_bytes, build_minutes, function_runs, deployments, log_lines]
      properties:
        requests: { type: integer }
        bandwidth_bytes: { type: integer }
        build_minutes: { type: number, description: One decimal place. }
        function_runs: { type: integer }
        deployments: { type: integer }
        log_lines: { type: integer }
    UsageDay:
      type: object
      required: [date, totals]
      properties:
        date: { type: string, format: date }
        totals: { $ref: '#/components/schemas/UsageTotals' }
    Usage:
      type: object
      required: [month, current, months, days, totals, deleted_projects, previous, daily, by_project, logs_available]
      properties:
        logs_available: { type: boolean, description: 'False while the log store can''t be reached: requests, bandwidth and function runs are then zeros, not a quiet month; builds and deployments still count. Show the log figures as unavailable.' }
        month: { type: string, examples: ['2026-10'] }
        current: { type: boolean, description: 'This month, so the series stops at today.' }
        months: { type: array, items: { type: string }, description: 'From the team''s first deployment to now, newest first.' }
        days: { type: array, items: { type: string, format: date }, description: The month's days so far. }
        totals: { $ref: '#/components/schemas/UsageTotals' }
        deleted_projects:
          allOf: [{ $ref: '#/components/schemas/UsageTotals' }]
          description: Usage of projects deleted since, which `totals` includes and `by_project` doesn't; zeros when there is none.
        previous:
          oneOf:
            - type: object
              required: [month, totals]
              properties:
                month: { type: string }
                totals: { $ref: '#/components/schemas/UsageTotals' }
            - type: 'null'
          description: The same days of the month before; null when the team had no deployments before this month.
        daily: { type: array, items: { $ref: '#/components/schemas/UsageDay' } }
        by_project:
          type: array
          description: Every project the team has, most requests first. A deleted project's usage counts in the totals only.
          items:
            type: object
            required: [project_id, slug, name, totals, previous, daily, by_environment, preview_branches]
            properties:
              project_id: { type: string }
              slug: { type: string }
              name: { type: string }
              totals: { $ref: '#/components/schemas/UsageTotals' }
              previous: { oneOf: [{ $ref: '#/components/schemas/UsageTotals' }, { type: 'null' }] }
              daily: { type: array, items: { $ref: '#/components/schemas/UsageDay' } }
              by_environment:
                type: object
                additionalProperties: { $ref: '#/components/schemas/UsageTotals' }
                description: Keyed by `production`, `preview` or `development`, for those with usage.
              preview_branches: { type: integer, description: Branches with a preview deployment this month. }
    ActivityCategory:
      type: string
      enum: [deployments, domains, members, variables, integrations, projects, team]
      description: What a line is about, as the Activity page's type filter groups them. `domains` has no lines yet.
    Activity:
      type: object
      required: [id, type, category, actor, summary, project_id, project, deployment_id, failed, created_at]
      properties:
        id: { type: string, examples: [act_0193a1f2-6c1e-7d2a-9b3f-1e2d3c4b5a69] }
        type: { type: string, description: 'The event it was written from.', examples: [project.production.changed, deployment.failed, team.member.added] }
        category: { $ref: '#/components/schemas/ActivityCategory' }
        actor:
          type: object
          required: [kind, user_id, name]
          description: "Who did it: a member (`user`), a commit's author for a push (`git`, no `user_id`), or Orbits itself (`system`)."
          properties:
            kind: { type: string, enum: [user, system, git] }
            user_id: { type: [string, 'null'] }
            name: { type: string }
        summary: { type: string, description: 'The whole sentence, ready to show.', examples: [Ada promoted a1f9c2e to production] }
        project_id: { type: [string, 'null'] }
        project:
          type: [object, 'null']
          required: [id, slug, name]
          description: The project it's about, as it was named then.
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        deployment_id: { type: [string, 'null'], description: 'The deployment it''s about, for a link to its page.' }
        failed: { type: boolean, description: 'A build that failed: the page shows the line in red.' }
        created_at: { type: string, format: date-time }
    ActivityPage:
      type: object
      required: [as_of, items, total, total_capped, next_cursor, any, people, projects]
      properties:
        as_of: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/Activity' } }
        total: { type: integer, maximum: 10000, description: 'Lines that match the filters, counted up to 10,000.' }
        total_capped: { type: boolean, description: 'More than 10,000 lines match, so `total` is 10,000.' }
        next_cursor: { type: [string, 'null'] }
        any: { type: boolean, description: 'Whether there is any activity at all, the other filters aside: in the team, or in the project when `project` is set. For the empty state.' }
        people:
          type: array
          description: Everyone who appears in the feed (or the project's lines, with `project`), most recent first, for the person filter.
          items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
        projects:
          type: array
          description: Every project the feed mentions, most recent first, for the project filter.
          items: { type: object, required: [id, slug, name], properties: { id: { type: string }, slug: { type: string }, name: { type: string } } }
