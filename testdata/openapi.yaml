                key: { type: string, maxLength: 48, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', examples: [new-checkout] }
                description: { type: string, maxLength: 120 }
                type: { $ref: '#/components/schemas/FlagType' }
                environments:
                  type: object
