        **Permissions:** Owners, admins and members.
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /flags/definitions:
    get:
      tags: [Flags]
      operationId: getFlagDefinitions
      summary: An environment's flags, for the SDK
      security: [{ flagsKey: [] }]
      description: |
        **Status:** Implemented.

        Not for the web app: what `@useorbits/flags` fetches with the deployment's `ORBITS_FLAGS` key and evaluates in the app. Rules come first, in order (the first match's `serve`); then a boolean flag is off when `on` is false, otherwise on for `rollout`% of ids (by a stable hash of the flag's key and the id); a string or number flag serves `value`. Send `If-None-Match` with the last `ETag` to get a 304 while nothing has changed.
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: The environment's flags.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlagDefinitions' }
        '304': { description: Unchanged since the ETag sent. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /flags/exposures:
    post:
      tags: [Flags]
      operationId: reportFlagExposures
      summary: What the SDK checked, for "Seen in the last 24 hours"
      security: [{ flagsKey: [] }]
      description: |
        **Status:** Implemented.

        The SDK sends a report every minute or so while flags are being checked: each flag's number of checks and the ids they were for, as the first 16 hex characters of the id's SHA-256, 500 per flag at most. No id leaves the app as it was.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flags]
              properties:
                flags:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [key, checks]
                    properties:
                      key: { type: string }
                      checks: { type: integer, minimum: 0 }
                      ids: { type: array, maxItems: 500, items: { type: string, pattern: '^[0-9a-f]{16}$' } }
      responses:
        '204': { description: Recorded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/workflows:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Workflows]
      operationId: getWorkflows
      summary: A project's workflows and recent runs
      description: |
        **Status:** Implemented.

        The Workflows page. `workflows` are what the production deployment's `@useorbits/workflows` lists, read once it went live: each with its trigger as the page says it ("Every 15 minutes", "When order.paid happens"), its last run, and the share of its finished runs in the last 7 days that succeeded (null without any). `runs` are the 50 newest, each with its steps.

        A run's steps are the `step()`, `sleep()` and `waitFor()` calls it reached, in order. A step `running` with an `error` failed an attempt and is waiting for its retry (`next_at`). Steps the workflow took on its last successful run that this run hasn't reached are listed after them: `waiting` while it runs, `skipped` once it failed or was canceled.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The workflows and runs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowsPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/workflows/{workflow}/runs:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }, { name: workflow, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Workflows]
      operationId: runWorkflow
      summary: Run a workflow now
      description: |
        **Status:** Implemented.

        Starts a run on the production deployment with `input` (any JSON, 256 KB at most), as Run now does. The builder picks it up within seconds.

        **Permissions:** Owners, admins and members. Viewers get 403. 404 when the production deployment doesn't list the workflow; 409 without a production deployment.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { input: { description: Any JSON. } } }
      responses:
        '201':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/workflows/runs/{run}:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }, { name: run, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Workflows]
      operationId: getWorkflowRun
      summary: One run and its steps
      description: |
        **Status:** Implemented.

        **Permissions:** Any team member.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/workflows/runs/{run}/cancel:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }, { name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Workflows]
      operationId: cancelWorkflowRun
      summary: Cancel a running run
      description: |
        **Status:** Implemented.

        The app isn't called for it again; a step already running finishes, and its result is dropped. 409 for a run that isn't running.

        **Permissions:** Owners, admins and members.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/workflows/runs/{run}/retry:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }, { name: run, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Workflows]
      operationId: retryWorkflowRun
      summary: Retry a failed run from the step that failed
      description: |
        **Status:** Implemented.

        The steps before the failed one keep their results; the failed one runs again with a fresh set of attempts, and the run goes on from there. 409 for a run that didn't fail.

        **Permissions:** Owners, admins and members.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowRun' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workflows/events:
    post:
      tags: [Workflows]
      operationId: sendWorkflowEvent
      summary: An event from the app, for the SDK
      security: [{ workflowsKey: [] }]
      description: |
        **Status:** Implemented.

        Not for the web app: what `@useorbits/workflows`' `trigger(name, data)` sends with the deployment's `ORBITS_WORKFLOWS` key. It starts every workflow the production deployment lists with that `event`, with `data` as its input, and wakes runs waiting for it in `waitFor(name)`, which get `data` back. An event from a preview or development key is accepted and does nothing: runs belong to production.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$', examples: [order.paid] }
                data: { description: 'Any JSON, 256 KB at most.' }
      responses:
        '202':
          description: What it started and woke.
          content:
            application/json:
              schema: { type: object, required: [started, resumed], properties: { started: { type: integer }, resumed: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/sandboxes:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Sandboxes]
      operationId: listSandboxes
      summary: A project's sandboxes
      description: |
        **Status:** Implemented. Sandboxes need the Pro plan: creating or starting one on Free is 402.

        The Sandboxes page: every sandbox, the live ones first and then by most recently started. `running` counts the live ones (starting or running) and `limit` is the most a team may run at once, for "2 of 3 running" and to disable Create at the cap. `as_of` is the server's clock, for the page's relative times. The page polls this while any sandbox is `starting`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The sandboxes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Sandboxes]
      operationId: createSandbox
      summary: Start a sandbox
      description: |
        **Status:** Implemented. Sandboxes need the Pro plan: creating or starting one on Free is 402.

        Provisions a machine and boots it: `state` is `starting`, then `running` once it is up (poll `GET .../sandboxes`). `clone` checks out the project's repository at `main`; `env` copies the Preview environment variables in. `size` caps CPU, memory and disk; `stop_after` is the idle minutes before it suspends itself. Names are lowercase letters, digits and single dashes, unique among the project's live sandboxes.

        A team runs at most `SandboxPage.limit` sandboxes at once; past that this returns 409 and the page offers to stop one first.

        **Runtime (v1):** a sandbox is a Docker container on the build host, capped by cgroups, with the terminal backed by `docker exec`. Stronger isolation (Firecracker microVMs) is a later swap that does not change this contract.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Collect the form (name, runtime, size, clone, env, stop_after) and POST it. On 201, open the sandbox at its `name`; on 409, show that the team is at its limit.

        Needs **Pro**: on Free this is 402 `plan_required` (feature `sandboxes`).

        **Permissions:** Owners, admins and members. Viewers get 403.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxCreate' }
      responses:
        '201':
          description: The new sandbox, starting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/sandboxes/{sandbox}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: sandbox, in: path, required: true, description: The sandbox's name., schema: { type: string } }
    get:
      tags: [Sandboxes]
      operationId: getSandbox
      summary: A sandbox, its usage and open ports
      description: |
        **Status:** Implemented. Sandboxes need the Pro plan: creating or starting one on Free is 402.

        The sandbox's page: its `usage` against the size's ceiling, the `terminal` output so far, and the `ports` it listens on (port 3000, team-only, in v1). Use `{sandbox}` from `GET .../sandboxes`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, then a `name` from `GET .../sandboxes` as `{sandbox}`.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Sandboxes]
      operationId: deleteSandbox
      summary: Delete a sandbox
      description: |
        **Status:** Implemented. Sandboxes need the Pro plan: creating or starting one on Free is 402.

        Terminates the machine and frees its disk. Irreversible; unlike stop, nothing is kept.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, then a `name` from `GET .../sandboxes` as `{sandbox}`.

        **Permissions:** Owners, admins and members. Viewers get 403.
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/sandboxes/{sandbox}/stop:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: sandbox, in: path, required: true, description: The sandbox's name., schema: { type: string } }
    post:
      tags: [Sandboxes]
      operationId: stopSandbox
      summary: Suspend a sandbox
      description: |
        **Status:** Implemented. Sandboxes need the Pro plan: creating or starting one on Free is 402.

        Suspends the sandbox: CPU and memory are released, the disk is kept, and `start` resumes it with the work intact. The idle auto-stop does the same, so a timeout never loses work. `state` becomes `stopped`. Already stopped is a no-op 200.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, then a `name` from `GET .../sandboxes` as `{sandbox}`.

        **Permissions:** Owners, admins and members. Viewers get 403.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: The suspended sandbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/sandboxes/{sandbox}/start:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: sandbox, in: path, required: true, description: The sandbox's name., schema: { type: string } }
    post:
      tags: [Sandboxes]
      operationId: startSandbox
      summary: Resume a sandbox
      description: |
        **Status:** Implemented. Sandboxes need the Pro plan: creating or starting one on Free is 402.

        Resumes a stopped sandbox from its kept disk: `state` is `starting`, then `running` (poll `GET .../sandboxes`). Counts against the team's live limit, so this returns 409 when the team is already at `SandboxPage.limit`. Already running is a no-op 200.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, then a `name` from `GET .../sandboxes` as `{sandbox}`.

        Needs **Pro**: on Free this is 402 `plan_required` (feature `sandboxes`). A team that falls back to Free keeps its sandboxes and their disks, but they stop and can't be started.

        **Permissions:** Owners, admins and members. Viewers get 403.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: The sandbox, starting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sandbox' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/sandboxes/{sandbox}/terminal-ticket:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: sandbox, in: path, required: true, description: The sandbox's name., schema: { type: string } }
    post:
      tags: [Sandboxes]
      operationId: createSandboxTerminalTicket
      summary: A ticket to open the sandbox's terminal
      description: |
        **Status:** Implemented.

        A WebSocket opened by a browser can't carry the session or a bearer, so the terminal (`GET .../sandboxes/{sandbox}/terminal`) takes this ticket in its `ticket` query parameter instead. The ticket (`sbt_…`) admits the caller to this one sandbox's terminal for 60 seconds: get one right before opening the socket. It is signed, not stored, so it can't be revoked before it expires. Takes no body. The answer is never cached and the call ignores `Idempotency-Key`, so every call mints a new ticket.

        No plan check of its own: the sandbox must be `running` (else 409), and only Pro can start one.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, then a `name` from `GET .../sandboxes` as `{sandbox}`.
        4. Once the sandbox is `running`, call this and open `wss://…/v1/teams/{team}/projects/{project}/sandboxes/{sandbox}/terminal?ticket=<ticket>` within a minute.

        **Permissions:** Any team member, viewers included. A session or a `full` API token may call it (a token limited to one project only for that project); a `read` token gets 403, because this is a POST. A non-member gets 404.
      responses:
        '200':
          description: The ticket.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxTerminalTicket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/sandboxes/{sandbox}/terminal:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: sandbox, in: path, required: true, description: The sandbox's name., schema: { type: string } }
    get:
      tags: [Sandboxes]
      operationId: openSandboxTerminal
      summary: Interactive terminal (WebSocket)
      security:
        - sandboxTerminalTicket: []
      description: |
        **Status:** Implemented. Sandboxes need the Pro plan: creating or starting one on Free is 402.

        Upgrades to a WebSocket onto a shell in the sandbox (`docker exec` in v1). Text frames from the browser go to the shell's stdin; its stdout and stderr come back as text frames. A JSON control frame `{"resize":{"cols":120,"rows":30}}` sets the terminal size. The PTY is attached only while the socket is open and torn down on disconnect, so an unwatched sandbox holds nothing. The gateway proxies the upgrade (Go `httputil.ReverseProxy`) without checking a session: a browser WebSocket can't send `Authorization`, so the credential is the `ticket` query parameter from `POST .../sandboxes/{sandbox}/terminal-ticket`, good for 60 seconds, which the builder redeems with control before it upgrades.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, then a `name` from `GET .../sandboxes` as `{sandbox}`.
        4. Once the sandbox is `running`, call `POST .../sandboxes/{sandbox}/terminal-ticket` and open the WebSocket with its `ticket` within a minute.

        **Permissions:** Whoever the ticket was minted for (any team member). A missing, forged or expired ticket gets 401; a sandbox that is gone, 404; one not running, 409.
      responses:
        '101': { description: Switching Protocols; the WebSocket is open. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/alerts:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: A project's alert rules and their state
      description: |
        **Status:** Implemented.

        The Alerts card on Observability: every rule of the project, oldest first, with its state. A rule watches production's requests (the same traffic as Observability) and is checked every minute, at :30, over its last `window_minutes` whole minutes. It fires as soon as its value is past the line (above `threshold`, or below it for `direction: below`), and resolves after 3 checks in a row back on the right side. `error-rate`, `p75` and `p99` need 20 requests in the window to say anything: under that a rule can't fire, and `last_value` is null. A firing rule counts such a check toward resolving, unless what few requests there were are still past the line, and resolves with `reason: quiet` when the last of the 3 is one. `webhook_configured` says whether `webhook` can be offered as a channel.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Call with Observability's page. Show firing rules first, with `since` and `last_value`.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Alerts]
      operationId: createAlert
      summary: Create an alert rule
      description: |
        **Status:** Implemented.

        The Create alert form. The rule starts `ok` and is first checked at the next :30. 422 names the field: a name already used in the project, `direction: below` for anything but `requests`, an `error-rate` threshold of 100 or more, a route that doesn't start with `/` or has a `*` anywhere but the end, or `webhook` in `channels` while the team has no webhook (`webhook_configured` on the list).

        **Frontend flow:**

        1. Sign in and choose `{team}` and `{project}` as for `GET .../alerts`.
        2. While the form is open, call `POST .../alerts/preview` with the metric, window and routes to warn about too little traffic.
        3. Call with the form's fields; add the returned Alert to the card.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/alerts/preview:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
    post:
      tags: [Alerts]
      operationId: previewAlert
      summary: How much traffic a draft rule would see
      description: |
        **Status:** Implemented.

        For the Create and Edit forms. `median_requests` is the median number of requests a window of this size held over the last 24 hours on these routes (minutes without traffic count as none). When it is under `minimum_requests` (20 for `error-rate`, `p75` and `p99`; 0 for `requests`), warn under the window field, for example "These routes get about 6 requests in 1 minute. The rule won't fire until a window has 20. Try 5 or 10 minutes." It is a warning: the form can still be saved. `value` is what the rule would measure now, or null with too little traffic.

        **Frontend flow:**

        1. Sign in and choose `{team}` and `{project}` as for `GET .../alerts`.
        2. Call when the metric, window or routes change (debounced). Show nothing while a call is in flight.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertPreviewRequest' }
      responses:
        '200':
          description: The traffic and the value now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/projects/{project}/alerts/{alert}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: alert, in: path, required: true, schema: { type: string }, description: 'An `alr_` id from `GET .../alerts`.' }
    patch:
      tags: [Alerts]
      operationId: updateAlert
      summary: Change or switch an alert rule
      description: |
        **Status:** Implemented.

        The rule's switch, and the Edit dialog. Send only what changes. Any change, switching it off or on included, starts the rule again from `ok`. A rule that was firing first resolves, so a receiver sees its incident close: `reason: changed` for an edit, `off` when switched off. Changing `metric` away from `requests` sets `direction` to `above` unless one is sent. 422 as for create.

        **Frontend flow:**

        1. Sign in and choose `{team}` and `{project}` as for `GET .../alerts`.
        2. Use a rule's `id` from `GET .../alerts` as `{alert}`; replace the rule on the card with the answer.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertUpdate' }
      responses:
        '200':
          description: The rule as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Alerts]
      operationId: deleteAlert
      summary: Delete an alert rule
      description: |
        **Status:** Implemented.

        Deletes the rule and its history. A rule that was firing sends `alert.resolved` with `reason: deleted` first.

        **Frontend flow:**

        1. Sign in and choose `{team}` and `{project}` as for `GET .../alerts`.
        2. Use a rule's `id` from `GET .../alerts` as `{alert}`.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/alerts/{alert}/events:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: alert, in: path, required: true, schema: { type: string } }
    get:
      tags: [Alerts]
      operationId: listAlertEvents
      summary: When a rule fired and resolved
      description: |
        **Status:** Implemented.

        A rule's history, newest first, kept 90 days, with how each notification went (`deliveries`: one per channel, `pending` while it is still being tried, up to 5 times over about 30 minutes).

        **Frontend flow:**

        1. Sign in and choose `{team}` and `{project}` as for `GET .../alerts`.
        2. Use a rule's `id` as `{alert}`. For more, send `next_cursor` as `cursor`.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertEventPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/alert-channels:
    parameters:
      - { $ref: '#/components/parameters/Team' }
    get:
      tags: [Alerts]
      operationId: getAlertChannels
      summary: The team's alert webhook
      description: |
        **Status:** Implemented.

        The webhook every rule with the `webhook` channel sends to, one per team, or null. The secret is never shown again after it is made; `secret_last4` identifies it.

        **Frontend flow:**

        1. Sign in and choose `{team}` as for `GET .../alerts`.
        2. Call for the team settings' Alerts section.

        **Permissions:** Owner or admin of the team. Members and viewers get 403 (the list's `webhook_configured` tells them whether one is set). A non-member gets 404.
      responses:
        '200':
          description: The webhook, or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertChannels' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/alert-channels/webhook:
    parameters:
      - { $ref: '#/components/parameters/Team' }
    put:
      tags: [Alerts]
      operationId: setAlertWebhook
      summary: Set the team's alert webhook
      description: |
        **Status:** Implemented.

        Sets the URL (https only). The first time, or with `rotate_secret`, a new secret is made and returned in `secret`, this once; the old one stops working at once. Otherwise `secret` is null and the secret is kept.

        Every request Orbits sends is a JSON `POST` with `X-Signature-256: sha256=<hex>` (HMAC-SHA256 of the raw body with the secret), `X-Delivery-Id` (the same on every retry of one notification) and `X-Orbits-Event` (`alert.fired`, `alert.resolved` or `alert.test`). The body is an AlertWebhookPayload. A 2xx answer is delivered; anything else, or no answer in 10 seconds, is tried again. Redirects aren't followed, and addresses that aren't on the public internet are refused. The webhook-receiver template verifies these as they are.

        **Frontend flow:**

        1. Sign in and choose `{team}` as for `GET .../alerts`.
        2. Call with the URL. When `secret` is set, show it in a copyable field with "You won't see this again".

        **Permissions:** Owner or admin of the team. Members and viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertWebhookSet' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertWebhookSaved' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Alerts]
      operationId: deleteAlertWebhook
      summary: Remove the team's alert webhook
      description: |
        **Status:** Implemented.

        Notifications still waiting for the webhook fail with "The team has no webhook".

        **Permissions:** Owner or admin of the team. Members and viewers get 403. A non-member gets 404.
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/alert-channels/webhook/test:
    parameters:
      - { $ref: '#/components/parameters/Team' }
    post:
      tags: [Alerts]
      operationId: testAlertWebhook
      summary: Send a test event to the webhook
      description: |
        **Status:** Implemented.

        Sends a signed `alert.test` now and says how it went: `delivered` for a 2xx answer, otherwise the receiver's `status` (null when nothing answered) and an `error` to show. 404 when the team has no webhook.

        **Frontend flow:**

        1. Sign in and choose `{team}` as for `GET .../alerts`.
        2. Call from "Send test event"; report the answer with a toast.

        **Permissions:** Owner or admin of the team. Members and viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: How the test went.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertWebhookTest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/deployments/{deployment}/redeploy:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { $ref: '#/components/parameters/Deployment' }
    post:
      tags: [Deployments]
      operationId: redeployDeployment
      summary: Build the same commit again
      description: |
        **Status:** Implemented.

        The Redeploy modal: builds this deployment's commit again in the same environment, as a new deployment. A production redeploy takes over production when it is ready; until then production keeps serving the current build. A deployment that failed before its commit was known rebuilds its branch's newest commit. A dropped upload is rebuilt from its stored archive; only the project's last 5 are kept, and an older one is 409 `source_expired` (drop the site again).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Use a deployment `id` from `GET /v1/teams/{team}/projects/{project}/deployments` as `{deployment}` (the list's Redeploy button uses `current.id`). It must not be queued or building (409).
        5. Send `use_cache` from the modal ("Use the build cache" is true, "Clean build" false). Open the returned `id`.

        A project that runs as a `function` can't be redeployed on **Free**: 402 `plan_required` (feature `functions`).

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.

        **Request header:** `Idempotency-Key` is honored: generate one per user action and reuse it only for retries of the same payload.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                use_cache: { type: boolean, default: true }
      responses:
        '202':
          description: The new deployment, queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/deployments/{deployment}/promote:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { $ref: '#/components/parameters/Deployment' }
    post:
      tags: [Deployments]
      operationId: promoteDeployment
      summary: Promote to production
      description: |
        **Status:** Implemented.

        The Promote modal: rebuilds a ready deployment's commit with production's environment variables, as a new production deployment that goes live when it is ready. The current version stays live until then. Promoting also lifts a rollback's pause on auto-deploy.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Call `GET /v1/teams/{team}/projects/{project}/deployments`: "Live now" is `current`, "After promote" is the chosen ready preview in `items[]`; use its `id` as `{deployment}`. 409 when it is not ready or its commit is already live.
        5. Open the returned deployment and follow it like any build.

        A project that runs as a `function` can't be promoted on **Free**: 402 `plan_required` (feature `functions`).

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.

        **Request header:** `Idempotency-Key` is honored: generate one per user action and reuse it only for retries of the same payload.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202':
          description: The new production deployment, queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/deployments/{deployment}/rollback:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { $ref: '#/components/parameters/Deployment' }
    post:
      tags: [Deployments]
      operationId: rollbackDeployment
      summary: Roll production back
      description: |
        **Status:** Implemented.

        Points production at an earlier production build straight away, with no rebuild, and pauses auto-deploy so the next push does not replace it (pushes still build; they just do not go live). The answer's `undo` restores what production served before, through `POST .../projects/{project}/production`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Call `GET /v1/teams/{team}/projects/{project}/deployments?live=true` and use an `items[].id` that is not `current` as `{deployment}`. Only the last three builds that served production can be targets (409 otherwise).
        5. Keep `undo` for the toast's Undo button.

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Production now serves it, and auto-deploy is paused.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ProductionChange' }
                  - type: object
                    required: [undo]
                    properties:
                      undo:
                        type: object
                        required: [deployment_id, auto_deploy_paused]
                        description: Send as the body of `POST .../projects/{project}/production` to undo.
                        properties:
                          deployment_id: { type: [string, 'null'] }
                          auto_deploy_paused: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/deployments/{deployment}/cancel:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { $ref: '#/components/parameters/Deployment' }
    post:
      tags: [Deployments]
      operationId: cancelDeployment
      summary: Cancel a build
      description: |
        **Status:** Implemented.

        "Cancel deployment": a queued deployment is canceled at once; a building one is stopped by its builder within a few seconds (the answer still says `building`; poll until it says `canceled`). Nothing it built goes live.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Use the `id` of a queued or building deployment from `GET /v1/teams/{team}/projects/{project}/deployments` (or the one just created) as `{deployment}`. 409 once it has finished.

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.

        **Request header:** `Idempotency-Key` is honored: generate one per user action and reuse it only for retries of the same payload.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202':
          description: Canceled, or being stopped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------- Environment variables ----------
  /teams/{team}/projects/{project}/env:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
    get:
      tags: [Environment variables]
      operationId: listEnvVars
      summary: List variables
      description: |
        **Status:** Implemented.

        The Environment variables page: one row per `key`, with the environments it applies to. Values are encrypted at rest. A row's `value` is returned only for a variable that is not `sensitive` and whose key is meant for the browser (it starts with `NEXT_PUBLIC_`, `NUXT_PUBLIC_`, `PUBLIC_`, `VITE_`, `REACT_APP_` or `EXPO_PUBLIC_`, or ends with `_PUBLIC_KEY`); every other `value` is `null` and the page shows dots. A `sensitive` variable can never be read back by anyone (the dialog says "Nobody can read it back, only replace it"), so show no eye icon, Reveal value or Copy value for it. For any other variable, "Reveal value" and "Copy value" call `POST /v1/teams/{team}/projects/{project}/env/{key}/reveal`.

        `total` is the number of variables that match the filters ("10 variables"). `last_changed` feeds the pull dialog ("Last changed yesterday by Shady Asaolu"); it is `null` when there are none. `redeploy` drives the blue banner ("You changed 1 variable. Redeploy so production picks it up."): `required` is true when something changed since the project's latest deployment and `changed` counts those variables; each row's `pending_redeploy` marks the ones to highlight (the "New" tag). Until deployments exist, `redeploy.required` is always false.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and pass the selected `items[].id` or `items[].slug` as `{project}`; the Project returned by `POST /v1/teams/{team}/projects` works too.
        4. Call this endpoint when the page opens, and again with `q` (the "Search keys" box) or `environment` (the Environment filter: All sends nothing) when they change. Page with `next_cursor`. Keep each row's `key`: the edit, delete, reveal and restore calls use it in the path.

        **Permissions:** Any team member, including viewers. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: environment, in: query, description: Only variables that apply to this environment., schema: { $ref: '#/components/schemas/EnvironmentName' } }
        - { name: q, in: query, description: Substring of the key., schema: { type: string } }
      responses:
        '200':
          description: Variables.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVarPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Environment variables]
      operationId: createEnvVars
      summary: Add variables, or import a .env file
      description: |
        **Status:** Implemented.

        Saves one or more variables. The Add variable dialog sends one with the default `on_conflict: fail`: a key that already exists is 409 and nothing is saved (use Edit instead). The Import .env dialog sends every parsed line with `on_conflict: replace`, which replaces the value and environments of keys that already exist, as its warning says ("Importing replaces its value in the environments you pick"). The dialog parses the file in the browser; show the conflicts from the list you already loaded. `sensitive` defaults to true, as the Sensitive checkbox does.

        A project can have at most 1,000 variables. An import that would go over (replacing existing keys adds none) is 422 on `variables` and saves nothing. The request body is at most 1 MiB, which the gateway enforces on every request (413), so a very large import must be split.

        The new values apply to deployments created afterwards; `redeploy_required` says whether the banner should show.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and pass the selected `items[].id` or `items[].slug` as `{project}`; the Project returned by `POST /v1/teams/{team}/projects` works too.
        4. Optionally call `GET /v1/teams/{team}/projects/{project}/env` first to warn about keys that already exist; no variable-list call is mandatory. Send `variables[].key`, `value`, `environments` (the Production, Preview and Development checkboxes; default `production` and `preview`) and `sensitive`. Field errors come back as `variables[0].key`, `variables[0].value` and so on.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvVarCreate' }
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVarBatchResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/env/{key}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: key, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Environment variables]
      operationId: updateEnvVar
      summary: Change a value or its environments
      description: |
        **Status:** Implemented.

        The Edit dialog: the key is read-only ("To rename a key, add a new one and delete this one"). Send `value` only when the user typed a new one; leave it out to change just the environments. Send `environments` only when the checkboxes changed. At least one of them is required. Whether a variable is `sensitive` cannot be changed here.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and pass the selected `items[].id` or `items[].slug` as `{project}`; the Project returned by `POST /v1/teams/{team}/projects` works too.
        4. Call `GET /v1/teams/{team}/projects/{project}/env` and use the chosen row's `key` as `{key}`. The Edit dialog's "New value" starts empty for a `sensitive` variable, because its value cannot be read.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvVarUpdate' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVarChange' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Environment variables]
      operationId: deleteEnvVar
      summary: Delete a variable
      description: |
        **Status:** Implemented.

        The Delete dialog ("Type STRIPE_SECRET_KEY to confirm"; the typed confirmation is checked in the browser). The variable is hidden at once but its encrypted value is kept until `restorable_until` (10 minutes), so the toast's Undo can call `POST /v1/teams/{team}/projects/{project}/env/{key}/restore`. Deployments created after the delete no longer get it.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and pass the selected `items[].id` or `items[].slug` as `{project}`; the Project returned by `POST /v1/teams/{team}/projects` works too.
        4. Call `GET /v1/teams/{team}/projects/{project}/env` and use the chosen row's `key` as `{key}`. Show the toast "KEY deleted. Redeploy to apply." with Undo until `restorable_until`.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.
      responses:
        '200':
          description: Deleted, and restorable until `restorable_until`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVarDeleted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/env/{key}/restore:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      tags: [Environment variables]
      operationId: restoreEnvVar
      summary: Undo a delete
      description: |
        **Status:** Implemented.

        The Undo button on the "deleted" toast. It brings the variable back with the value and environments it had. 404 means the 10 minutes have passed (or it was never deleted); 409 means a variable with that key exists again.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and pass the selected `items[].id` or `items[].slug` as `{project}`; the Project returned by `POST /v1/teams/{team}/projects` works too.
        4. Call `DELETE /v1/teams/{team}/projects/{project}/env/{key}` first and use the same `{key}` while `restorable_until` has not passed. Then refresh `GET /v1/teams/{team}/projects/{project}/env`.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVarChange' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/env/{key}/reveal:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      tags: [Environment variables]
      operationId: revealEnvVar
      summary: Reveal a value
      description: |
        **Status:** Implemented.

        "Reveal value" and "Copy value" (and the eye icon) on a row. It is a POST because every reveal is recorded as a `project.env.revealed` event with who asked and which key, never the value. A `sensitive` variable answers 409: it can never be read back. The response is never cached or replayed: this call ignores `Idempotency-Key`, so every call reads the value again and is recorded.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and pass the selected `items[].id` or `items[].slug` as `{project}`; the Project returned by `POST /v1/teams/{team}/projects` works too.
        4. Call `GET /v1/teams/{team}/projects/{project}/env` and use the chosen row's `key` as `{key}`, only for rows where `sensitive` is false.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.
      responses:
        '200':
          description: The value.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVarValue' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/projects/{project}/env/pull:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
    post:
      tags: [Environment variables]
      operationId: pullEnvVars
      summary: Download values for local development (`orbits env pull`)
      description: |
        **Status:** Implemented.

        What `orbits env pull` calls to write `.env.local`. It returns the values of every variable that applies to `environment`, except `sensitive` ones, which nobody can read back: their keys are listed in `skipped_sensitive` so the CLI can tell the user. Every pull is recorded as a `project.env.pulled` event. The response is never cached or replayed: this call ignores `Idempotency-Key`, so every call reads the values again and is recorded. The web app only shows the pull dialog; it does not call this endpoint.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and pass the selected `items[].id` or `items[].slug` as `{project}`; the Project returned by `POST /v1/teams/{team}/projects` works too.
        4. Send `environment` (`development` for the dialog's ".env.local"). The dialog's count and "Last changed" come from `total` and `last_changed` of `GET /v1/teams/{team}/projects/{project}/env?environment=development`. A session or a `full` API token may call it (a token limited to one project only for that project); a `read` token gets 403, because this is a POST.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment]
              properties:
                environment: { $ref: '#/components/schemas/EnvironmentName' }
      responses:
        '200':
          description: Values for the environment.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvVarPull' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }

  # ---------- Domains ----------
  /teams/{team}/domains:
    get:
      tags: [Domains]
      operationId: listDomains
      summary: The team's domains
      description: |
        **Status:** Implemented.

        The team's Domains and DNS page: every domain the team added, newest first, with the page's counts and the projects for its filter. A project's Domains page is this list with `project` set. Teams have a handful of domains, so the list isn't paged.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call with the page's filters: `q`, `state`, `dns`, and `project` (an `id` or `slug` from `projects`). `summary` counts the team's domains whatever the filters, for the stat cards and the empty state. Open a domain's page with its `name` (or `id`) as `{domain}`.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { name: q, in: query, schema: { type: string, maxLength: 253 }, description: "Part of a domain's name or its project's name." }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DomainState' } }
        - { name: dns, in: query, schema: { $ref: '#/components/schemas/DnsMode' } }
        - { name: project, in: query, schema: { type: string }, description: "A project's `id` or `slug`." }
      responses:
        '200':
          description: The team's domains that match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainList' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      tags: [Domains]
      operationId: addDomain
      summary: Add a domain
      description: |
        **Status:** Implemented.

        The Add domain dialog, on the team's Domains and DNS page or a project's Domains page. The domain starts `pending`. With `dns: external`, show `required_record` for the team to add at its DNS provider. With `dns: orbits`, the domain becomes a zone of its own: show `nameservers.names` for the team to set at its registrar (an apex, `host: "@"`) or to add as NS records for that name at its parent's DNS (a subdomain such as `dns-test.example.com`); Orbits then serves the whole zone, keeps the records its projects need, and the team manages the rest (`.../records`). A name inside a zone the team already has on Orbits DNS is on Orbits DNS too, whatever `dns` says: its record is created for it. Zones never nest: a zone around one already on Orbits DNS is refused (422 `dns`), and so is one inside or around another team's (409 `domain`). Orbits looks for it every minute (and at once with `POST .../checks`), issues the certificate once it's found, then serves the project on it. The person who added it gets an email when it's live, and another if DNS still isn't there an hour later.

        A domain the team already has that serves nothing (a zone moved to Orbits DNS before any project was picked) can be typed into a project's Add domain dialog like a new one: this call links it (200) instead of refusing it. `GET .../domains/preview` says beforehand what adding a name would do, for the dialog's note.

        **Frontend flow:**

        1. Sign in, then call `GET /v1/teams` and use the selected `items[].id` or `items[].slug` as `{team}`.
        2. For the project picker, call `GET /v1/teams/{team}/projects` and send the chosen `items[].id` or `items[].slug` as `project` (optional on the team page: a domain can wait without one). "Serves: A branch" sends `branch` too.
        3. "Redirect to another domain" (a project's Domains page) sends `to`: another of the team's domain names from `GET /v1/teams/{team}/domains`, or the project's free address. A redirect has no `branch`.
        4. On Back in the dialog, remove the domain it added (`DELETE /v1/teams/{team}/domains/{domain}`) before adding the new one.
        5. A 422 or 409 names the field in `errors[].field`: `domain`, `project`, `branch`, `to` or `dns`, the dialog's input names.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.

        **Request header:** Send an `Idempotency-Key`, one per press of Continue; a retry with the same key and body replays the first answer.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, maxLength: 253, examples: [shop.shadyventures.ng], description: 'As typed: a scheme, path or trailing dot comes off, and it is lowercased.' }
                dns: { $ref: '#/components/schemas/DnsMode' }
                project: { type: [string, 'null'], description: "A project's `id` or `slug`." }
                branch: { type: [string, 'null'], maxLength: 128, description: "Serve this branch's newest ready preview instead of production. Needs `project`." }
                to: { type: [string, 'null'], maxLength: 253, description: "Redirect every request (308, same path) to this hostname instead of serving." }
      responses:
        '200':
          description: 'The team already had this domain and it served nothing (a zone moved to Orbits DNS before a project was picked, say): it now serves what the request asks, as `PATCH .../domains/{domain}` would. `dns` is ignored; the domain keeps its own.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '201':
          description: Added, `pending` until its record is found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This team already has the domain and it serves something already, or the request names nothing for it to serve; or another team has it (`errors[0].field` is `domain`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/domains/preview:
    get:
      tags: [Domains]
      operationId: previewDomain
      summary: What adding a domain would do
      description: |
        **Status:** Implemented.

        The Add domain dialogs' note, as the person types: whether the name would use outside DNS (one record to add, `required_record`), sit inside one of the team's Orbits DNS zones (`zone`, Orbits adds the record), or become a zone of its own (`nameservers`); and whether the team has it already (`existing`, which Add links to the project when it serves nothing). Nothing is saved. Checks the same rules as Add, with the same errors.

        **Frontend flow:**

        1. Debounce the Domain field (300 ms or so) and call with `domain` and the dialog's `dns` choice.
        2. Show the note from `dns`, `zone`, `nameservers` and `existing`; show a 409 or 422 on the field it names.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { name: domain, in: query, required: true, schema: { type: string, maxLength: 253 } }
        - { name: dns, in: query, schema: { $ref: '#/components/schemas/DnsMode' } }
      responses:
        '200':
          description: What Add would do.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another team has the domain, or a zone of another team's holds or sits inside it (`errors[0].field` is `domain`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }

  /teams/{team}/domains/{domain}:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Domain' }]
    get:
      tags: [Domains]
      operationId: getDomain
      summary: A domain
      description: |
        **Status:** Implemented.

        A domain's page: its state, the record it needs and what the last check found, the hostname card (which project and branch it serves, or where it redirects) and its certificate. While it's `pending`, refresh the page every few seconds or call `POST .../checks`.

        **Frontend flow:**

        1. Sign in, then call `GET /v1/teams` and use the selected `items[].id` or `items[].slug` as `{team}`.
        2. Use a `name` (as in the page's URL) or `id` from `GET /v1/teams/{team}/domains` or `POST /v1/teams/{team}/domains` as `{domain}`.

        **Permissions:** Any team member. A non-member, or a domain of another team, gets 404.
      responses:
        '200':
          description: The domain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Domains]
      operationId: updateDomain
      summary: Change what a domain serves
      description: |
        **Status:** Implemented.

        The hostname card's Change: point the domain at another project, a branch, production again, a redirect, or nothing (`project: null` leaves it "Not in use"). Send only what changes; `null` clears a field. The name and DNS mode don't change: remove the domain and add it again.

        **Frontend flow:**

        1. Read the domain with `GET /v1/teams/{team}/domains/{domain}` to fill the form.
        2. Pick the project from `GET /v1/teams/{team}/projects` (`items[].id` or `items[].slug`). Sending `project` without `branch` serves its production; sending `to` makes it a redirect and clears `branch`.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project: { type: [string, 'null'] }
                branch: { type: [string, 'null'], maxLength: 128 }
                to: { type: [string, 'null'], maxLength: 253 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Domains]
      operationId: removeDomain
      summary: Remove a domain
      description: |
        **Status:** Implemented.

        Remove domain, after the dialog's confirmation. The project stops answering on it within a minute and its certificate is deleted. The record at the team's DNS provider stays until they delete it there.

        **Frontend flow:**

        1. Read the domain with `GET /v1/teams/{team}/domains/{domain}` to show what it serves in the confirmation, then call this with the same `{domain}`.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/domains/{domain}/checks:
    post:
      tags: [Domains]
      operationId: checkDomain
      summary: Look for the domain's DNS now
      description: |
        **Status:** Implemented.

        Check now. Orbits looks up the domain's DNS at once and answers with the domain as it stands, `checked_at` included. A domain checked in the last 10 seconds isn't looked up again; the answer is the same. Orbits also checks by itself every minute while a domain waits, and every 10 minutes once it's valid. A certificate follows within about a minute of DNS being found.

        **Frontend flow:**

        1. Read the domain (`GET /v1/teams/{team}/domains/{domain}`) and show `required_record`; the team adds it at its DNS provider, outside Orbits.
        2. Call this with the same `{domain}` and refresh the page from the answer.

        **Permissions:** Any team member: checking changes nothing the team chose. A non-member gets 404.

        This call ignores `Idempotency-Key`.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Domain' }
      responses:
        '200':
          description: The domain after the check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  # ---------- DNS ----------
  /teams/{team}/domains/{domain}/records:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Domain' }]
    get:
      tags: [DNS]
      operationId: listDnsRecords
      summary: A zone's records
      description: |
        **Status:** Implemented.

        The DNS records table on an Orbits DNS domain's page: every record the zone serves, the team's own and the ones Orbits manages for its projects (`used_by.kind: project`, `managed: true`, locked: they change from that project's Domains page). Email records (`used_by.kind: email`) came with Email setup and stay editable. The zone also has its SOA and NS records, which aren't listed.

        **Frontend flow:**

        1. Sign in, then call `GET /v1/teams` and use the selected `items[].id` or `items[].slug` as `{team}`.
        2. Use an Orbits DNS apex (`dns: orbits`, `host: "@"`) from `GET /v1/teams/{team}/domains` as `{domain}`. A subdomain on Orbits DNS answers with its zone's records; an external domain gets 404.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The zone's records, by name then type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsRecordList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [DNS]
      operationId: addDnsRecord
      summary: Add a record
      description: |
        **Status:** Implemented.

        Add a DNS record. It's served within about a minute. A name Orbits manages for a project (the apex and `www` of a zone in use, a subdomain added as a domain) can't take another record there: add the domain from the project's Domains page instead. A CNAME can't share its name with any other record, and can't sit at `@`.

        **Frontend flow:**

        1. Read the zone with `GET /v1/teams/{team}/domains/{domain}/records`.
        2. Send the dialog's `type`, `name` (relative to the zone, `@` for the apex), `value` and `ttl` (`0` is Auto). A 422 or 409 names the field to fix in `errors[].field`.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.

        **Request header:** Send an `Idempotency-Key`, one per press of Add record.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DnsRecordInput' }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/domains/{domain}/records/{record}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Domain' }
      - { name: record, in: path, required: true, schema: { type: string, pattern: '^rec_' } }
    put:
      tags: [DNS]
      operationId: replaceDnsRecord
      summary: Edit a record
      description: |
        **Status:** Implemented.

        The record menu's Edit: the record is replaced by what's sent, under the same rules as adding one. Records Orbits manages for a project can't be edited (409).

        **Frontend flow:**

        1. Use a record's `id` from `GET /v1/teams/{team}/domains/{domain}/records` as `{record}`, and send the whole record.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DnsRecordInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [DNS]
      operationId: deleteDnsRecord
      summary: Delete a record
      description: |
        **Status:** Implemented.

        The record menu's Delete, after its confirmation. Records Orbits manages for a project can't be deleted (409): remove the domain from the project instead.

        **Frontend flow:**

        1. Use a record's `id` from `GET /v1/teams/{team}/domains/{domain}/records` as `{record}`.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.
      responses:
        '204': { description: Deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/domains/{domain}/zone-imports:
    post:
      tags: [DNS]
      operationId: importZoneFile
      summary: Import a BIND zone file
      description: |
        **Status:** Implemented.

        Import zone file. Send the pasted or dropped file with `dry_run: true` to show "4 records found: 1 new, 3 already here", then again without it to add the new ones. Records already in the zone (same type, name and value) are left as they are. Lines Orbits can't use (SOA, NS, records for another domain, types it doesn't host, names Orbits manages for a project) are counted in `skipped`, not guessed at.

        **Frontend flow:**

        1. Read the zone with `GET /v1/teams/{team}/domains/{domain}/records`.
        2. Call with `dry_run: true` and the file's text as `zone`; show `found`, `added` (what would be added) and `existing`. On Import, call again with the same `zone` and no `dry_run`.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.

        **Request header:** Send an `Idempotency-Key` on the import itself, one per press of Import.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Domain' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [zone]
              properties:
                zone: { type: string, maxLength: 200000, description: The zone file as text. }
                dry_run: { type: boolean, default: false }
      responses:
        '200':
          description: What the file holds, and what was (or would be) added.
          content:
            application/json:
              schema:
                type: object
                required: [found, added, existing, skipped, records]
                properties:
                  found: { type: integer, description: Records in the file Orbits can use. }
                  added: { type: integer }
                  existing: { type: integer, description: Already in the zone. }
                  skipped: { type: integer, description: Lines Orbits can't use. }
                  records: { type: array, items: { $ref: '#/components/schemas/DnsRecordInput' }, description: The ones added (or to be added). }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/domains/{domain}/email:
    get:
      tags: [DNS]
      operationId: getEmailSetup
      summary: The Email setup dialog
      description: |
        **Status:** Implemented.

        Set up email for a zone: the provider set up now (the Active badge), how many of the zone's records came with it or are mail records ("Already set up · 5 records"), and for each provider the records Setup would add, less any that would clash with the team's own or Orbits' (for "Adds 5 MX records and SPF"). `other` is "Something else" and adds nothing. A name inside a zone answers with its zone's.

        **Frontend flow:**

        1. Call when the dialog opens.
        2. Done sends the chosen provider to `PUT` on this path.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Domain' }
      responses:
        '200':
          description: The dialog's state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSetup' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [DNS]
      operationId: setEmailProvider
      summary: Set up email for a zone
      description: |
        **Status:** Implemented.

        Email setup: the zone's MX and SPF records for one provider, in place of the last provider's (records added by Email setup, `used_by.kind: email`). DMARC and the team's other TXT records stay. DKIM keys belong to the team's mail account, so they're added as records afterwards. `other` ("Something else") clears the provider and keeps every record, for the team to manage.

        **Frontend flow:**

        1. Read the domain (`GET /v1/teams/{team}/domains/{domain}`): `email` is the provider set up now, for the dialog's Active badge.
        2. Call with the chosen `provider`, then read the records again.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Domain' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { type: string, enum: [zoho, google, microsoft, other] }
      responses:
        '200':
          description: The zone's records after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsRecordList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{team}/integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      summary: Catalog with installed state
      description: |
        **Status:** Implemented for the source-code providers (`github`, `gitlab`, `bitbucket`, `gitbucket`) and the notification ones (`slack`, `teams`, `webhooks`); payment and monitoring integrations arrive with their own milestones. Served by `control`, which asks git-ingest for the Git providers' entries and adds the notification ones; if git-ingest can't answer the list is a 502 rather than showing GitHub as not installed. `summary` is the Installed tab's second line ("Posts to #deploys and #alerts"), and `scope` is `All projects` or the project names. `github` can always be installed; `gitlab` (GitLab.com) and `bitbucket` (Bitbucket Cloud) report `available: true` once their OAuth apps are configured on the server, and `gitbucket` reports `available: false`.

        The Integrations page: the Browse tab cards (name, description, Installed or Install) and the Installed tab rows (name, a one-line summary, scope, when it was installed, by whom).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. No installation or repository call is needed first. Call when the Integrations page opens, or when the Import step needs the connected state of each provider tab. Retain `items[].key`. Show Install when `installed` is false and `available` is true, and "Soon" when `available` is false. The Installed tab is `items` filtered by `installed`; its row uses `summary`, `scope`, `installed_at` and `installed_by`.

        **Permissions:** Any team member. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/Team' }]
      responses:
        '200':
          description: Catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Integration' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: The Git providers' state could not be read. }
  /teams/{team}/integrations/{integration}:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/IntegrationKey' }]
    get:
      tags: [Integrations]
      operationId: getGitProviderIntegration
      summary: The team's GitLab or Bitbucket connection
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`; other integrations answer 404.

        The GitLab or Bitbucket integration page, the same shape as GitHub's: the connected account (the person who connected it), webhook deliveries this month, how many repositories Orbits can reach, and the pull-request settings. `status: needs_attention` means the provider stopped accepting the connection (the person revoked Orbits or lost access); connect again to repair it. `manage_url` is the provider page where that person can see or revoke Orbits' access.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/integrations` first and open this page only when the entry has `installed: true`; otherwise this endpoint answers 404. The repository table on the same page is `GET /v1/teams/{team}/integrations/{integration}/repositories`.

        **Permissions:** Any team member. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/GitProvider' }]
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitProviderIntegration' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Integrations]
      operationId: updateGitProviderIntegration
      summary: Change GitLab or Bitbucket pull-request settings
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`.

        The same three toggles as GitHub's (merge requests on GitLab). Send only the toggle that changed. `build_fork_pull_requests` lets forks read preview environment variables; leave it off unless every contributor is trusted.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Read `GET /v1/teams/{team}/integrations/{integration}` to show the current toggles, then send the changed field and use the response as the new page state. 404 when the provider is not connected.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/GitProvider' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment_preview_link: { type: boolean }
                report_deploy_status: { type: boolean }
                build_fork_pull_requests: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitProviderIntegration' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    put:
      tags: [Integrations]
      operationId: installIntegration
      summary: Install or reconfigure
      description: |
        **Status:** Planned; not implemented in the current backend. The flow below is a draft and its planned endpoints are not callable on staging.

        Install or reconfigure.

        Secret values are encrypted and never returned.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The proposed flow first calls `GET /v1/teams/{team}/integrations`, selects a catalog entry, and uses its `key` as `{integration}`. Reuse a known key for refreshes; never substitute a display name.
        4. Render the inputs described by `fields`, collect the corresponding values into request-body `values` keyed by field `name`, and optionally choose project IDs from the draft project list for body `projects`. Empty/masked secret values from the catalog are not reusable credentials. Provider-side consent/installation may also be necessary; the draft does not yet define that handshake, so no invented consent endpoint should be called.

        **Permissions:** Bearer authentication is specified by the draft. Additional role checks are unimplemented; where this description does not name a role, the draft leaves it unspecified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: { type: string }
                  writeOnly: true
                projects:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Installed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Integrations]
      operationId: uninstallIntegration
      summary: Disconnect GitLab or Bitbucket (other integrations planned)
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`; planned for the other integrations.

        Disconnect GitLab or Bitbucket from the team. Orbits forgets the person's grant and removes the webhooks it added to repositories, as far as the provider still allows. Existing deployments and domains keep working; pushes stop deploying until the provider is connected again. The grant stays listed on the provider until that person revokes it there (`manage_url`).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/integrations/{integration}/disconnect-impact` first and show its count in the confirmation modal, then send this request. After 204, refresh `GET /v1/teams/{team}/integrations`.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      responses:
        '204': { description: Disconnected. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/integrations/slack:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Integrations]
      operationId: getSlackIntegration
      summary: The team's Slack connection
      description: |
        **Status:** Implemented.

        The Slack integration page: the workspace and who connected it, the channel each kind of event goes to, and which projects send. An event is posted when its Slack switch is on in team settings (`GET /v1/teams/{team}/notification-rules`, the `slack` channel), its event has a channel here, and its project is in `scope`. `status: needs_attention` means Slack stopped accepting the token (the app was removed from the workspace); connect again to repair it, keeping the channels.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call when the Integrations page or the Slack page opens. 404 means Slack is not installed (show Install).

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlackIntegration' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Integrations]
      operationId: updateSlackIntegration
      summary: Change Slack's channels or projects
      description: |
        **Status:** Implemented.

        Send only what changed. `channels` maps an event to a public channel (its name, `#name` or id) or `null` to stop posting it; the channel must be one `GET /v1/teams/{team}/integrations/slack/channels` lists. `scope` is `all` or a list of project ids or slugs. A 422 names the field: `channels.<event>` or `scope`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Read `GET /v1/teams/{team}/integrations/slack` and `GET /v1/teams/{team}/integrations/slack/channels` for the pickers, then send each change as it is made and use the response as the new page state. 409 when someone else changed Slack meanwhile.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
