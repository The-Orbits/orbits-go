      description: |
        **Status:** Implemented.

        A boolean flag takes `on` and `rollout` (1–100, the share of ids it's on for); a string or number flag takes `value`. Fields left out stay as they are. Deployments see the change within seconds, without a redeploy.

        **Permissions:** Owners, admins and members.
      requestBody:
