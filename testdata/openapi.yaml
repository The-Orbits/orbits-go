  # ---------- Members and invites ----------
  /teams/{team}/tokens:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Teams]
      operationId: listApiTokens
      summary: The team's API tokens
      description: |
        **Status:** Implemented.

        Settings > API tokens: every token of the team that isn't revoked, newest first (an expired one stays, with its `expires_at`, until someone revokes it). The secret is never returned again; `hint` is what the table shows (`orb_live_••••3f9a`). A token acts as the person who made it (`created_by`) and stops working when they leave the team. `last_used_by` is the client's name from its `User-Agent` (`orbits-cli/0.4.1`), `null` until first use; `last_used_at` is updated at most once a minute.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call when the Settings page opens, for owners and admins only (`role` from `GET /v1/teams/{team}`).

        **Permissions:** Owner or admin, with a session. Members and viewers get 403; a non-member gets 404. An API token cannot call this (403): tokens can't manage tokens.
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ApiToken' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Teams]
      operationId: createApiToken
      summary: Create an API token
      description: |
        **Status:** Implemented.

        Create an API token (Figma "Create an API token"). The answer carries `secret`, the only time it is shown: Orbits keeps a hash. `access` is `full` (deploy, change settings and domains) or `read` (see projects, deployments and logs; read-only tokens use `GET` only and never read environment variable values). `expires` is `30`, `90` or `365` days, or `never`. `project` limits it to one project (slug or `prj_` id); omit it or send `null` for all of the team's projects.

        Names are 1 to 40 characters (letters, numbers, dots, dashes and underscores, starting with a letter or number) and unique among the team's active tokens (422 on `name`). A team may have 50 active tokens (422 on `name`). Unknown `project` is 422 on `project`.

        This call ignores `Idempotency-Key`: replaying it would mean keeping the secret, so each call makes a new token.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Send the dialog's `name`, `access`, `expires` and `project` (the Projects picker; `null` for "All projects"). Show `secret` in the "Token created" step with a copy button and say it won't be shown again, then add the returned token to the table.

        **Permissions:** Owner or admin, with a session. Members and viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, access, expires]
              properties:
                name: { type: string, minLength: 1, maxLength: 40, pattern: '^[A-Za-z0-9][\w.-]*$', examples: [github-actions] }
                access: { type: string, enum: [full, read] }
                expires: { type: string, enum: ['30', '90', '365', never] }
                project: { type: [string, 'null'], description: 'A project slug or `prj_` id; null or omitted for all projects.' }
      responses:
        '201':
          description: Created. `secret` is shown once.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ApiToken' }
                  - type: object
                    required: [secret]
                    properties:
                      secret: { type: string, examples: [orb_live_3kq9XfR2mTz8LwYb5NcA7HdE4JgPvS6u] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/tokens/{token}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { name: token, in: path, required: true, schema: { type: string, pattern: '^tok_' } }
    delete:
      tags: [Teams]
      operationId: revokeApiToken
      summary: Revoke an API token
      description: |
        **Status:** Implemented.

        Revokes the token at once: its next request is a 401. It disappears from the list. Revoking one already revoked, or from another team, is 404.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Confirm in the "Revoke token" modal, then send this request and remove the row ("Token revoked").

        **Permissions:** Owner or admin, with a session. Members and viewers get 403. A non-member gets 404.
      responses:
        '204': { description: Revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
