  /teams/{team}/avatar/uploads:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Teams]
      operationId: startAvatarUpload
      summary: Start an avatar upload (step 1 of 3)
      description: |
        **Status:** Implemented. Needs the storage's browser-reachable endpoint to be set up; until then it answers 503 `uploads_unavailable`, and the web app uses `PUT /teams/{team}/avatar` instead.

        Starts an upload of the team's avatar straight to object storage. This returns a **presigned URL**: a short-lived address the browser sends the file to with one `PUT`, with no Orbits credentials. The URL is signed for exactly the `content_type` and `size` given here, so storage refuses any other file or length. Nothing changes for the team until step 3.

        **Frontend flow:**

        1. After the person picks and crops the image, call this with `{ content_type, size }`: the image's MIME type (`image/png`, `image/jpeg` or `image/webp`) and its exact byte length (1 to 150000). Send an `Idempotency-Key` so a double click returns the same upload.
        2. **Upload the file:** `fetch(upload.url, { method: upload.method, headers: upload.headers, body: file })`. Send exactly `upload.headers` (the `Content-Type`) and the file whose size you declared, and **nothing else**: no `Authorization`, no cookies (`credentials: 'omit'`), no other headers, because the signature covers them. A 200 means it is stored. Do it before `expires_at` (ten minutes). A 403 from storage means the file or type differs from what was declared, or the URL expired: start again.
        3. Call `POST /teams/{team}/avatar/uploads/{upload}/complete`. It checks the file, sets the avatar and answers the Team; use its `avatar_url`. If it answers 409 `upload_incomplete`, the file isn't in storage yet or isn't the declared size: wait a second and call again (a few times at most).
        4. If anything fails before step 3, call `DELETE /teams/{team}/avatar/uploads/{upload}` (best effort). Uploads that are never completed are removed after they expire.

        The storage must allow cross-origin `PUT` from the web app's origin (CORS) for step 2 to work from a browser.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404. A team may have at most 5 uploads waiting (409 `too_many_uploads`).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size]
              properties:
                content_type: { type: string, enum: [image/png, image/jpeg, image/webp] }
                size: { type: integer, minimum: 1, maximum: 150000, description: The file's exact length in bytes. }
      responses:
        '201':
          description: Where to send the file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarUpload' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/avatar/uploads/{upload}/complete:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { name: upload, in: path, required: true, schema: { type: string }, description: 'The `id` from `POST /teams/{team}/avatar/uploads`.' }
    post:
      tags: [Teams]
      operationId: completeAvatarUpload
      summary: Finish an avatar upload (step 3 of 3)
      description: |
        **Status:** Implemented.

        Call this after the file was sent to the presigned URL. Control reads what arrived, checks that it is the declared size and really a PNG, JPEG or WebP of that type, makes it the team's avatar (the previous one is removed) and answers the Team with its new `avatar_url`. Calling it again for an upload that already completed answers the Team again, so a retry after a lost response is safe.

        **Frontend flow:** see `POST /teams/{team}/avatar/uploads`. Use the returned team's `avatar_url`. 409 `upload_incomplete`: retry in a second or so. 409 `upload_expired`: start again. 422: the file wasn't an image of the declared type, and it has been discarded; ask for another.

        **Permissions:** Owner or admin, and the upload must be this team's. Others get 403 or 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: The team, with its new `avatar_url`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/avatar/uploads/{upload}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { name: upload, in: path, required: true, schema: { type: string }, description: 'The `id` from `POST /teams/{team}/avatar/uploads`.' }
    delete:
      tags: [Teams]
      operationId: cancelAvatarUpload
      summary: Cancel an avatar upload
      description: |
        **Status:** Implemented.

        Abandons an upload that was started and not completed: the file, if it arrived, is removed. Cancelling one that is gone or already completed is a no-op. Not needed for an upload that simply expires.

        **Permissions:** Owner or admin. A non-member gets 404.
      responses:
        '204': { description: Cancelled. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List members and pending invites
      description: |
        **Status:** Implemented.

        List members and pending invites.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Any team member may load this list. No invitation creation is required. Active rows have `status: active` and a usable `user.id` for member actions. Pending email-invite rows have `status: invited`; use their `invite_id` for resend/revoke, not their synthetic `user.id`. Use optional `q` to filter name/email; pagination is not implemented yet.

      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string }, description: Matches name or email. }
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberPage' }
  /teams/{team}/members/{user}:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/User' }]
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        **Status:** Implemented.

        Change a member's role.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/members`, select a row with `status: active`, and copy `user.id` to `{user}`. Send the chosen `role` in JSON. Owners and admins may change ordinary roles, but only owners may grant or remove owner/admin roles. Before demoting the last owner, promote another active member to owner with this same endpoint; otherwise the call returns 409. Pending invitations must not be passed as members.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member, or leave the team when `{user}` is the caller
      description: |
        **Status:** Implemented.

        Remove a member, or leave the team when `{user}` is the caller.

        The last owner cannot be removed or leave (409). Promote another active member to owner before removing or demoting that owner.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/members` and use an active row's `user.id` as `{user}`. For leaving the team, obtain your own `id` from the sign-in response `user.id` or `GET /v1/me`. Removing another person requires owner/admin; removing an owner/admin requires owner. The last owner must first promote another active member via `PATCH /v1/teams/{team}/members/{user}` with `role: owner`; the dedicated ownership-transfer route is not implemented. After 204, refresh members, or refresh `GET /v1/teams` if the caller left.

      responses:
        '204': { description: Removed. }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/invites:
    post:
      tags: [Members]
      operationId: createInvite
      summary: Invite people by email, or create a reusable link for a role
      description: |
        **Status:** Implemented.

        Invite up to 20 people by email in one request, or create a reusable link for a role.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The caller must be owner/admin; only an owner may invite an owner/admin. Optionally call `GET /v1/teams/{team}/members` first to avoid inviting an existing member or duplicating a pending email invite; this lookup is not required by the API. Submit `role` and, for email invites, every address from the form as `emails` (up to 20) in one request. Each new address gets an invite in `items` (its `link` is null; delivery is queued). Addresses that already belong to a member or a pending invite are listed in `skipped` and not invited again; if every address is skipped the response is 409 with an error on the field `emails`. Without `emails`, the response holds one link invite: retain `items[0].link` to share; its final URL segment is the invite token for the public preview/accept flow. Retain each `items[].id` for administrative revoke/resend; an invite ID is not an invite token.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                emails:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: email }
                  description: Omit (with `email`) to create an invite link.
                email: { type: string, format: email, deprecated: true, description: 'One address; the same as `emails: [email]`.' }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Invites created.
          content:
            application/json:
              schema:
                type: object
                required: [items, skipped]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invite' } }
                  skipped:
                    type: array
                    items: { type: string, format: email }
                    description: Addresses already in the team or already invited; nothing was sent to them.
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/invites/{invite}:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Invite' }]
    delete:
      tags: [Members]
      operationId: revokeInvite
      summary: Revoke an invite
      description: |
        **Status:** Implemented.

        Revoke an invite.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Obtain `{invite}` from response `id` of `POST /v1/teams/{team}/invites`, or from `invite_id` on a `status: invited` row returned by `GET /v1/teams/{team}/members`. The caller must be owner/admin and the invitation must still be pending. Pass the invite ID, not the invite URL token. After 204, refresh the member list.

      responses:
        '204': { description: Revoked. }
  /teams/{team}/invites/{invite}/resend:
    post:
      tags: [Members]
      operationId: resendInvite
      summary: Resend the invite email
      description: |
        **Status:** Implemented.

        Resend the invite email.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/members` and use an invited row's `invite_id` as `{invite}`; the `id` from a prior email-invite creation response is an alternative. The caller must be owner/admin and this must be a pending email invitation, not a reusable link. No request body is needed. A 202 queues delivery, rotates the invite token and renews expiry; the old email link stops working.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Invite' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '202': { description: Accepted. }
  /invites/{token}:
    get:
      tags: [Members]
      operationId: lookupInvite
      summary: Look up an invite by its token
      description: |
        **Status:** Implemented.

        Look up an invite by its token.

        Callable before sign-in so the invite page can show the team name and role.

        **Frontend flow:**

        1. No prior API calls or authentication are required when opening a received invitation. Read `{token}` from the frontend `/join/{token}` URL, not from an invite ID or session token.
        2. Call this endpoint before showing accept/decline or before sign-in. Use response `team_name`, `role`, `invited_by`, and nullable `email` to render the preview; the response has no team ID or token. Keep the original URL token across sign-in. A 404 means the invitation is missing, expired, or no longer usable; do not continue to acceptance.

      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Invite summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invites/{token}/accept:
    post:
      tags: [Members]
      operationId: acceptInvite
      summary: Accept an invite
      description: |
        **Status:** Implemented.

        Accept an invite.

        **Frontend flow:**

        1. Read the invite token from the received URL and call `GET /v1/invites/{token}` to show its team, role and nullable `email`.
        2. If not signed in, complete `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify` (include the original invite token as `invite_token` in the first request), or complete the provider authorize/redirect/callback flow. Keep the original invitation token; use the returned session `token` as `Authorization: Bearer <token>`.
        3. After user confirmation, call this endpoint using the invitation token in the path, not the session token. No body or existing team membership is required. Email invitations require a session whose email matches the preview `email`; the invite must be pending/unexpired, and an existing member receives 409.
        4. The response is a Team. Use its `id` or `slug` for team-scoped calls, and refresh `GET /v1/teams`. Do not require `GET /v1/teams/{team}` before accepting: the user does not belong to that team yet.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Joined.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invites/{token}/decline:
    post:
      tags: [Members]
      operationId: declineInvite
      summary: Decline an invite
      description: |
        **Status:** Implemented.

        Decline an invite.

        Only the addressed recipient may decline an email invite. Dismissing a reusable link leaves it available to other people until expiry or revocation.

        **Frontend flow:**

        1. Read the invite URL token and call `GET /v1/invites/{token}` to preview it.
        2. Obtain an authenticated session through the email-link/verification flow or the provider authorize/redirect/callback flow, retaining the invitation token across sign-in. Send the returned session `token` as `Authorization: Bearer <token>`.
        3. After user confirmation, put the original invitation token in `{token}` and call this endpoint with no body. No existing team membership is required. For an email invitation, the signed-in email must match preview `email` and the invite must be pending/unexpired. Declining a reusable link is a no-op for other recipients. After 204, dismiss the invitation page.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Declined. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- Billing ----------
  /plans:
    get:
      tags: [Billing]
      operationId: listPlans
      security: []
      summary: The plans and their prices
      description: |
        **Status:** Implemented. No sign-in needed, so the pricing page and the upgrade dialog can use it.

        Orbits has two plans. **Free** is unlimited projects, with apps that scale to zero, and without server functions, sandboxes and Analytics or Speed Insights. **Pro** is `usd_cents: 500` a month and has all of them. `ngn` is the Naira amount charged for the price: the USD price at `rate` (a rate Orbits sets, `USD → NGN`), rounded up to a whole ₦100. It is `null` until the server has a rate set (then Pro can't be bought yet). The amount a payment is actually taken for is locked on the invoice when checkout starts, so show `ngn` as "about" only if you need to hedge; `POST .../billing/checkout` refuses with 409 if the amount you showed no longer matches.

        `features` describe the plan, not the team, and are the same whether or not limits are being enforced yet (`enforced` on `GET /v1/teams/{team}/billing` says whether they are).

        **Frontend flow:**

        1. No authentication or team is needed. Call it when the pricing page or the upgrade dialog opens.
        2. Show each plan's `name`, `usd_cents` (as `$5`) and `ngn` (as `₦8,000`), and the `features` as ticks. `sleeps_when_idle` means "scales to zero when idle": true on Free.
      responses:
        '200':
          description: The plans.
          content:
            application/json:
              schema:
                type: object
                required: [items, rate]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Plan' } }
                  rate: { type: [string, 'null'], description: 'The USD → NGN rate in use, as a decimal string, or null when none is set.', examples: ['1600'] }
  /teams/{team}/billing:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Billing]
      operationId: getBilling
      summary: The team's plan and billing state
      description: |
        **Status:** Implemented. Pro renews by itself: the saved card is charged when the month ends and again on days 1, 3 and 5 after, while Pro keeps working (a 7-day grace period); a team that paid by bank transfer, or whose card keeps failing, is emailed a link to pay. If nothing is paid by the end of grace the team goes back to Free. `banner` is the owners' notice; `next_charge.ngn` is the price locked on the renewal invoice once it exists (three days before the month ends).

        What the Settings Plan card and the Billing page show: the plan, whether it is `active`, `past_due` (a payment failed and the team is in its grace period) or `free`, the current period, what the next charge will be, what the plan allows, and (for owners) the card on file. `enforced` is false while Orbits has not switched plan limits on: every feature works for every team and `entitlements` all say true, although `plan` still says what the team is on.

        **Frontend flow:**

        1. Sign in, then call `GET /v1/teams` and use the selected `items[].id` or `items[].slug` as `{team}`; `Team.plan` already says `free` or `pro` for the plan chip.
        2. Call this when the Plan card or the Billing page opens. Show `card` and any button that changes billing only when `can_manage` is true (owners).
        3. `next_charge` is null on Free and when the team is cancelling; otherwise it is today's price (the amount locked on the invoice is fixed a few days before renewal).

        **Permissions:** Any team member sees the plan; the card is shown to owners only. A non-member gets 404.
      responses:
        '200':
          description: The billing state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Billing' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/billing/checkout:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Billing]
      operationId: startCheckout
      summary: Start paying for Pro
      description: |
        **Status:** Implemented.

        Locks today's Naira price into a new invoice and returns the Flutterwave page to send the payer to. The page takes a card or a bank transfer; card and bank details are entered on Flutterwave's page only and never reach Orbits. A bank transfer can take a while to arrive, so `verify` may say `pending` for longer; the webhook settles it when the money lands even if the payer closed the page. A team that paid by transfer has no card on file, so it renews by a payment link rather than automatically. Nothing is granted until Flutterwave confirms the payment: the team becomes Pro (`GET .../billing` says `plan: pro`) when the payment is verified, either by Flutterwave's webhook or by `POST .../billing/verify` when the payer comes back. A paid month runs from payment (or from the end of the month already paid, if Pro is still running) to the same day of the next Lagos month.

        `expected_ngn` must be the `ngn` amount the payer was shown (`GET /v1/plans`); if Pro costs something else now this answers 409 `price_changed` so they can look again. `return_path` is a path on the web app (it must start with a single `/`); Flutterwave sends the payer back to `WEB_APP_URL` + that path with `status`, `tx_ref` and `transaction_id` added. Each call makes a new invoice and a new payment link, so use `Idempotency-Key` to make a double click return the same one. A team already on active Pro gets 409 `already_pro`, unless its renewal invoice exists (three days before the month ends, or after it failed): then this pays that invoice, at its locked price (`expected_ngn` = `GET .../billing` `next_charge.ngn`), and paying early renews early. 503 `billing_unavailable` means Pro can't be bought right now (no Naira rate set, Flutterwave not set up or not answering).

        **Frontend flow:**

        1. Sign in, then use the team's `id` or `slug` as `{team}`. Call `GET /v1/plans` and show `items[id=pro].ngn`; keep it as `expected_ngn`.
        2. On Upgrade, call this with `{ expected_ngn, return_path }`, then redirect the browser to `checkout_url`. Keep `reference`.
        3. When the payer lands on `return_path`, call `POST .../billing/verify` with the `tx_ref` in the URL and show its `state`.

        **Permissions:** Team owners only; other members get 403 and a non-member 404. Not available to API tokens.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_ngn, return_path]
              properties:
                expected_ngn: { type: integer, minimum: 1, description: The Naira price the payer was shown. }
                return_path: { type: string, maxLength: 200, description: 'A path on the web app, starting with a single `/`.', examples: ['/acme/billing'] }
      responses:
        '201':
          description: The invoice and where to pay it.
          content:
            application/json:
              schema:
                type: object
                required: [invoice_id, reference, checkout_url, amount]
                properties:
                  invoice_id: { type: string, examples: [inv_0192f3a6-0c1d-7a55-9a52-6f1f0f0f0f0f] }
                  reference: { type: string, description: 'Our reference for this payment (`tx_ref` on the way back).' }
                  checkout_url: { type: string, format: uri }
                  amount:
                    type: object
                    required: [usd_cents, ngn]
                    properties:
                      usd_cents: { type: integer }
                      ngn: { type: integer, description: 'Whole Naira, locked on the invoice.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/billing/verify:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Billing]
      operationId: verifyPayment
      summary: Check a payment after the payer returns
      description: |
        **Status:** Implemented.

        Asks Flutterwave what became of the payment under `tx_ref` and, if it succeeded for the amount on the invoice, settles it. Safe to call again: a paid invoice answers `paid` and changes nothing, and a payment is never counted twice (the webhook and this call race harmlessly). `state` is `paid` (the team is Pro now), `pending` (not paid yet or still being processed: wait a few seconds and call again, a few times at most) or `failed` (the payment failed or was not for the right amount: offer to try again, which starts a new checkout). 503 `billing_unavailable` means the payment could not be checked right now: its state is unknown, so ask again shortly rather than showing failure.

        **Frontend flow:**

        1. After `POST .../billing/checkout` the browser was sent to Flutterwave; it returns to `return_path` with `tx_ref` in the query string.
        2. Call this with that `tx_ref`. On `paid`, refetch `GET .../billing` and show the confirmation; on `pending`, poll every 2 to 3 seconds up to about 30 seconds; on `failed`, show the failure state with Try again.

        **Permissions:** Team owners only. A reference that belongs to another team is 404.

        This call ignores `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tx_ref]
              properties:
                tx_ref: { type: string }
      responses:
        '200':
          description: Where the payment stands.
          content:
            application/json:
              schema:
                type: object
                required: [state, invoice]
                properties:
                  state: { type: string, enum: [paid, pending, failed] }
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/billing/cancel:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Billing]
      operationId: cancelPlan
      summary: Cancel Pro at the end of the month paid
      description: |
        **Status:** Implemented.

        Stops Pro renewing. The team keeps Pro until `ends_at` (the end of the month already paid), then goes back to Free: sandboxes stop, Analytics and Speed Insights stop collecting, and projects that run server functions keep running but can't be redeployed. Nothing is deleted. Cancelling again is a no-op. A plan Orbits granted (`source: comp`) is 409 `not_cancellable`; a team with no Pro is 409 `no_plan`.

        **Frontend flow:**

        1. Show Cancel when `GET .../billing` says `plan: pro`, `source: flutterwave` and `cancel_at_period_end: false`. Confirm with the date from `current_period.end`.
        2. Call this, then refetch `GET .../billing`: `cancel_at_period_end` is true and `banner.kind` is `canceling`.

        **Permissions:** Team owners only. Not available to API tokens.

        This call ignores `Idempotency-Key`.
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [cancel_at_period_end, ends_at]
                properties:
                  cancel_at_period_end: { type: boolean, const: true }
                  ends_at: { type: [string, 'null'], format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/billing/resume:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Billing]
      operationId: resumePlan
      summary: Keep Pro after cancelling
      description: |
        **Status:** Implemented.

        Undoes a cancellation while the paid month is still running: the plan renews again on `renews_at`. Resuming a plan that is not cancelled is a no-op. After the month has ended the plan is gone and this is 409 `plan_ended`: start Pro again from `POST .../billing/checkout`.

        **Frontend flow:**

        1. Show Keep Pro when `cancel_at_period_end` is true (the `canceling` banner). Call this and refetch `GET .../billing`.

        **Permissions:** Team owners only. Not available to API tokens.

        This call ignores `Idempotency-Key`.
      responses:
        '200':
          description: Resumed.
          content:
            application/json:
              schema:
                type: object
                required: [cancel_at_period_end, ends_at, renews_at]
                properties:
                  cancel_at_period_end: { type: boolean, const: false }
                  ends_at: { type: 'null' }
                  renews_at: { type: [string, 'null'], format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/billing/invoices:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Billing]
      operationId: listInvoices
      summary: The team's invoices
      description: |
        **Status:** Implemented.

        The Invoices list: payments made for Pro, newest first. Payments that were started and never paid are not listed. `limit` is 1 to 100 (default 25); there is no cursor yet.

        **Frontend flow:**

        1. Sign in, then use the team's `id` or `slug` as `{team}`. Call this when the Invoices list opens. Amounts are whole Naira (`ngn_amount`) with the dollar price they were converted from; format them in the browser.
        2. Open `GET .../billing/invoices/{invoice}` for a receipt.

        **Permissions:** Team owners only; other members get 403.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: The invoices.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/billing/invoices/{invoice}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { name: invoice, in: path, required: true, schema: { type: string }, description: 'An `id` from `GET .../billing/invoices`.' }
    get:
      tags: [Billing]
      operationId: getInvoice
      summary: One invoice, as a receipt
      description: |
        **Status:** Implemented.

        The invoice with who paid, for which team, what for, and the card (brand and last four) it was paid with. There is no PDF; the web app renders the receipt.

        **Frontend flow:**

        1. Take `{invoice}` from `GET .../billing/invoices` `items[].id`. Show the receipt when a row is opened.

        **Permissions:** Team owners only. An invoice of another team is 404.
      responses:
        '200':
          description: The receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---------- Projects ----------
  /templates:
    get:
      tags: [Projects]
      operationId: listTemplates
      summary: Starter templates for a new project
      description: |
        **Status:** Implemented.

        The "Start from a template" catalog on the New project screens, read from [the-orbits/templates](https://github.com/the-orbits/templates) (its `catalog.json`, cached for five minutes). A template added there appears here without a backend change.

        `workload` and `node_version`, when present, are what a project created from the template gets; `optional_env` lists variables the template reads when they are set. If the templates repository cannot be reached and nothing is cached, the list built into the service is served instead.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. No team, project or other prior call is required. Call it when the New project screen or the team's empty state opens. Show the category tabs and counts by grouping `items[].category`, and filter the search box locally on `name` and `description`. Retain the chosen `items[].key` for `template` in `POST /v1/teams/{team}/projects`. `required_env` lists the variables the Configure screen must collect before deploying.

        **Permissions:** Any signed-in user.
      responses:
        '200':
          description: Templates.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
  /teams/{team}/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      description: |
        **Status:** Implemented.

        The projects of a team, for the project cards on the team overview and for the project switcher.

        Fields that come from deployments (`status`, `latest_deployment`, `thumbnail_url`) are `pending` or null until the deployment pipeline exists. Paused projects report `status: paused`.

        Sorting: `last_deploy` (default) puts the most recently deployed first, then projects with no deployment by `created_at`.

        An API token limited to one project may call this too: the list then holds only that project (still subject to `q` and `repository`), with `next_cursor: null`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. No project or deployment must already exist. Call when the team overview or the project switcher opens, with optional `q` (matches `name` and `slug`), `sort` and `repository` (`owner/name`, to show "Already a project" on the import list). Retain `items[].id` or `items[].slug` for `{project}`. Use response `next_cursor` as query `cursor` for later pages when present; pagination is not implemented yet, so it is currently null. An empty `items` means show the first-run "Deploy your first project" screen.

        **Permissions:** Any team member, including viewers. A non-member gets 404, the same as an unknown team.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [last_deploy, name, created], default: last_deploy } }
        - { name: repository, in: query, description: 'Only projects imported from this repository, e.g. `shadyventures/storefront`.', schema: { type: string } }
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project from a repository or a template
      description: |
        **Status:** Implemented.

        Create a project: the Deploy button on the New project > Configure screens.

        `name` becomes the free address, `<slug>.theorbits.app`, where `slug` is the name in lower case with hyphens (or the `slug` you send). It must be unique across all teams: 409 means ask for another name.

        `workload` is optional. When omitted it is derived from `build.framework`: `nextjs`, `sveltekit`, `nuxt`, `remix`, `reactrouter`, `solidstart` and `tanstack-start` become a `function`, `node`, `elysia` and `dolphjs` an `app`, and everything else `static`.

        For a GitHub `source`, Orbits asks the Git service whether the team's GitHub connection can see the repository. 422 with `source.repository` means it cannot (not found, or not installed on that repository); 422 with `source.provider` means GitHub is not connected to the team. If that check cannot be completed the answer is 503 and nothing is created; retry.

        With a `template` instead, Orbits creates a private repository named after the project's slug in the team's connected GitHub account, commits the template's files into it, and creates the project from it with the template's `workload` and `node_version`; the first deployment is queued as for an import. Every variable in the template's `required_env` must be sent in `env` (422 on `env` otherwise), and the address must be free before the repository is created. In a personal GitHub account the caller must have approved Orbits first (`GET /v1/teams/{team}/integrations/github/approval`). 409 covers a taken address, a repository of that name already in the account, GitHub not connected, a personal account not yet approved, and an organisation whose installation has not yet accepted the Orbits app's Administration and Contents permissions; its `detail` says which. 503 means GitHub could not be reached.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. For an import: call `GET /v1/teams/{team}/integrations` (the `github` entry must show `installed: true` and `status: connected`; if not, run `POST /v1/teams/{team}/integrations/github/install` then `POST /v1/teams/{team}/integrations/github/callback` first) and `GET /v1/teams/{team}/integrations/github/repositories`. Copy the chosen `items[].full_name` to `source.repository` and `items[].default_branch` to `source.production_branch`, and set `source.provider` to `github`. On the Configure step call `GET /v1/teams/{team}/integrations/github/repositories/{owner}/{repo}/detection` to prefill `build.framework`, `build.install_command`, `build.build_command` and `build.output_directory`. For a template: call `GET /v1/templates` and send the chosen `items[].key` as `template`. Collect `name`, `region` (default `abj-1`) and, on the Configure screen, the optional `build` overrides (`null` keeps the detected default). Retain the returned `id` or `slug` and `free_address`.

        On **Free**, `workload` of type `function` is 402 `plan_required` (feature `functions`); a framework that would default to a function (Next.js, SvelteKit, Nuxt, Remix...) is created as an always-on `app` instead. The response's `workload.type` says which.

        **Permissions:** Owner, admin or member of the team. Viewers get 403. A non-member gets 404.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '202':
          description: Project created. With a `source`, its first production deployment is queued too and shows as `latest_deployment`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503':
          description: The repository could not be verified, or GitHub could not be reached to create one; nothing was created. Retry.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /teams/{team}/projects/{project}:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      description: |
        **Status:** Implemented.

        One project, for the project overview header and for the Settings form.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Use the project the user is viewing: the `id` or `slug` from `GET /v1/teams/{team}/projects`, or from the Project returned by `POST /v1/teams/{team}/projects`, as `{project}`. Reuse a known reference instead of listing again.
        4. Call when the project overview or Settings opens, and again after any change. Populate Settings from the response (`name`, `free_address`, `build`, `source`, `git`, `preview_protection`, `workload`, `region`, `node_version`, `paused`). Retain `latest_deployment_id` for deployment screens when it is not null.

        **Permissions:** Any team member. A non-member, or a project in another team, gets 404.
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Change project settings
      description: |
        **Status:** Implemented.

        Change project settings. Settings save as the user makes them (the Settings screen shows "All changes saved"), so send only the fields that changed.

        Changes apply from the next deployment; existing deployments keep the snapshot taken when they were built. Renaming (`name`) also changes `slug` and the free address. The workload type cannot change after creation (422).

        `build` and `git` are merged field by field: omit a field to keep it, send `null` in `build` to go back to the detected default. `preview_password` is write-only and only valid with `preview_protection: password`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Use the project the user is viewing: the `id` or `slug` from `GET /v1/teams/{team}/projects`, or from the Project returned by `POST /v1/teams/{team}/projects`, as `{project}`. Reuse a known reference instead of listing again.
        4. Read `GET /v1/teams/{team}/projects/{project}` to populate the form, then send the changed fields. Use the response (a full Project) as the new form state. On 409 the new name's address is taken.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        **Status:** Implemented for the project record; deleting its deployments, variables, flags and domain links waits for those services.

        Delete a project (Settings > Delete project). The record is removed and an Operation is returned; downstream cleanup will be tracked by the same Operation once those services exist.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Use the project the user is viewing: the `id` or `slug` from `GET /v1/teams/{team}/projects`, or from the Project returned by `POST /v1/teams/{team}/projects`, as `{project}`. Reuse a known reference instead of listing again.
        4. Open the confirmation modal after `GET /v1/teams/{team}/projects/{project}/deletion-impact` for the counts it lists, and require the user to type the project name. Send the request, then poll `GET /v1/operations/{operation}` with the returned `id` until `state` is `succeeded` or `failed`; do not treat 202 as finished. Then refresh the project list.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      responses:
        '202':
          description: Deletion accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/deletion-impact:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Projects]
      operationId: getProjectDeletionImpact
      summary: What deleting a project removes
      description: |
        **Status:** Implemented; every count is 0 until deployments, environment variables, flags and domains exist.

        The numbers on the Delete modal: "126 deployments and their build logs, 11 environment variables, 5 flags and their history, 4 domains are detached".

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Use the project the user is viewing: the `id` or `slug` from `GET /v1/teams/{team}/projects`, or from the Project returned by `POST /v1/teams/{team}/projects`, as `{project}`. Reuse a known reference instead of listing again.
        4. Call when the user opens the Delete project modal, before showing it. Use `deployments`, `environment_variables`, `flags` and `domains` for the four lines.

        **Permissions:** Owner or admin, like the delete itself. A non-member gets 404.
      responses:
        '200':
          description: Counts of what is removed or detached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDeletionImpact' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/transfers:
    post:
      tags: [Projects]
      operationId: transferProject
      summary: Move a project to another team
      description: |
        **Status:** Implemented for the project record; domains, deployments and variables move when their services exist.

        Move a project to another team (Settings > Transfer). The project keeps its slug and free address.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Use the project the user is viewing: the `id` or `slug` from `GET /v1/teams/{team}/projects`, or from the Project returned by `POST /v1/teams/{team}/projects`, as `{project}`. Reuse a known reference instead of listing again.
        4. Call `GET /v1/teams` and offer the teams where `role` is `owner` (the modal says "You need to be an owner there"), excluding the source. Optionally call `GET /v1/teams/{team}/members` for both teams to warn who loses access ("Ifeoma and Tunde lose access unless they're in Pantech Dynamics"); no server call computes that. Send the chosen destination `id` or `slug` as `to_team`, keep the source team in `{team}`, then poll `GET /v1/operations/{operation}` with the returned `id` and reload the project list under the destination.

        **Permissions:** Owner or admin of the source team and owner of the destination team. Otherwise 403. A non-member of the source gets 404; an unknown destination or one the caller is not in gets 404.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Project' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_team]
              properties:
                to_team: { type: string, description: Destination team `id` or `slug`. }
      responses:
        '202':
          description: Transfer accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /preview-access:
    post:
      tags: [Projects]
      operationId: grantPreviewAccess
      summary: Sign a team member in to a team-only preview
      description: |
        **Status:** Implemented.

        The web app's `/preview-access` page: a team member opening a team-only preview is sent there by the edge with `team`, `project`, `host` and `path` in the query (`path` last: everything after `path=` is the place to come back to). With the person signed in, send them here; the answer is a link to the preview that signs them in to it (a 5-minute token the preview's host turns into a 12-hour cookie). Redirect the browser to `url`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Read `team`, `project`, `host` and `path` from the page's query and send them. 404 when the person isn't on the project's team (show "You don't have access to this preview"); 422 on `host` when it isn't one of the project's previews; 403 when the project's previews don't ask for a sign-in any more (send them to `https://<host><path>`).

        **Permissions:** Any member of the project's team.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [team, project, host, path]
              properties:
                team: { type: string, pattern: '^team_' }
                project: { type: string, pattern: '^prj_' }
                host: { type: string, examples: [storefront-git-checkout.theorbits.app] }
                path: { type: string, examples: [/cart] }
      responses:
        '200':
          description: The link that signs them in to the preview.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /edge/preview-access:
    get:
      tags: [Edge]
      x-internal: true
      operationId: checkPreviewAccess
      summary: The edge's check before serving a protected preview
      security: []
      description: |
        **Status:** Implemented. Edge-only: for the Nginx edge, not API clients.

        Not for clients: the edge's own routes for protected previews. Nginx asks `GET /v1/edge/preview-access?team=…&project=…` on every request to a protected preview, with the visitor's cookies (204 serve it, 401 refuse it); the password page posts to `POST /v1/edge/preview-password` (303 back with the cookie, or to the page with `error=1`), and a signed-in member's link lands on `GET /v1/edge/preview-access/claim` (303 with the cookie). They need no session: the signed cookie is the credential.

        **Frontend flow:**

        1. No frontend calls. The web app links to previews as usual; the edge handles the rest.

        **Permissions:** None; the cookie, password or token is checked.
      parameters:
        - { name: team, in: query, required: true, schema: { type: string } }
        - { name: project, in: query, required: true, schema: { type: string } }
      responses:
        '204': { description: Serve it. }
        '401': { description: Refuse it; the edge shows the password page or sends the visitor to sign in. }
  /edge/preview-password:
    post:
      tags: [Edge]
      x-internal: true
      operationId: submitPreviewPassword
      summary: The preview password page's form
      security: []
      description: |
        **Status:** Implemented. Edge-only: for the Nginx edge, not API clients.

        The form on the edge's password page (`/_orbits/login` on the preview's own host) posts here, through the edge, for a project whose `preview_protection` is `password`. Right password: 303 to `return` with the `orbits_preview` cookie (signed, `Secure; HttpOnly; SameSite=Lax`, 12 hours). Wrong password, or a project that isn't password-protected: 303 back to `/_orbits/login?error=1&return=…`, with no cookie. `return` must be a path on the preview's host (`/` otherwise).

        **Frontend flow:**

        1. No frontend calls. The edge serves the page and its form.

        **Permissions:** None; the password is checked.
      parameters:
        - { name: team, in: query, required: true, schema: { type: string }, description: 'The `team_` id.' }
        - { name: project, in: query, required: true, schema: { type: string }, description: 'The `prj_` id.' }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
                return: { type: string, description: 'The path to come back to, starting with `/`.' }
      responses:
        '303':
          description: Back to `return` with the cookie, or to the password page with `error=1`.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string }, description: 'Only when the password was right.' }
  /edge/preview-access/claim:
    get:
      tags: [Edge]
      x-internal: true
      operationId: claimPreviewAccess
      summary: Turn a team member's preview link into the preview's cookie
      security: []
      description: |
        **Status:** Implemented. Edge-only: for the Nginx edge, not API clients.

        Where the link from `POST /v1/preview-access` lands, on the preview's own host: the 5-minute `token` becomes the `orbits_preview` cookie (12 hours) and the browser goes on to `path`. An expired or wrong token is 403 with a plain-text line asking to open the preview again from Orbits.

        **Frontend flow:**

        1. No frontend calls. The web app redirects the browser to the `url` from `POST /v1/preview-access`, which points here.

        **Permissions:** None; the token is checked.
      parameters:
        - { name: team, in: query, required: true, schema: { type: string }, description: 'The `team_` id.' }
        - { name: project, in: query, required: true, schema: { type: string }, description: 'The `prj_` id.' }
        - { name: token, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string }, description: 'Where to go next, a path starting with `/` (`/` otherwise).' }
      responses:
        '303':
          description: On to `path`, with the cookie.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string } }
        '403':
          description: The link has expired or is not for this project.
          content:
            text/plain:
              schema: { type: string }
  /teams/{team}/projects/{project}/pause:
    post:
      tags: [Projects]
      operationId: pauseProject
      summary: Pause or resume a project
      description: |
        **Status:** Implemented.

        Pause or resume a project (the Paused toggle in Settings > Advanced). While paused, its production, preview and custom-domain addresses answer 503 with Orbits' paused page, its apps stop, and nothing deploys; domains, data and the builds production can come back to stay. Resuming serves production again within moments.

        The response is the updated Project (`paused` and `status: paused`), not an Operation: the toggle needs an immediate answer, and the runtime effect is reported through `status`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Use the project the user is viewing: the `id` or `slug` from `GET /v1/teams/{team}/projects`, or from the Project returned by `POST /v1/teams/{team}/projects`, as `{project}`. Reuse a known reference instead of listing again.
        4. Read `paused` from `GET /v1/teams/{team}/projects/{project}` to show the toggle, then send the wanted boolean `paused`. Use the response as the new project state.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.

        **Request header:** The contract requires `Idempotency-Key` for this request. Generate one per user action and reuse it only for retries of the same payload. The service replays the first successful result when the same key and body arrive again (response header `Idempotent-Replay: true`); the same key with a different request is 422 on the field `Idempotency-Key`; a request still running is 409 with `Retry-After`. Keys are per user and last 24 hours; a failed request frees its key. A call without a key still works but is not deduplicated.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Project' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: { type: boolean }
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---------- Deployments ----------
  /teams/{team}/deployments:
    get:
      tags: [Deployments]
      operationId: listTeamDeployments
      summary: Deployments across the team's projects
      description: |
        **Status:** Implemented.

        The team's Deployments page: every deployment across its projects, newest first, with the facets for its filters (Project, Environment, Status, Author) and "38 this week".

        An API token limited to one project may call this too: the deployments, `projects`, `authors`, `total` and `this_week` then cover only that project, and a `project` filter naming another project returns an empty list.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call this when the page opens; no other call is needed first. Fill the Project dropdown from `projects[]` and the Author dropdown from `authors[]`, and send the chosen `projects[].slug` as `project` and `authors[].name` as `author`. `state=building` also matches queued deployments. For "Load more", either raise `limit` or pass `next_cursor` as `cursor`. Each row's `project.slug` and `id` lead to `GET /v1/teams/{team}/projects/{project}/deployments/{deployment}`.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string }, description: 'Matches the commit message, branch, sha or author.' }
        - { name: project, in: query, schema: { type: string }, description: 'Project slug or `prj_` id.' }
        - { name: environment, in: query, schema: { $ref: '#/components/schemas/DeploymentEnvironment' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DeploymentState' } }
        - { name: author, in: query, schema: { type: string }, description: 'An `authors[].name`.' }
      responses:
        '200':
          description: Deployments, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamDeploymentPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/branch-addresses:
    get:
      tags: [Domains]
      operationId: listBranchAddresses
      summary: A project's branch addresses
      description: |
        **Status:** Implemented.

        The branch rows on a project's Domains page ("Follows the branch"): one address per branch with a ready preview, serving that branch's newest ready preview. The address is `<project>-git-<branch>.<PROJECT_DOMAIN>` (`orders-git-feat-apple-pay.staging.theorbits.app`), one label under the free addresses' domain so their certificate covers it; a long branch is shortened and given a short hash. Show `host` as it is rather than building it.

        **Frontend flow:**

        1. Sign in, then call `GET /v1/teams` and use the selected `items[].id` or `items[].slug` as `{team}`.
        2. Use the project's `slug` or `id` from `GET /v1/teams/{team}/projects` as `{project}`. The page's other rows come from `GET /v1/teams/{team}/domains?project={project}` and the project's free address.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { $ref: '#/components/parameters/Project' }
      responses:
        '200':
          description: The project's branches with a ready preview, the most recently deployed first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [branch, host, url, deployment_id, deployed_at]
                      properties:
                        branch: { type: string, examples: [feat/apple-pay] }
                        host: { type: string, examples: [orders-git-feat-apple-pay.theorbits.app] }
                        url: { type: string, format: uri }
                        deployment_id: { type: string, pattern: '^dpl_' }
                        deployed_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/deployments:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Deployments]
      operationId: listProjectDeployments
      summary: A project's deployments
      description: |
        **Status:** Implemented.

        The project's Deployments page: every build, newest first, with the filters (search, Env, Status, Branch, "Production only") and what the inspector shows when nothing is picked (`current`, the deployment production serves, and its `domains`).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, or reuse the Project returned by `POST /v1/teams/{team}/projects`.
        4. Call this when the page opens and whenever a filter changes. Fill the Branch dropdown from `branches[]`; "Production only" is `live=true`; `state=building` also matches queued deployments. "Showing 8 of 126" is `items.length` of `total`; `all` counts every deployment, filters aside. For "Load more", raise `limit` or pass `next_cursor` as `cursor`. While `building` is true, poll again to refresh the rows. `auto_deploy_paused` is true after a rollback.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string }, description: 'Matches the commit message, branch, sha or author.' }
        - { name: environment, in: query, schema: { $ref: '#/components/schemas/DeploymentEnvironment' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DeploymentState' } }
        - { name: branch, in: query, schema: { type: string } }
        - { name: live, in: query, schema: { type: boolean }, description: 'Only deployments that have served production.' }
      responses:
        '200':
          description: Deployments, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDeploymentPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    post:
      tags: [Deployments]
      operationId: createDeployment
      summary: Deploy a branch now
      description: |
        **Status:** Implemented.

        Queues a build of a branch's newest commit, for a deploy started by hand (the CLI's `orbits deploy`). The production branch deploys to production; any other branch to preview. Pushes and the first deploy of a new project are queued by Orbits itself and need no call. Returns at once with the queued deployment; follow it with `GET .../deployments/{deployment}` and its logs.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, or reuse the Project returned by `POST /v1/teams/{team}/projects`. The project needs a `source`; without one this is 409.
        4. Optionally send `branch` (from `GET /v1/teams/{team}/integrations/github/repositories/{owner}/{repo}/branches`); it defaults to the project's `source.production_branch`. Keep the response `id` to open the deployment.

        A project that runs as a `function` can't be deployed on **Free**: 402 `plan_required` (feature `functions`). What is live keeps running.

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.

        **Request header:** `Idempotency-Key` is honored: generate one per user action and reuse it only for retries of the same payload.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                branch: { type: string, minLength: 1, maxLength: 255, examples: [main] }
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/uploads:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    post:
      tags: [Deployments]
      operationId: startSourceUpload
      summary: Start dropping a site or app
      description: |
        **Status:** Implemented.

        The drag and drop deploy: the person drops a folder (or a `.zip`) on the project, and the browser sends it to storage on a presigned URL, so the files never pass through the API. The archive is the project's **source code**, in place of a Git clone: Orbits unpacks it, detects the framework, installs, builds and publishes or runs it like any other deployment, for any kind of project. Only projects created with `source_kind: upload` take drops.

        What goes in the archive: the project's files, with `package.json`, source and config. Anything named `node_modules`, `.git`, `.next`, `__MACOSX` or `.DS_Store`, at any depth, is left out, and a single top-level folder is stripped, so zipping the folder or its contents both work. Limits: the zip may be up to `max_bytes` (100 MiB, 104,857,600 bytes); unpacked it may be up to 500 MiB and 20,000 entries, where the folders the zip lists count as well as its files (what is left out doesn't count); links and special files are refused. The build reports a breach on the Cloning step.

        Starting signs a PUT URL for the zip (valid ten minutes). At most 5 unfinished uploads per team.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, or reuse the Project returned by `POST /v1/teams/{team}/projects` with `source_kind: upload`. A git project is 409 `not_an_upload_project`.
        4. In the browser, zip the dropped folder (skipping `node_modules` and `.git`) or take the dropped `.zip` as it is. Send `{size: file.size, filename}` here.
        5. `PUT` the file to the returned `url` with exactly `headers`, no `Authorization` and no cookies (`fetch(url, {method: 'PUT', headers, body: file, credentials: 'omit'})`). Storage needs CORS for the web app's origin. If the PUT fails, `DELETE` the upload.
        6. Call `POST .../uploads/{upload}/complete` and follow the Deployment it returns.

        If storage has no browser endpoint yet, this is 503 `uploads_unavailable`.

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size]
              properties:
                size: { type: integer, minimum: 1, maximum: 104857600, description: 'The zip''s size in bytes. The URL accepts a file of exactly this length.' }
                filename: { type: string, maxLength: 255, description: 'Shown as the deployment''s message, e.g. `Uploaded site.zip`.', examples: [site.zip] }
      responses:
        '201':
          description: A URL to send the zip to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceUpload' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`not_an_upload_project` (the project deploys from Git) or `too_many_uploads` (finish or cancel the others).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/projects/{project}/uploads/{upload}/complete:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: upload, in: path, required: true, schema: { type: string }, description: 'The `id` from `POST .../uploads`.' }
    post:
      tags: [Deployments]
      operationId: completeSourceUpload
      summary: Deploy a dropped archive
      description: |
        **Status:** Implemented.

        Say the browser has sent the zip. Orbits checks that it arrived whole and is a zip, then queues a production deployment that builds it (`trigger: manual`, the message is `Uploaded <filename>`). Returns at once; follow the deployment and its logs as for any build. The archive is kept, with the project's four previous ones, so Redeploy can rebuild it.

        If the file hasn't arrived yet this is 409 `upload_incomplete`: wait a second and call again. Completing an upload twice returns the same deployment.

        **Frontend flow:**

        1. Do the flow of `POST .../uploads` up to and including the PUT.
        2. Call this. On 409 `upload_incomplete` retry a few times, about a second apart. Open the returned deployment `id`.

        A project that runs as a `function` can't be deployed on **Free**: 402 `plan_required` (feature `functions`).

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202':
          description: The deployment, queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`upload_incomplete` (not arrived yet) or `upload_expired` (start again).'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/projects/{project}/uploads/{upload}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: upload, in: path, required: true, schema: { type: string }, description: 'The `id` from `POST .../uploads`.' }
    delete:
      tags: [Deployments]
      operationId: cancelSourceUpload
      summary: Cancel a drop
      description: |
        **Status:** Implemented.

        Abandons an upload that was started and not completed; the file, if it arrived, is removed. Cancelling one that is gone or already completed is a no-op (the deployment it made is unaffected). Not needed for an upload that simply expires.

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.
      responses:
        '204': { description: Cancelled. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/production:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    post:
      tags: [Deployments]
      operationId: setProductionDeployment
      summary: Set what production serves
      description: |
        **Status:** Implemented.

        Points production at a deployment that served production before, and sets whether pushes may replace it. It is the Undo of a rollback (send back the rollback answer's `undo`), and with the current deployment and `auto_deploy_paused: false` it lifts a rollback's pause. No rebuild.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. For Undo, send `undo.deployment_id` and `undo.auto_deploy_paused` from `POST .../deployments/{deployment}/rollback`. To lift the pause, send `current.id` from `GET .../deployments` with `auto_deploy_paused: false`. The deployment must be a ready production build that served before and is one of the last three to do so (409 otherwise).

        **Permissions:** Owner, admin or member. Viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deployment_id, auto_deploy_paused]
              properties:
                deployment_id: { type: string, pattern: '^dpl_' }
                auto_deploy_paused: { type: boolean }
      responses:
        '200':
          description: Production now serves it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionChange' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/deployments/{deployment}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { $ref: '#/components/parameters/Deployment' }
    get:
      tags: [Deployments]
      operationId: getDeployment
      summary: A deployment and its build steps
      description: |
        **Status:** Implemented.

        The deployment page and the inspector: the header, the details grid (status, environment, duration, created, branch, commit, region, framework), production's domains when it is the current deployment, the six build steps with their state and seconds, and why a failed build stopped. The log lines themselves come from `GET .../logs`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`, or reuse the Project returned by `POST /v1/teams/{team}/projects`.
        4. Call `GET /v1/teams/{team}/projects/{project}/deployments` and use `items[].id` (or `current.id`) as `{deployment}`. The `id` returned by `POST .../deployments`, `.../redeploy` or `.../promote`, or a Project's `latest_deployment_id`, also works.
        5. While `state` is `queued` or `building`, poll this every few seconds alongside `GET .../logs`; run the clock from `started_at`. `failure.line` is the log line `n` that "Jump to error" scrolls to.
        6. For the Open Graph preview, read `open_graph`: what link bots (Slack, X, LinkedIn, Facebook) see on the home page. The builder reads it a second or two after the deployment is ready, before the screenshot, so it is there by the time the log stream sends `screenshot`.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/deployments/{deployment}/logs:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { $ref: '#/components/parameters/Deployment' }
    get:
      tags: [Deployments]
      operationId: listDeploymentLogs
      summary: Build log lines
      description: |
        **Status:** Implemented.

        The build log, oldest line first. Each line names its step, so the deployment page can group lines under Queued, Cloning repository, Installing packages, Building, Uploading and Going live. A build keeps at most 5000 lines.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Use a deployment `id` from `GET /v1/teams/{team}/projects/{project}/deployments` (or the one a deploy, redeploy or promote returned) as `{deployment}`.
        5. Start with `after=0`. For "Follow output", call again every second or two with `after` set to the answer's `next_after`, appending the new `items`, until `done` is true.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 'Return lines after this `n`.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
      responses:
        '200':
          description: Log lines.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeploymentLogPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/deployments/{deployment}/logs/stream:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { $ref: '#/components/parameters/Deployment' }
    get:
      tags: [Deployments]
      operationId: streamDeploymentLogs
      summary: Follow a build live (server-sent events)
      description: |
        **Status:** Implemented.

        The live build log, pushed as server-sent events (`text/event-stream`), for New project · Deploying, a building deployment and Follow output. Lines arrive under a second after the build prints them. Events:

        - `line` (its `id` is the line's `n`): `{"n", "at", "step", "tone", "text"}`, oldest first.
        - `steps`: the six steps, as in the deployment's `steps`, whenever one changes.
        - `done`: `{"state", "failure", "duration_seconds"}` once the build has ended and every line has been sent. The stream then closes, unless the deployment just went ready.
        - `screenshot`: `{"screenshot_url"}`, the same URL the deployment's `screenshot_url` gives. The builder takes the screenshot a few seconds after the deployment is ready, so after `done` the stream stays open for up to 2 minutes and sends this when it is saved, then closes. Refresh the deployment (or its thumbnail) on it. It is not sent for a failed or canceled build, a worker, a deployment that already had its screenshot, or one that finished more than 2 minutes ago.
        - A `: keep-alive` comment every 15 s while nothing happens.

        The stream closes after 30 minutes or when a proxy cuts it (staging's after 5); reconnect with `Last-Event-ID` set to the last line `id` received (EventSource does this by itself) and it carries on with the next line, without gaps or repeats. A finished deployment answers with any remaining lines, its steps and `done` at once.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Use a deployment `id` from `GET /v1/teams/{team}/projects/{project}/deployments` (or the one a create, redeploy or promote returned) as `{deployment}`; `GET .../deployments/{deployment}` gives the header and details to show beside the log.
        5. Open the stream from the web app's server with the session and pass it through to the browser (the browser's EventSource cannot send the bearer token). `GET .../logs?after=` stays available for a finished build's whole log and for clients that cannot stream.

        **Permissions:** Any team member. A non-member gets 404 (a problem document, not a stream).
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string }, description: The last line `id` received; the stream starts after it. }
        - { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 'The same as Last-Event-ID, for a first connection that already has lines.' }
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string, description: 'Server-sent events: `line`, `steps`, `done`, `screenshot`, and `: keep-alive` comments.' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/deployments/{deployment}/screenshot:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { $ref: '#/components/parameters/Deployment' }
    get:
      tags: [Deployments]
      operationId: getDeploymentScreenshot
      summary: A deployment's screenshot
      description: |
        **Status:** Implemented.

        The image for the deployment inspector, the deployment page, New project's Preview box and the project card: the first screen (1280x800) of the deployment's home page, as a JPEG, taken by the builder a few seconds after the deployment became ready. It never changes once taken, so it is sent with `Cache-Control: private, max-age=604800, immutable`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Read `screenshot_url` from a deployment (`GET /v1/teams/{team}/projects/{project}/deployments`, its `current`, or `GET .../deployments/{deployment}`), or `thumbnail_url` from a Project. Null means there is no screenshot yet: show the placeholder ("A screenshot of your site appears here once it is live") and look again on the next poll.
        3. Fetch that path with the session from the web app's server and pass the bytes to the browser (the browser cannot send the bearer token on an `<img>`).

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The JPEG.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/projects/{project}/logs:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
    get:
      tags: [Logs]
      operationId: listRuntimeLogs
      summary: Runtime logs
      description: |
        **Status:** Implemented.

        The Logs page: every request the edge sent to one of the project's deployments (`source: requests`), and every line its deployments printed while running (`source: functions`), newest first. Build logs are on each deployment (`GET .../deployments/{deployment}/logs`). Entries are kept for 7 days.

        A request has `status`, `method`, `path` and `duration_ms`, and no `message`. An output line has `message` and `stream`, and null `status`, `method`, `path` and `duration_ms`. Requests and output lines are not linked: an app's output is whatever it printed, whichever request it was serving. Client IP addresses are stored masked (`102.89.x.x`), and query strings are not stored.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Call with the page's filters; `range` defaults to `1h`. While the page is Live, call again every few seconds. For "Load more", send `next_cursor` as `cursor`, or call again with a larger `limit`.
        5. For the inspector's entry, use it from `items`, or `GET .../logs/{log}` when it is not on the page.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: 'Matches a path or message (any case), or exactly a request ID, status or method. A request ID on its own (32 hex characters, as the edge makes them) matches only that request.' }
        - { name: source, in: query, schema: { type: string, enum: [requests, functions] } }
        - { name: level, in: query, schema: { type: string, enum: [info, warning, error] }, description: 'A request is `error` for 5xx and `warning` for 4xx. An output line is `warning` when it mentions a warning, and `error` when it was written to stderr or mentions an error.' }
        - { name: status, in: query, schema: { type: string, enum: [2xx, 3xx, 4xx, 5xx] }, description: Requests only; output lines never match. }
        - { name: range, in: query, schema: { type: string, enum: [1h, 24h, 7d], default: 1h } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: '`next_cursor` from the previous page.' }
      responses:
        '200':
          description: One page of entries, and how many match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeLogPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/projects/{project}/logs/{log}:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: log, in: path, required: true, schema: { type: string }, description: 'A `log_` id from `GET .../logs`.' }
    get:
      tags: [Logs]
      operationId: getRuntimeLog
      summary: One runtime log entry
      description: |
        **Status:** Implemented.

        One entry for the Logs inspector, when the one in the URL is not on the current page. 404 once it is older than 7 days.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Use an `items[].id` from `GET .../logs` as `{log}`.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeLog' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/projects/{project}/observability:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
    get:
      tags: [Logs]
      operationId: getObservability
      summary: Production's requests, errors and latency
      description: |
        **Status:** Implemented.

        The Observability page: production's traffic over a range, from the runtime logs (the edge's requests to the project's production builds, at its address or a build's own). Requests and server errors (5xx) per bucket with p75 and p99 response times, totals with p50, p75 and p99 against the period before, the busiest routes, requests by status class and by region, and the routes for the Route filter. Times are milliseconds from the edge receiving a request to its last byte. Routes group a path's ids (`/products/8412` is `/products/[id]`) and a static folder's files (`/_next/*`). Percentiles are exact. Buckets are 12 x 5 minutes (`1h`), 24 x an hour (`24h`) or 7 x a day (`7d`), on Lagos's clock; the last is the one still filling.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call `GET /v1/teams/{team}/projects` and use the selected `items[].id` or `items[].slug` as `{project}`.
        4. Call with the page's filters; `range` defaults to `24h`. Send a route from `all_routes` as `route`.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d], default: 24h }, description: 'Buckets: 12 x 5 minutes, 12 x 30 minutes (the project overview''s health), 24 x an hour, 7 x a day.' }
        - { name: route, in: query, schema: { type: string, maxLength: 500 }, description: 'A route from `all_routes`.' }
        - { name: status, in: query, schema: { type: string, enum: [2xx, 3xx, 4xx, 5xx] }, description: Narrows everything but `statuses`. }
        - { name: region, in: query, schema: { type: string }, description: 'A region code; `abj-1` is the only one with traffic.' }
      responses:
        '200':
          description: The page's numbers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Observability' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/projects/{project}/analytics:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Insights]
      operationId: getAnalytics
      summary: A project's visitors and page views
      description: |
        **Status:** Implemented.

        The Analytics page: page views the project's visitors' browsers sent with `@useorbits/analytics` (the edge's `/_orbits/analytics.js`, which sends beacons to `/_orbits/e` on the project's own host), to its production deployments only (not a preview's), over a range against the span before it. `buckets` are the range's hours (`24h`) or Lagos days (`7d`, `30d`), the last one still filling; `previous_buckets` are the span before, in the same order. A visitor is counted once a Lagos day: nothing identifies them across days, and neither their address nor their browser is kept. A bounce is a visitor with one page view. `pages` are by the route the framework named (`/blog/[slug]`, from the Next.js, SvelteKit and Astro components), or else the path with its ids grouped (`/products/8412` is `/products/[id]`). `referrers` are other sites' hosts; `host: null` is a visit nobody linked to. `countries` is empty until the edge looks them up. `events` are custom events (`track()`), most sent first. Lists keep their top ten.

        **Frontend flow:**

        1. Sign in, then call `GET /v1/teams` and use the selected `items[].id` or `items[].slug` as `{team}`, and a project's `slug` or `id` from `GET /v1/teams/{team}/projects` as `{project}`.
        2. `enabled: false` shows the page's Enable state; `PUT` turns it on. Nothing is collected while it's off: the edge serves the script, and logs beacons, only for projects that turned it on.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: range, in: query, schema: { $ref: '#/components/schemas/InsightsRange' } }
      responses:
        '200':
          description: 'The page''s numbers, or `{ "enabled": false }`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analytics' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [Insights]
      operationId: setAnalytics
      summary: Turn Analytics on or off
      description: |
        **Status:** Implemented.

        The Analytics page's Enable switch. While it's off, production's hosts don't serve `/_orbits/analytics.js` and page views and events aren't logged; the edge picks a change up within seconds.

        Turning it **on** needs Pro: a team on Free gets 402 `plan_required` (feature `analytics`). Turning it off is always allowed.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsightsSwitch' }
      responses:
        '200':
          description: The switch as it now is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsSwitch' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/analytics/event:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Insights]
      operationId: getAnalyticsEvent
      summary: One custom event and its properties
      description: |
        **Status:** Implemented.

        A custom event from the Analytics page's `events` (sent with `track(name, properties)`) over a range, production only: how often it was sent, by how many visitors, and its properties, ten at most, each with its ten commonest values. A value that isn't a string is shown as its JSON (`3`, `true`, `null`).

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
        - { name: range, in: query, schema: { $ref: '#/components/schemas/InsightsRange' } }
      responses:
        '200':
          description: 'The event, or `{ "enabled": false }`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/projects/{project}/speed-insights:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Insights]
      operationId: getSpeedInsights
      summary: A project's Web Vitals from real visits
      description: |
        **Status:** Implemented.

        The Speed Insights page: Web Vitals the project's visitors' browsers measured and sent with `@useorbits/speed-insights` (the edge's `/_orbits/speed-insights.js`) from its production deployments, on one kind of device (`mobile` counts tablets), at the 75th percentile. LCP, INP, FCP and TTFB are milliseconds, CLS a unitless score. `score` is 0 to 100 from the p75s there are, as Lighthouse scores each metric (90 at its good line, 50 at its median) weighted FCP 15%, LCP 30%, INP 30% and CLS 25%; TTFB is shown but not scored; null without any. `lcp` is LCP's p75 by bucket (null where none was measured). `routes` are the most visited, ten at most, by the route the framework named or the path with its ids grouped, with each vital's p75 or null. `targets` are the elements (CSS selectors) most often behind LCP, INP and CLS, five each, with how often and their p75. `connections` are LCP samples by the connection they were measured on.

        **Frontend flow:**

        1. Sign in, then use `{team}` and `{project}` as for `GET .../analytics`.
        2. `enabled: false` shows the page's Enable state; `PUT` turns it on. Ratings: LCP good to 2,500 ms and poor past 4,000; INP 200 and 500; CLS 0.1 and 0.25; FCP 1,800 and 3,000; TTFB 800 and 1,800.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: range, in: query, schema: { $ref: '#/components/schemas/InsightsRange' } }
        - { name: device, in: query, schema: { type: string, enum: [mobile, desktop], default: mobile } }
      responses:
        '200':
          description: 'The page''s numbers, or `{ "enabled": false }`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpeedInsights' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '503': { $ref: '#/components/responses/Unavailable' }
    put:
      tags: [Insights]
      operationId: setSpeedInsights
      summary: Turn Speed Insights on or off
      description: |
        **Status:** Implemented.

        The Speed Insights page's Enable switch. While it's off, production's hosts don't serve `/_orbits/speed-insights.js` and vitals aren't logged; the edge picks a change up within seconds.

        Turning it **on** needs Pro: a team on Free gets 402 `plan_required` (feature `speed_insights`). Turning it off is always allowed.

        **Permissions:** Owners, admins and members. Viewers get 403; a non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsightsSwitch' }
      responses:
        '200':
          description: The switch as it now is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightsSwitch' }
        '402': { $ref: '#/components/responses/PlanRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/flags:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Flags]
      operationId: listFlags
      summary: A project's feature flags
      description: |
        **Status:** Implemented.

        The Flags page: every flag, newest first, with each environment's setting. `q` matches the key or description, `type` narrows to one type; `total` counts them all, for "3 of 5 flags".

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
