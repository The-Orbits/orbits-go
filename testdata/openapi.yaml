        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/integrations/slack/install:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Integrations]
      operationId: startSlackInstall
      summary: Start connecting Slack
      description: |
        **Status:** Implemented. 503 until the server has a Slack app (`SLACK_CLIENT_ID`).

        Returns Slack's "add to workspace" address. Orbits asks for `chat:write`, `chat:write.public` (post to public channels without being invited) and `channels:read` (the channel picker); it cannot read messages. `state` ties the install to this team and this user and expires after 15 minutes. Also the page's "Reconnect" link, whether or not the connection needs attention: the new grant replaces the token and keeps the channels and projects.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Send this request from "Continue to Slack", then redirect the browser to `install_url`. Slack redirects to `<web app>/integrations/slack/callback` with `code` and `state`; pass both to `POST /v1/teams/{team}/integrations/slack/callback`.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [install_url]
                properties:
                  install_url: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /teams/{team}/integrations/slack/callback:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Integrations]
      operationId: completeSlackInstall
      summary: Finish connecting Slack
      description: |
        **Status:** Implemented.

        Trades Slack's code for the bot token (kept encrypted) and names the workspace. A first install points each event at the channel the design starts with when the workspace has it (`#alerts`, `#deploys`, `#general`), else `#general`. A reconnect keeps the channels and projects. Posting the same code twice once connected answers the connection.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. First call `POST /v1/teams/{team}/integrations/slack/install` and redirect the browser. Read `code` and `state` from the callback URL and send them with the same session that started it. 422 names `state` (invalid, expired, someone else's) or `code` (refused or used; start again). Then open the Slack page.

        **Permissions:** Owner or admin, and the person who started. Members and viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlackIntegration' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '502': { description: Slack could not be reached. }
  /teams/{team}/integrations/slack/channels:
