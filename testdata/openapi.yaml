        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/flag-keys:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Project' }]
    get:
      tags: [Flags]
      operationId: getFlagKeys
      summary: Each environment's ORBITS_FLAGS key
      description: |
        **Status:** Implemented.

        Deployments get their environment's key as `ORBITS_FLAGS` (and the API's address as `ORBITS_API_URL`) without asking. These are for code that runs elsewhere: put `development`'s in `.env.local` to read Development's flags locally. A key reads its environment's flags and reports checks, nothing else.

