        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/integrations/webhooks:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Integrations]
      operationId: getWebhooksIntegration
      summary: The team's webhook
      description: |
        **Status:** Implemented.

        Where events go, which ones, from which projects, the signing secret's last four characters, and deliveries this month.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call when the Integrations page or the Webhooks page opens. 404 means none is added.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhooksIntegration' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Integrations]
      operationId: installWebhooks
      summary: Add a webhook
      description: |
        **Status:** Implemented.

        Orbits POSTs each chosen event to `url` (https, a public address), through the same sender as alert webhooks, retrying five times over about half an hour. The body:

        ```json
        { "id": "evt_…", "type": "deployment.ready", "created_at": "2026-11-02T08:30:00Z", "team": { "id": "team_…", "slug": "shady" },
          "data": { "deployment": { …as GET /v1/teams/{team}/projects/{project}/deployments/{id} } }, "delivery_id": "idl_…" }
        ```

        `data` holds `deployment` for `deployment.*`, `project` for `project.created`, `domain` for `domain.updated` (also sent when a domain is verified or stops pointing at Orbits) and `member` for `member.joined`. `Orbits-Signature` (and `X-Signature-256`, as alert webhooks send) is `sha256=` and the hex HMAC-SHA256 of the raw body keyed with the whole secret; `X-Orbits-Event` is the type and `X-Delivery-Id` stays the same on every retry. `secret` is the one the install dialog shows (`whsec_` and 12 to 64 letters or digits); without it Orbits makes one and returns it in this response only.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Send the install dialog's `url`, `events`, `secret` and `scope` (`all`, or project ids or slugs from `GET /v1/teams/{team}/projects`). A 422 names `url`, `events`, `secret` or `scope`; 409 when the team already has a webhook. To change it, uninstall and add it again.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WebhookEvent' } }
                secret: { type: string, pattern: '^whsec_[A-Za-z0-9_-]{12,64}$', writeOnly: true }
                scope: { $ref: '#/components/schemas/IntegrationScopeInput' }
      responses:
        '201':
          description: Added. `secret` only when Orbits made it.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/WebhooksIntegration' }
                  - type: object
                    properties:
                      secret: { type: string, examples: [whsec_3kq…] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Integrations]
      operationId: uninstallWebhooks
      summary: Remove the webhook
      description: |
        **Status:** Implemented.

        Orbits stops sending events to the endpoint; deliveries still queued are dropped.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Confirm in the uninstall modal, then send this request.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      responses:
        '204': { description: Removed. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/integrations/github:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Integrations]
      operationId: getGithubIntegration
      summary: The team's GitHub connection
      description: |
        **Status:** Implemented.

        The GitHub integration page: the connected account, how many webhook deliveries arrived this month, how many repositories Orbits can see, and the pull-request settings.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/integrations` first and open this page only when the `github` entry has `installed: true`; otherwise this endpoint answers 404. Use `manage_url` for "Change on GitHub". The repository table on the same page is `GET /v1/teams/{team}/integrations/github/repositories`.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: The connection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GithubIntegration' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Integrations]
      operationId: updateGithubIntegration
      summary: Change the pull-request settings
      description: |
        **Status:** Implemented.

        The three toggles under Pull requests: comment with a preview link, report deploy status as a check, build pull requests from forks. They save as the user changes them, so send only the toggle that changed.

        `build_fork_pull_requests` lets forks read preview environment variables; leave it off unless every contributor is trusted.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Read `GET /v1/teams/{team}/integrations/github` to show the current toggles, then send the changed field. Use the response as the new page state. 404 when GitHub is not connected.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment_preview_link: { type: boolean }
                report_deploy_status: { type: boolean }
                build_fork_pull_requests: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GithubIntegration' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
    delete:
      tags: [Integrations]
      operationId: disconnectGithub
      summary: Disconnect GitHub
      description: |
        **Status:** Implemented.

        Disconnect GitHub from the team. Orbits removes its record of the installation and uninstalls its GitHub App from the account. Existing deployments and domains keep working; pushes stop deploying and pull-request previews stop until GitHub is connected again.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call `GET /v1/teams/{team}/integrations/github/disconnect-impact` first and show its counts in the confirmation modal, then send this request. After 204, refresh `GET /v1/teams/{team}/integrations`.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      responses:
        '204': { description: Disconnected. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/integrations/github/disconnect-impact:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Integrations]
      operationId: getGithubDisconnectImpact
      summary: What disconnecting GitHub stops
      description: |
        **Status:** Implemented.

        The first line of the Disconnect GitHub modal: "7 projects stop deploying on push". Counts the team's projects that were imported from GitHub.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call when the user opens the Disconnect modal. 404 when GitHub is not connected.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      responses:
        '200':
          description: Impact.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: integer, description: Projects imported from GitHub that stop deploying on push and stop getting pull-request previews. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/integrations/github/approval:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Integrations]
      operationId: getGithubApproval
      summary: Whether creating a repository needs the caller's approval on GitHub
      description: |
        **Status:** Implemented.

        GitHub only lets a token acting as a person create a repository in their personal account, so before a project can be created from a template in a team whose GitHub connection is a personal account, that account's owner approves the Orbits app on GitHub once. The approval lasts up to eight hours for this team and this person. An organisation's connection needs none: `required` is false.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call on the Configure step of a template. When `required` and not `approved`, send the browser to `approve_url` (null when the service has no GitHub OAuth client configured). GitHub returns it to the App's callback URL with `code` and `state`; send both to `POST` here, then deploy.

        **Permissions:** Owner, admin or member of the team. A non-member gets 404.
      responses:
        '200':
          description: The approval's state.
          content:
            application/json:
              schema:
                type: object
                required: [account, required, approved, approve_url]
                properties:
                  account: { type: string, description: The GitHub account the team connected., examples: [EsinShadrach] }
                  required: { type: boolean, description: True for a personal account. }
                  approved: { type: boolean, description: True when no approval is needed or the caller has approved recently. }
                  approve_url: { type: [string, 'null'], format: uri }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Integrations]
      operationId: completeGithubApproval
      summary: Finish approving Orbits on GitHub
      description: |
        **Status:** Implemented.

        Sends the `code` and `state` GitHub returned with the approval. 422 on `state` when it is expired, for another person or another team; 422 on `code` when GitHub refused it; 422 without a field when the approval came from a GitHub account other than the team's (sign in to GitHub as that account and approve again).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call from the App's callback page, then return the browser to the template's Configure step.

        **Permissions:** Owner, admin or member of the team. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '204': { description: Approved; templates can be created in the account for up to eight hours. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/integrations/github/install:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Integrations]
      operationId: startGithubInstall
      summary: Start connecting GitHub
      description: |
        **Status:** Implemented.

        Start the GitHub App installation (the Install button on the GitHub card and "Import from GitHub"). Returns the GitHub address to send the browser to. `state` ties the installation to this team and this user and expires after 10 minutes.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Optionally call `GET /v1/teams/{team}/integrations` to confirm `github` is not installed. Send this request, then redirect the browser to `install_url`. GitHub shows its own consent screen and then redirects to the web app's configured setup URL with `installation_id`, `setup_action` and `state` in the query. Pass those to `POST /v1/teams/{team}/integrations/github/callback`.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [install_url]
                properties:
                  install_url: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/integrations/github/callback:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    post:
      tags: [Integrations]
      operationId: completeGithubInstall
      summary: Finish connecting GitHub
      description: |
        **Status:** Implemented.

        Complete the installation after GitHub redirects back. Orbits checks `state`, asks GitHub for the installation to confirm it exists and which account it belongs to, and records it. Repeating the call for the same installation is safe.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. First call `POST /v1/teams/{team}/integrations/github/install` and redirect the browser. Read `installation_id`, `setup_action` and `state` from the query GitHub appends to the setup URL and send them here with the same session. 422 when `state` is invalid, expired or for another team or user; 409 when the team already has a different GitHub installation. The response is the connection; continue to the Import step.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id, state]
              properties:
                installation_id: { type: integer }
                setup_action: { type: string, examples: [install] }
                state: { type: string }
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GithubIntegration' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/integrations/github/repositories:
    parameters: [{ $ref: '#/components/parameters/Team' }]
    get:
      tags: [Integrations]
      operationId: listGithubRepositories
      summary: Repositories the GitHub App can see
      description: |
        **Status:** Implemented.

        The repository list on New project > Import (GitHub) and the Repository access table on the GitHub integration page. Newest push first.

        Each row carries the framework Orbits detected (`framework: null` shows "No framework"; detection is best effort and may be null for repositories it has not inspected yet) and the project already imported from it (`project`, shown as "Already a project" with an Open button).

        shortcut: the whole installation list is fetched and cached for a minute, then filtered and paged here, so very large accounts (thousands of repositories) are capped at 500.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The team must have GitHub connected: `GET /v1/teams/{team}/integrations` shows the `github` entry with `installed: true` and `status: connected`. If not, run the connect flow (`POST /v1/teams/{team}/integrations/github/install`, then `POST /v1/teams/{team}/integrations/github/callback`) first; this endpoint answers 409 otherwise. Call when the Import step or the GitHub page opens, with optional `q` (matches the repository name). Retain `items[].full_name` and `items[].default_branch` for `POST /v1/teams/{team}/projects` (`source.repository`, `source.production_branch`). `total_count` is the number of repositories that match, for "Showing 7 of 19"; use `next_cursor` as `cursor` for "Load more". `owner` is the GitHub account for the owner dropdown.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Repositories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/integrations/github/repositories/{owner}/{repo}/branches:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Integrations]
      operationId: listGithubBranches
      summary: Branches of a repository
      description: |
        **Status:** Implemented.

        The branch picker next to the repository on New project > Configure ("main", Change).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The team must have GitHub connected: `GET /v1/teams/{team}/integrations` shows the `github` entry with `installed: true` and `status: connected`. If not, run the connect flow (`POST /v1/teams/{team}/integrations/github/install`, then `POST /v1/teams/{team}/integrations/github/callback`) first; this endpoint answers 409 otherwise. Use `owner` and `repo` from the chosen repository's `full_name` (`owner/repo`). Call when the Configure step opens or the user clicks Change next to the branch. The default branch is marked `default: true`; send the chosen name as `source.production_branch`.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: Branches, default first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, default]
                      properties:
                        name: { type: string }
                        default: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/integrations/github/repositories/{owner}/{repo}/detection:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { name: owner, in: path, required: true, schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Integrations]
      operationId: detectGithubRepository
      summary: What Orbits detects in a repository
      description: |
        **Status:** Implemented.

        The "Detected from package.json and the lock file" values on New project > Configure: framework, install, build and output commands, root directory and Node version. Anything not detected is `null`, which means "use the default".

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The team must have GitHub connected: `GET /v1/teams/{team}/integrations` shows the `github` entry with `installed: true` and `status: connected`. If not, run the connect flow (`POST /v1/teams/{team}/integrations/github/install`, then `POST /v1/teams/{team}/integrations/github/callback`) first; this endpoint answers 409 otherwise. Use `owner` and `repo` from the chosen repository's `full_name`. Call when the Configure step opens, and again with `root_directory` when the user edits the root directory or with `branch` when they change the branch. Prefill the Configure form from the response and send the user's final values in `build` and `source.root_directory` on `POST /v1/teams/{team}/projects`.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: branch, in: query, description: Defaults to the repository's default branch., schema: { type: string } }
        - { name: root_directory, in: query, description: 'Path inside the repository, default `./`.', schema: { type: string } }
      responses:
        '200':
          description: Detection result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryDetection' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /teams/{team}/integrations/{integration}/disconnect-impact:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/GitProvider' }]
    get:
      tags: [Integrations]
      operationId: getGitProviderDisconnectImpact
      summary: What disconnecting GitLab or Bitbucket stops
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`.

        The first line of the Disconnect modal: the team's projects imported from this provider, which stop deploying on push.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Call when the user opens the Disconnect modal. 404 when the provider is not connected.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      responses:
        '200':
          description: Impact.
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teams/{team}/integrations/{integration}/install:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/GitProvider' }]
    post:
      tags: [Integrations]
      operationId: startGitProviderConnect
      summary: Start connecting GitLab or Bitbucket
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`.

        Continue to GitLab and Continue to Bitbucket on the Connect modal and the Import step. Returns the provider's consent address. `state` ties the connection to this team, this user and this provider, and expires after 10 minutes. GitLab asks for the `api` and `read_repository` scopes; Bitbucket shows the Orbits consumer's permissions (account, repositories, pull requests, webhooks).

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. Optionally call `GET /v1/teams/{team}/integrations` to confirm the provider is available and not installed. Send this request, remember `{team}` (the provider sends the browser back to one fixed address, `<web app>/integrations/{integration}/callback`, with no team in it), then redirect the browser to `install_url`. On return, pass the query's `code` and `state` to `POST /v1/teams/{team}/integrations/{integration}/callback`. A query with `error` instead means the person declined.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [install_url]
                properties:
                  install_url: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/integrations/{integration}/callback:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/GitProvider' }]
    post:
      tags: [Integrations]
      operationId: completeGitProviderConnect
      summary: Finish connecting GitLab or Bitbucket
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`.

        Orbits checks `state`, trades `code` for the person's tokens (kept encrypted, refreshed as they expire) and records the account. Repeating the call once the team is connected returns the connection.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. First call `POST /v1/teams/{team}/integrations/{integration}/install` and redirect the browser. Send `code` and `state` from the query the provider appends, with the same session and the same user. 422 on `state` when it is invalid, expired, or for another team, user or provider; 422 on `code` when the provider refuses it (already used, or too old): start again. The response is the connection; continue to the Import step.

        **Permissions:** Owner or admin. Members and viewers get 403. A non-member gets 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          description: Connected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitProviderIntegration' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
        '502': { description: The provider could not be reached. }
  /teams/{team}/integrations/{integration}/repositories:
    parameters: [{ $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/GitProvider' }]
    get:
      tags: [Integrations]
      operationId: listGitProviderRepositories
      summary: GitLab projects or Bitbucket repositories Orbits can deploy
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`.

        The Import list for GitLab and Bitbucket, in the same shape as GitHub's. It lists what a webhook can be added to: GitLab projects where the connected person is Maintainer or above; Bitbucket repositories they administer, in every workspace they belong to. `full_name` is `group/subgroup/project` on GitLab and `workspace/repository` on Bitbucket. `owner` is the connected account.

        shortcut: the whole list is fetched and cached for a minute, then filtered and paged here, capped at 500.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The team must have the provider connected: `GET /v1/teams/{team}/integrations` shows its entry (`gitlab` or `bitbucket`) with `installed: true`. If not, run the connect flow (`POST /v1/teams/{team}/integrations/{integration}/install`, then `.../callback`) first; this endpoint answers 409 otherwise. Call when the Import step or the integration page opens, with optional `q` (matches the name). Retain `items[].full_name` and `items[].default_branch` for `POST /v1/teams/{team}/projects` (`source.provider` is `gitlab` or `bitbucket`); creating the project adds Orbits' webhook to the repository, and answers 422 on `source.repository` when the connected person can't add one there. Use `next_cursor` as `cursor` for Load more.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Repositories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /teams/{team}/integrations/{integration}/repositories/{owner}/{repo}/branches:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/GitProvider' }
      - { name: owner, in: path, required: true, description: 'The repository owner. On GitLab a subgroup''s project has a group path as its owner (`acme/web` for `acme/web/storefront`), sent URL-encoded as one segment (`acme%2Fweb`).', schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Integrations]
      operationId: listGitProviderBranches
      summary: Branches of a GitLab or Bitbucket repository
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`.

        The branch picker on New project > Configure, as for GitHub. The default branch comes first, marked `default: true`.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The team must have the provider connected: `GET /v1/teams/{team}/integrations` shows its entry (`gitlab` or `bitbucket`) with `installed: true`. If not, run the connect flow (`POST /v1/teams/{team}/integrations/{integration}/install`, then `.../callback`) first; this endpoint answers 409 otherwise. Split the chosen repository's `full_name` at its last slash on GitLab (its first on Bitbucket) into `owner` and `repo`.

        **Permissions:** Any team member. A non-member gets 404.
      responses:
        '200':
          description: Branches, default first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, default]
                      properties:
                        name: { type: string }
                        default: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/integrations/{integration}/repositories/{owner}/{repo}/detection:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/GitProvider' }
      - { name: owner, in: path, required: true, description: 'The repository owner. On GitLab a subgroup''s project has a group path as its owner (`acme/web` for `acme/web/storefront`), sent URL-encoded as one segment (`acme%2Fweb`).', schema: { type: string } }
      - { name: repo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Integrations]
      operationId: detectGitProviderRepository
      summary: What Orbits detects in a GitLab or Bitbucket repository
      description: |
        **Status:** Implemented for `gitlab` and `bitbucket`.

        The detected framework, commands, root directory and Node version on New project > Configure, the same as for GitHub.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`. Alternatively, reuse the Team returned by `POST /v1/teams` or `POST /v1/invites/{token}/accept`; do not create a team merely to call this endpoint.
        3. The team must have the provider connected: `GET /v1/teams/{team}/integrations` shows its entry (`gitlab` or `bitbucket`) with `installed: true`. If not, run the connect flow (`POST /v1/teams/{team}/integrations/{integration}/install`, then `.../callback`) first; this endpoint answers 409 otherwise. Use `owner` and `repo` as for the branches. Call when the Configure step opens, and again with `root_directory` or `branch` when the user changes them.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { name: branch, in: query, description: Defaults to the repository's default branch., schema: { type: string } }
        - { name: root_directory, in: query, description: 'Path inside the repository, default `./`.', schema: { type: string } }
      responses:
        '200':
          description: Detection result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryDetection' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }

  # ---------- Tokens ----------
  /teams/{team}/usage:
    get:
      tags: [Usage and activity]
      operationId: getUsage
      summary: A month of the team's usage, by day and by project
      description: |
        **Status:** Implemented.

        The team's Usage page and its CSV, a project's Usage page (its `by_project` row), and the overview's usage panel. Days are Lagos days. `requests`, `bandwidth_bytes` (bytes the edge sent, headers included) and `log_lines` come from a daily rollup of the runtime logs kept 400 days; bandwidth is counted from when the edge started recording it, so earlier requests count 0 bytes. `build_minutes` (start to finish of each build, failed ones included) and `deployments` count deployments by the day they were created, back to the team's first. `function_runs` counts requests to projects with a `function` workload (also in `requests`): each is a call to the function, though functions run as one long-lived server until a per-call runtime ships. Figures for today are as of the call.

        `previous` is the same days of the month before, for "+18% on September", or null when the team had no deployments before this month. `months` lists every month from the team's first deployment to now, newest first.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call with the month the page shows (`YYYY-MM`), or none for this month. A project's page reads its project from `by_project`.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, description: 'Defaults to this month. A month still to come is 422.' }
      responses:
        '200':
          description: The month's usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/activity:
    get:
      tags: [Usage and activity]
      operationId: listActivity
      summary: Team activity feed
      description: |
        **Status:** Implemented.

        The team's Activity page and its export: what happened across the team, newest first, one sentence each. Deployments (a preview started, production deployed, promoted or rolled back, a build failed), environment variables (added, updated, removed, restored, revealed, pulled), projects (created, renamed, settings changed, paused, deleted, moved in), members (joined, left, role changed), team settings and integrations (GitHub connected or disconnected). Invites and domains aren't in it yet. Lines are written from the platform's events a moment after they happen, kept 90 days, and read as they did then: a project or member renamed since keeps its old name in older lines.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. Call `GET /v1/teams` after sign-in and use the selected `items[].id` or `items[].slug` as `{team}`.
        3. Call with the page's filters. A project's Activity page is this list with `project` set; its "Configuration" filter is `type=variables,projects`. `since` defaults to 7 days ago and goes back 90 days at most. `people` and `projects` list everyone and every project in the team's feed, for the filter menus; send a person's `id` as `actor` and a project's `id` or `slug` as `project`. For "Load more", send `next_cursor` as `cursor`. For an export, follow `next_cursor` with `limit=100` until it's null.
        4. Link each line from `category`, `project` and `deployment_id`: a deployment's page, the project's environment variables, the project, Members, Settings or Integrations.

        **Permissions:** Any team member. A non-member gets 404.
      parameters:
        - { $ref: '#/components/parameters/Team' }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: "Matches the sentence, the actor's name or the project's name, in any case." }
        - { name: actor, in: query, schema: { type: string }, description: "A person's `id` from `people`." }
        - { name: project, in: query, schema: { type: string }, description: "A project's `id` or `slug`." }
        - { name: type, in: query, schema: { type: string, examples: [deployments, 'variables,projects'] }, description: 'One `ActivityCategory`, or several separated by commas.' }
        - { name: since, in: query, schema: { type: string, format: date-time }, description: 'Oldest line to return; defaults to 7 days ago, and is clamped to 90 days ago.' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string }, description: '`next_cursor` from the previous page.' }
      responses:
        '200':
          description: One page of lines, newest first, and how many match.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /operations/{operation}:
    get:
      tags: [Usage and activity]
      operationId: getOperation
      summary: Poll an asynchronous operation
      description: |
        **Status:** Implemented for project operations (`project.delete`, `project.transfer`).

        Poll an asynchronous operation.

        **Frontend flow:**

        1. Sign in through `POST /v1/auth/email-links` then `POST /v1/auth/email-links/verify`, or `GET /v1/auth/providers/{provider}/authorize` then the provider redirect and `POST /v1/auth/providers/{provider}/callback`. Use the returned `token` as `Authorization: Bearer <token>`; reuse an existing unexpired session instead of signing in again.
        2. First obtain an Operation response from `DELETE /v1/teams/{team}/projects/{project}` or `POST /v1/teams/{team}/projects/{project}/transfers` (`DELETE /v1/teams/{team}` is planned). Use that response's `id` (an `op_` ID) as `{operation}` and keep the session that is authorized for the originating resource. A Deployment response's `id` is not an operation ID, even when its HTTP status is 202. Poll until `state` is `succeeded` or `failed`; inspect `error` on failure and refresh the originating resource after success. Only the person who started the operation, or an owner or admin of the team it ran in, can read it; anyone else gets 404.

        **Permissions:** The starter of the operation or an owner or admin of the team it ran in.
      parameters: [{ name: operation, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------- Webhooks (inbound) ----------
  /webhooks/github:
    post:
      tags: [Webhooks]
      operationId: receiveGithubWebhook
      summary: GitHub App webhook (push, pull_request, installation)
      security: []
      description: |
        **Status:** Implemented.

        Not for clients. Authenticated by `X-Hub-Signature-256` (HMAC-SHA256 of the raw body with the GitHub App webhook secret), not by a bearer token. The gateway forwards it untouched to git-ingest, which verifies the signature, de-duplicates on `X-GitHub-Delivery` and answers 202 quickly. Pushes and pull-request changes become `git.push` and `git.pull_request` events; installation changes update the team's connection (removed, suspended, repositories changed).

        **Frontend flow:**

        1. No frontend API calls are prerequisites, and the frontend must not call this endpoint. This is a server-to-server GitHub delivery route, not a sign-in callback.
        2. Before GitHub can deliver here, an operator registers the GitHub App with this URL (`https://<api host>/v1/webhooks/github`) and the matching secret in `GITHUB_WEBHOOK_SECRET`. GitHub supplies `X-GitHub-Delivery`, `X-GitHub-Event`, `X-Hub-Signature-256` and the raw event body. Do not expose the secret or manufacture signatures in browser code.

        **Permissions:** No bearer token. The signature is the credential; a missing or wrong signature gets 401.
      parameters:
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: "Accepted, or already seen." }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /webhooks/flutterwave:
    post:
      tags: [Webhooks]
      operationId: receiveFlutterwaveWebhook
      summary: Flutterwave payment webhook
      security: []
      description: |
        **Status:** Implemented.

        Not for clients. Flutterwave sends a `charge.completed` event here when a payment is made. It is authenticated by the `verif-hash` header, which must equal the secret hash set in Flutterwave's dashboard (`FLUTTERWAVE_WEBHOOK_HASH`), not by a bearer token. Nothing in the body is believed: control looks the payment up at Flutterwave by its id, checks that it is for the invoice's reference, in Naira, for at least the invoice amount, and only then marks the invoice paid and the team Pro. A payment already settled, one that isn't ours, or another event is acknowledged with 200 and ignored. If Flutterwave can't be reached the answer is 503, so Flutterwave delivers it again.

        **Frontend flow:**

        1. No frontend API calls are prerequisites, and the frontend must not call this endpoint. An operator registers `https://<api host>/v1/webhooks/flutterwave` and the secret hash in Flutterwave's dashboard.

        **Permissions:** No bearer token. The `verif-hash` header is the credential; a missing or wrong one gets 401.
      parameters:
        - { name: verif-hash, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Received. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /webhooks/gitlab:
    post:
      tags: [Webhooks]
      operationId: receiveGitlabWebhook
      summary: GitLab project webhook (push, merge request)
      security: []
      description: |
        **Status:** Implemented.

        Not for clients. Orbits adds this webhook to a GitLab project when a project is created from it, with a secret token derived for that team and repository; GitLab sends it back as `X-Gitlab-Token`. git-ingest finds the teams whose token matches, de-duplicates on `X-Gitlab-Event-UUID`, and turns pushes to branches and merge requests (opened, reopened, new commits, closed, merged) into the same `git.push.received` and `git.pull_request.changed` events as GitHub's, with `provider: gitlab`.

        **Frontend flow:**

        1. No frontend API calls are prerequisites, and the frontend must not call this endpoint. It is a server-to-server delivery route.
        2. Nothing to register by hand: the webhook is added through the GitLab API with the connected person's grant.

        **Permissions:** No bearer token. The webhook token is the credential; a wrong or missing one gets 401.
      parameters:
        - { name: X-Gitlab-Token, in: header, required: true, schema: { type: string } }
        - { name: X-Gitlab-Event, in: header, required: true, schema: { type: string } }
        - { name: X-Gitlab-Event-UUID, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: "Accepted, or already seen." }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /webhooks/bitbucket:
    post:
      tags: [Webhooks]
      operationId: receiveBitbucketWebhook
      summary: Bitbucket repository webhook (push, pull request)
      security: []
      description: |
        **Status:** Implemented.

        Not for clients. Orbits adds this webhook to a Bitbucket repository when a project is created from it, with a secret derived for that team and repository; Bitbucket signs each delivery with it (`X-Hub-Signature`, HMAC-SHA256 of the raw body). git-ingest finds the teams whose secret verifies, de-duplicates on `X-Request-UUID`, and turns each pushed branch and each pull-request change (created, updated, merged, declined) into the same `git.push.received` and `git.pull_request.changed` events as GitHub's, with `provider: bitbucket`.

        **Frontend flow:**

        1. No frontend API calls are prerequisites, and the frontend must not call this endpoint. It is a server-to-server delivery route.
        2. Nothing to register by hand: the webhook is added through the Bitbucket API with the connected person's grant.

        **Permissions:** No bearer token. The signature is the credential; a missing or wrong one gets 401.
      parameters:
        - { name: X-Hub-Signature, in: header, required: true, schema: { type: string } }
        - { name: X-Event-Key, in: header, required: true, schema: { type: string } }
        - { name: X-Request-UUID, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: "Accepted, or already seen." }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token or team API token. No long-lived JWTs are issued to browsers.
    flagsKey:
      type: http
      scheme: bearer
      description: A deployment's ORBITS_FLAGS key (ofl_…), for @useorbits/flags.
    workflowsKey:
      type: http
      scheme: bearer
      description: A deployment's ORBITS_WORKFLOWS key (owf_…), for @useorbits/workflows.
    sandboxTerminalTicket:
      type: apiKey
      in: query
      name: ticket
      description: 'A sandbox terminal ticket (`sbt_…`, 60 seconds) from `POST /v1/teams/{team}/projects/{project}/sandboxes/{sandbox}/terminal-ticket`, in the WebSocket URL: a browser WebSocket cannot send a bearer.'

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Team:
      name: team
      in: path
      required: true
      description: Team slug or `team_` id.
      schema: { type: string }
    Project:
      name: project
      in: path
      required: true
      description: Project slug or `prj_` id.
      schema: { type: string }
    Deployment:
      name: deployment
      in: path
      required: true
      schema: { type: string, pattern: '^dpl_' }
    Domain:
      name: domain
      in: path
      required: true
      description: 'The domain''s name, or its `dom_` id.'
      schema: { type: string }
    User:
      name: user
      in: path
      required: true
      schema: { type: string, pattern: '^usr_' }
    Invite:
      name: invite
      in: path
      required: true
      schema: { type: string }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [github, gitlab, bitbucket] }
    IntegrationKey:
      name: integration
      in: path
      required: true
      schema: { type: string, examples: [slack, paystack, sentry] }
    GitProvider:
      name: integration
      in: path
      required: true
      description: A Git provider connected by OAuth. GitHub has its own routes under `github`.
      schema: { type: string, enum: [gitlab, bitbucket] }

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      headers:
        WWW-Authenticate:
          description: 'From the gateway: `Bearer realm="orbits"`, plus `error="invalid_token"` when a bearer was sent and refused (wrong, revoked or expired).'
          schema: { type: string, examples: ['Bearer realm="orbits", error="invalid_token"'] }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not allowed in this team.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not visible to the caller (the two are indistinguishable on purpose).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The request conflicts with current state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Invalid:
      description: Validation failed, or the Idempotency-Key was reused with a different body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unavailable:
      description: A store this endpoint reads is unreachable. Try again shortly.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PlanRequired:
      description: The team's plan doesn't include this (see `GET /v1/plans`). `code` is `plan_required`, `required_plan` is `pro` and `feature` names what is missing; show the upgrade dialog.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Over a rate limit (see "Rate limits" above). Wait `Retry-After` seconds.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds until a request is allowed again. }
        RateLimit-Limit: { schema: { type: integer }, description: "The budget's size: how many requests can be made at once." }
        RateLimit-Remaining: { schema: { type: integer }, description: 'Whole requests left in it (0 on a 429).' }
        RateLimit-Reset: { schema: { type: integer }, description: Seconds until it is full again. }
        RateLimit-Scope: { schema: { type: string, enum: [user, token, team, address, email] }, description: Whose budget ran out. }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        code: { type: string, description: 'A stable reason, where one is defined: `plan_required` (402); `price_changed` and `already_pro` (409) and `billing_unavailable` (503) from billing.' }
        required_plan: { type: string, enum: [pro], description: 'On a 402: the plan that includes what was asked for.' }
        feature: { type: string, enum: [functions, sandboxes, analytics, speed_insights], description: 'On a 402: what the plan lacks.' }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    Invoice:
      type: object
      required: [id, kind, status, usd_cents, ngn_amount, fx_rate, period, reference, method, paid_at, created_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [initial, renewal, manual], description: 'A first purchase, an automatic renewal, or a payment made by hand while already Pro or past due.' }
        status: { type: string, enum: [open, paid, failed, void] }
        usd_cents: { type: integer, description: The dollar price. }
        ngn_amount: { type: integer, description: 'Whole Naira charged: the dollar price at `fx_rate`, rounded up to a whole ₦100, locked when the invoice was made.' }
        fx_rate: { type: string, description: The USD → NGN rate it was converted at. }
        period:
          type: [object, 'null']
          description: The month it paid for; null until it is paid.
          required: [start, end]
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        reference: { type: string }
        method: { type: [string, 'null'], enum: [card, bank_transfer, other, null], description: 'How it was paid; null until it is.' }
        paid_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Receipt:
      allOf:
        - $ref: '#/components/schemas/Invoice'
        - type: object
          required: [team, payer_email, description, card]
          properties:
            team:
              type: object
              required: [id, slug, name]
              properties:
                id: { type: string }
                slug: { type: string }
                name: { type: string }
            payer_email: { type: [string, 'null'], format: email }
            description: { type: string, examples: [Orbits Pro, one month] }
            card:
              type: [object, 'null']
              description: The card it was paid with; null when it is unpaid or was paid by bank transfer.
              required: [last4]
              properties:
                brand: { type: [string, 'null'] }
                last4: { type: string }
                exp: { type: [string, 'null'] }
    UserAvatar:
      type: object
      required: [avatar_url]
      properties:
        avatar_url: { type: [string, 'null'], description: 'The photo, as a path on this API (`/v1/users/{id}/avatar?v=…`), or null.' }
    AvatarUpload:
      type: object
      required: [id, method, url, headers, expires_at, max_bytes]
      properties:
        id: { type: string, description: 'Pass it to `.../uploads/{upload}/complete`.', examples: [upl_0192f3a6-0c1d-7a55-9a52-6f1f0f0f0f0f] }
        method: { type: string, const: PUT }
        url: { type: string, format: uri, description: A presigned storage URL. Treat it as a secret until it is used; it expires. }
        headers: { type: object, additionalProperties: { type: string }, description: 'Send exactly these headers with the file, and none besides (they are covered by the signature).' }
        expires_at: { type: string, format: date-time }
        max_bytes: { type: integer, description: The largest file accepted. }
    SourceUpload:
      type: object
      required: [id, method, url, headers, expires_at, max_bytes]
      properties:
        id: { type: string, description: 'Pass it to `.../uploads/{upload}/complete`.', examples: [upl_0192f3a6-0c1d-7a55-9a52-6f1f0f0f0f0f] }
        method: { type: string, const: PUT }
        url: { type: string, format: uri, description: A presigned storage URL. Treat it as a secret until it is used; it expires. }
        headers: { type: object, additionalProperties: { type: string }, description: 'Send exactly these headers with the file, and none besides (they are covered by the signature).' }
        expires_at: { type: string, format: date-time }
        max_bytes: { type: integer, description: The largest zip accepted. }
    Slug:
      type: string
      pattern: '^[a-z0-9]([a-z0-9-]{1,38})[a-z0-9]$'
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    EnvironmentName:
      type: string
      enum: [production, preview, development]
    Page:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }
    Operation:
      type: object
      required: [id, kind, state, created_at]
      properties:
        id: { type: string, pattern: '^op_' }
        kind: { type: string, examples: [team.delete, project.transfer, domain.remove] }
        state: { type: string, enum: [pending, running, succeeded, failed] }
        resource: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error:
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/Problem' }
    SignInClient:
      type: object
      description: |
        The person's browser, as the web app saw it: sign-ins reach the API from the web app's server, so the request's own user agent and address are the server's. Read from the browser's request (`User-Agent`, and the client address Nginx passes in `X-Forwarded-For`).
      properties:
        user_agent: { type: string, maxLength: 1000 }
        ip: { type: string, description: An IPv4 or IPv6 address. }
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        invite_token: { type: string, description: Present only when a sign-in link was requested from an invite flow; use it with the invite lookup and accept endpoints. }
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge_token, expires_at]
      description: The first sign-in step passed; the account has two-factor on. Finish with `POST /v1/auth/two-factor`.
      properties:
        two_factor_required: { const: true }
        challenge_token: { type: string, description: Single use; keep it server side like a session token. }
        expires_at: { type: string, format: date-time, description: 10 minutes after the first step. }
    TwoFactorStatus:
      type: object
      required: [enabled, since, recovery_codes_left]
      properties:
        enabled: { type: boolean }
        since: { type: [string, 'null'], format: date-time }
        recovery_codes_left: { type: integer, description: 'Unused recovery codes, out of 10.' }
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, pattern: '^usr_' }
        email: { type: string, format: email }
        name: { type: string }
        username: { type: [string, 'null'], description: 'Their handle: unique, lowercase letters, numbers and dashes. Null until they set one.' }
        avatar_url: { type: [string, 'null'], format: uri-reference, description: 'A path on this API (`/v1/users/{id}/avatar?v=…`) for an uploaded photo, or an absolute URL from a sign-in provider.' }
        two_factor_enabled: { type: boolean, description: Whether the person has two-factor on. On a team member it is as of their last visit. }
    Team:
      type: object
      required: [id, name, slug, role, plan, created_at]
      properties:
        id: { type: string, pattern: '^team_' }
        name: { type: string }
        slug: { $ref: '#/components/schemas/Slug' }
        avatar_url: { type: [string, 'null'], format: uri-reference, description: 'A path on this API (`/v1/teams/{id}/avatar?v=…`) for an uploaded avatar.' }
        default_region: { type: string, examples: [abj-1] }
        role: { $ref: '#/components/schemas/Role' }
        require_two_factor: { type: boolean, description: Members without two-factor are refused on this team's routes (403). }
        session_max_age_days: { type: integer, description: 'A member whose session started longer ago is refused on this team (403) until they sign in again. The settings page offers 1, 7 and 30: every session ends after 30 days anyway, so a longer limit never applies.' }
        inviters: { type: string, enum: [owners, members], description: '`owners`: owners and admins invite. `members`: members may too (as member or viewer only).' }
        sign_in_methods:
          type: array
          items: { type: string, enum: [email, github, gitlab, bitbucket] }
          description: How members may have signed in. A member whose session used another method (or one from before methods were recorded) is refused on this team (403) until they sign in again with one of these.
        plan: { $ref: '#/components/schemas/PlanId' }
        billing_alert:
          description: The owners' billing notice (see `GET .../billing` `banner`), so the app shell can show it without another call. Null for everyone else and most of the time.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillingAlert'
        created_at: { type: string, format: date-time }
    PlanId:
      type: string
      enum: [free, pro]
    PlanFeatures:
      type: object
      required: [unlimited_projects, functions, sandboxes, analytics, speed_insights, sleeps_when_idle]
      properties:
        unlimited_projects: { type: boolean }
        functions: { type: boolean, description: 'The `function` workload type. On Free the same frameworks (Next.js, SvelteKit, Nuxt, Remix...) run as ordinary apps.' }
        sandboxes: { type: boolean }
        analytics: { type: boolean }
        speed_insights: { type: boolean }
        sleeps_when_idle: { type: boolean, description: 'Apps scale to zero when idle (Free). Not running yet: Free apps stay on until that ships.' }
    Plan:
      type: object
      required: [id, name, usd_cents, ngn, features]
      properties:
        id: { $ref: '#/components/schemas/PlanId' }
        name: { type: string, examples: [Pro] }
        usd_cents: { type: integer, examples: [500] }
        ngn: { type: [integer, 'null'], description: 'Whole Naira at the current rate, rounded up to a whole ₦100; 0 for Free; null while no rate is set.', examples: [8000] }
        features: { $ref: '#/components/schemas/PlanFeatures' }
    BillingAlert:
      description: |
        What the owners' banner says about the team's plan. `upcoming`: the renewal is within three days (`charge` says whether Orbits charges the card itself or the owner must pay). `payment_failed`: the last payment did not go through and Pro runs on until `grace_ends_at`; offer to pay now. `canceling`: Pro ends at `ends_at`; offer to keep it. `downgraded`: the team was put back on Free (shown for 30 days); offer to upgrade. `amount_ngn` is the price locked on the renewal invoice once it exists, else today's.
      oneOf:
        - type: object
          required: [kind, at, amount_ngn, charge]
          properties:
            kind: { type: string, const: upcoming }
            at: { type: string, format: date-time }
            amount_ngn: { type: [integer, 'null'] }
            charge: { type: string, enum: [automatic, manual] }
        - type: object
          required: [kind, grace_ends_at, amount_ngn]
          properties:
            kind: { type: string, const: payment_failed }
            grace_ends_at: { type: string, format: date-time }
            amount_ngn: { type: [integer, 'null'] }
        - type: object
          required: [kind, ends_at]
          properties:
            kind: { type: string, const: canceling }
            ends_at: { type: string, format: date-time }
        - type: object
          required: [kind, at]
          properties:
            kind: { type: string, const: downgraded }
            at: { type: string, format: date-time }
    Billing:
      type: object
      required: [plan, status, source, enforced, current_period, cancel_at_period_end, grace_ends_at, price, next_charge, entitlements, card, can_manage, banner]
      properties:
        plan: { $ref: '#/components/schemas/PlanId' }
        status: { type: string, enum: [free, active, past_due], description: '`past_due`: Pro, but the period has ended unpaid and the team is in its grace period.' }
        source: { type: [string, 'null'], enum: [flutterwave, comp, null], description: '`comp`: Pro granted by Orbits, nothing to pay. Null on Free.' }
        enforced: { type: boolean, description: 'Whether plan limits are switched on. When false every feature works for every team.' }
        current_period:
          oneOf:
            - type: 'null'
            - type: object
              required: [start, end]
              properties:
                start: { type: string, format: date-time }
                end: { type: [string, 'null'], format: date-time, description: Null for a plan with no end (`comp`). }
        cancel_at_period_end: { type: boolean }
        grace_ends_at: { type: [string, 'null'], format: date-time }
        price:
          type: object
          description: Pro's price today, for the upgrade button.
          required: [usd_cents, ngn, rate]
          properties:
            usd_cents: { type: integer }
            ngn: { type: [integer, 'null'] }
            rate: { type: [string, 'null'] }
        next_charge:
          oneOf:
            - type: 'null'
            - type: object
              required: [usd_cents, ngn]
              properties:
                usd_cents: { type: integer }
                ngn: { type: [integer, 'null'] }
        entitlements:
          type: object
          required: [functions, sandboxes, analytics, speed_insights, sleeps_when_idle]
          description: What this team may do now. All true (and `sleeps_when_idle` false) while `enforced` is false.
          properties:
            functions: { type: boolean }
            sandboxes: { type: boolean }
            analytics: { type: boolean }
            speed_insights: { type: boolean }
            sleeps_when_idle: { type: boolean }
        card:
          oneOf:
            - type: 'null'
            - type: object
              required: [brand, last4, exp]
              description: The card on file, for owners only. Never the card number.
              properties:
                brand: { type: [string, 'null'] }
                last4: { type: string, examples: ['4471'] }
                exp: { type: [string, 'null'], examples: ['09/28'] }
        can_manage: { type: boolean, description: 'True for owners, who may change billing.' }
        banner:
          description: The owners' notice about the plan, or null. Always null for members.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillingAlert'
    Me:
      allOf:
        - { $ref: '#/components/schemas/User' }
        - type: object
          required: [teams]
          properties:
            sign_in_methods:
              type: array
              description: The OAuth providers linked to this account. Email link is always available and is not listed here.
              items: { type: string, enum: [github, gitlab, bitbucket] }
            time_zone: { type: [string, 'null'], description: Their IANA time zone for clocks and dates. Null until they set one. }
            product_updates: { type: boolean, description: Whether they opted in to product-update emails. }
            session:
              type: object
              description: This session, as a team's sign-in method and session length rules see it.
              properties:
                method: { type: [string, 'null'], enum: [email, github, gitlab, bitbucket, api_token, null], description: '`api_token` when the bearer is an API token. Null for a session from before methods were recorded.' }
                started_at: { type: [string, 'null'], format: date-time, description: 'When the session signed in, or when the API token was made.' }
            token:
              type: object
              description: Only when the bearer is an API token (`orb_live_…`), what it may do. Absent for a session.
              required: [id, team_id, access, project_id, created_at]
              properties:
                id: { type: string }
                team_id: { type: string, description: The one team the token acts in. }
                access: { type: string, enum: [full, read] }
                project_id: { type: [string, 'null'], description: 'The one project the token is limited to, or null for every project of the team.' }
                created_at: { type: string, format: date-time }
            teams:
              type: array
              description: The teams the caller belongs to (all of `GET /v1/teams`), each with a preview of its projects.
              items:
                allOf:
                  - { $ref: '#/components/schemas/Team' }
                  - type: object
                    required: [project_count, projects]
                    properties:
                      project_count: { type: integer, description: All projects in the team. }
                      projects:
                        type: array
                        description: The newest 20 projects, in the order of `GET /v1/teams/{team}/projects`. Compare with `project_count`, and call that endpoint for the rest.
                        items: { $ref: '#/components/schemas/Project' }
    TeamDetail:
      allOf:
        - { $ref: '#/components/schemas/Team' }
        - type: object
          required: [members]
          properties:
            notifications: { $ref: '#/components/schemas/NotificationRules' }
            members:
              type: array
              description: 'Active members, then pending email invites (`status: invited`). Same rows as `GET /v1/teams/{team}/members` without `q`.'
              items: { $ref: '#/components/schemas/Member' }
    TeamUpdate:
      type: object
      properties:
        name: { type: string }
        slug: { $ref: '#/components/schemas/Slug' }
        avatar_url: { type: [string, 'null'], format: uri }
        default_region: { type: string, enum: [abj-1], description: Abuja is the only region in v1. }
        require_two_factor: { type: boolean }
        session_max_age_days: { type: integer, minimum: 1, maximum: 365 }
        inviters: { type: string, enum: [owners, members] }
        sign_in_methods:
          type: array
          minItems: 1
          items: { type: string, enum: [email, github, gitlab, bitbucket] }
          description: 422 when it leaves out the method the caller signed in with.
        notifications:
          type: object
          description: 'Only the switches that change, as `{"deploy.live": {"email": true}}`; the rest stay. 422 on `notifications` for an unknown event or channel.'
          additionalProperties:
            type: object
            properties:
              email: { type: boolean }
              slack: { type: boolean }
    ApiToken:
      type: object
      required: [id, name, access, project, hint, created_at, created_by, last_used_at, last_used_by, expires_at]
      properties:
        id: { type: string, pattern: '^tok_' }
        name: { type: string, examples: [ci-deploys] }
        access: { type: string, enum: [full, read] }
        project:
          description: The one project it is limited to, or null for all of the team's projects.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, slug, name]
              properties:
                id: { type: string }
                slug: { type: string }
                name: { type: string }
        hint: { type: string, description: 'The table''s mask, with the secret''s last four characters.', examples: ['orb_live_••••3f9a'] }
        created_at: { type: string, format: date-time }
        created_by:
          type: object
          description: The person it acts as.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        last_used_at: { type: [string, 'null'], format: date-time }
        last_used_by: { type: [string, 'null'], description: The client's name and version from its User-Agent., examples: [orbits-cli/0.4.1] }
        expires_at: { type: [string, 'null'], format: date-time, description: Null for "Never". Past it the token answers 401. }
    NotificationRules:
      type: object
      description: |
        Settings > Notifications: one switch per event and channel. Email goes to everyone who can deploy (owners, admins and members). A Slack switch decides whether that event goes to Slack; the Slack integration's page decides the channel (`PATCH /v1/teams/{team}/integrations/slack`).
        `deploy.failed`: a production or preview build fails. `deploy.live`: a production deploy goes live (off until turned on). `domain.attention`: a domain's DNS stops pointing at Orbits, its certificate can't be issued, or one within 14 days of expiring hasn't renewed; email goes to everyone who can deploy. A domain still not set up an hour after adding it also gets its own DNS email, to whoever added it (the same switch turns it off). `member.joined`: someone joins (not told to themselves). `weekly`: Mondays at 9:00 Lagos, the past Monday to Sunday across the team's projects; on Slack it is a short post (visitors, deploys, build time) in the channel picked for `deploy.live`, or any channel the Slack page has.
      required: [deploy.failed, deploy.live, domain.attention, member.joined, weekly]
      properties:
        deploy.failed: { $ref: '#/components/schemas/NotificationSwitches' }
        deploy.live: { $ref: '#/components/schemas/NotificationSwitches' }
        domain.attention: { $ref: '#/components/schemas/NotificationSwitches' }
        member.joined: { $ref: '#/components/schemas/NotificationSwitches' }
        weekly: { $ref: '#/components/schemas/NotificationSwitches' }
    NotificationSwitches:
      type: object
      required: [email, slack]
      properties:
        email: { type: boolean }
        slack: { type: boolean }
    TeamPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Team' } }
    TeamOverview:
      type: object
      required: [range, projects, deployments, requests, logs_available]
      properties:
        range: { type: string }
        logs_available: { type: boolean, description: 'False while the log store can''t be reached: `requests` and `series.requests` are then zeros, not a quiet day. Show them as unavailable.' }
        projects: { type: object, properties: { total: { type: integer }, failing: { type: integer } } }
        deployments: { type: object, properties: { total: { type: integer }, delta_vs_previous: { type: integer } } }
        average_build_seconds: { type: number }
        requests: { type: object, properties: { total: { type: integer }, month_to_date: { type: integer } } }
        series:
          type: object
          description: The range in equal slices, oldest first.
          required: [deployments, average_build_seconds, requests]
          properties:
            deployments: { type: array, items: { type: integer } }
            average_build_seconds: { type: array, items: { type: number } }
            requests: { type: array, items: { type: integer } }
        needs_attention:
          type: array
          items: { type: object, required: [kind, message], properties: { kind: { type: string }, message: { type: string }, link: { type: string } } }
    Notification:
      type: object
      required: [id, type, title, detail, link, project, read, created_at]
      properties:
        id: { type: string, pattern: '^act_' }
        type: { type: string, enum: [deployment.failed, domain.live, domain.misconfigured, domain.certificate.failed, team.member.added, alert.fired], description: The event it came from. }
        title: { type: string, examples: ['store failed to deploy', 'shop.example.ng is live with HTTPS'] }
        detail: { type: [string, 'null'], examples: ["Missing module 'mdsvex' · main", 'Check its DNS record', 'Invited by Tunde'], description: "The second line: a failed deploy's reason and branch (just `On main` for one recorded before reasons were kept), who invited a new member, or what to do about a domain." }
        link: { type: [string, 'null'], examples: [/teams/rsty-org/projects/store/deployments/dpl_1], description: 'A path of this API to open as the app''s own page; null when there''s nowhere to go.' }
        project:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, slug, name]
              properties:
                id: { type: string }
                slug: { type: string }
                name: { type: string }
        read: { type: boolean }
        created_at: { type: string, format: date-time }
    NotificationPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          required: [items, unread_count]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            unread_count: { type: integer, maximum: 100, description: 'The caller''s unread notifications, up to 100.' }
    Member:
      type: object
      required: [user, role, status]
      properties:
        user: { $ref: '#/components/schemas/User' }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, invited] }
        invite_id: { type: string, description: Present only for invited rows; use it for resend and revoke operations. }
        joined_at: { type: [string, 'null'], format: date-time }
        last_active_at:
          type: [string, 'null']
          format: date-time
          description: When the person last used this team with their session (not an API token), accurate to the minute. Null for a pending invite and for anyone who hasn't used the team since this was recorded; show it as "Never" only for an active member who really hasn't.
    MemberPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Member' } }
    Invite:
      type: object
      required: [id, role, created_at]
      properties:
        id: { type: string }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/Role' }
        link: { type: [string, 'null'], format: uri, description: Present for link invites only. }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitePreview:
      type: object
      required: [team_name, role]
      properties:
        team_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        invited_by: { type: string }
        email: { type: [string, 'null'], format: email }

    # ----- Projects and workloads -----
    WorkloadType:
      type: string
      description: Fixed at creation. Each type has its own runtime adapter.
      enum: [static, function, worker, app, container]
    StaticWorkload:
      type: object
      required: [type]
      properties:
        type: { const: static }
        output_directory: { type: string, examples: [dist] }
        spa_fallback: { type: boolean, default: false }
    FunctionWorkload:
      type: object
      required: [type]
      properties:
        type: { const: function }
        framework: { type: string, examples: [nextjs] }
        memory_mb: { type: integer, minimum: 128 }
        timeout_seconds: { type: integer, minimum: 1 }
    WorkerWorkload:
      type: object
      required: [type, command]
      properties:
        type: { const: worker }
        command: { type: array, items: { type: string }, minItems: 1 }
        replicas: { type: integer, minimum: 1, default: 1 }
        schedule: { type: [string, 'null'], description: Cron expression for scheduled jobs; null for a continuous worker. }
    AppWorkload:
      type: object
      required: [type, port]
      properties:
        type: { const: app }
        port: { type: integer, minimum: 1, maximum: 65535 }
        health_check_path: { type: string, default: / }
        replicas: { type: integer, minimum: 1, default: 1 }
        start_command: { type: [array, 'null'], items: { type: string } }
    ContainerWorkload:
      type: object
      required: [type, port]
      properties:
        type: { const: container }
        image: { type: [string, 'null'], description: Prebuilt image reference. Mutually exclusive with `dockerfile_path`. }
        dockerfile_path: { type: [string, 'null'] }
        port: { type: integer, minimum: 1, maximum: 65535 }
        replicas: { type: integer, minimum: 1, default: 1 }
    Workload:
      oneOf:
        - { $ref: '#/components/schemas/StaticWorkload' }
        - { $ref: '#/components/schemas/FunctionWorkload' }
        - { $ref: '#/components/schemas/WorkerWorkload' }
        - { $ref: '#/components/schemas/AppWorkload' }
        - { $ref: '#/components/schemas/ContainerWorkload' }
      discriminator:
        propertyName: type
        mapping:
          static: '#/components/schemas/StaticWorkload'
          function: '#/components/schemas/FunctionWorkload'
          worker: '#/components/schemas/WorkerWorkload'
          app: '#/components/schemas/AppWorkload'
          container: '#/components/schemas/ContainerWorkload'
    Source:
      type: object
      required: [provider, repository, production_branch]
      properties:
        provider: { type: string, enum: [github, gitlab, bitbucket, gitbucket] }
        repository: { type: string, examples: [shadyventures/storefront] }
        production_branch: { type: string, default: main }
        root_directory: { type: string, default: ./ }
    BuildConfig:
      type: object
      properties:
        framework: { type: [string, 'null'] }
        install_command: { type: [string, 'null'], description: null means detected default. }
        build_command: { type: [string, 'null'] }
        output_directory: { type: [string, 'null'] }
        ignore_command: { type: [string, 'null'], description: 'The ignored build step: run after cloning, in the repository (the commit and the one before it), as the build runs; exit 0 skips building this commit (the deployment ends `canceled`, saying why), anything else builds it. Two minutes at most, then it builds. It sees `ORBITS_GIT_COMMIT_SHA`, `ORBITS_GIT_COMMIT_REF` and `ORBITS_ENV`, and their `VERCEL_*` names. Example: `git diff --quiet HEAD^ HEAD -- ./apps/storefront`.' }
        changed_by: { type: [object, 'null'], readOnly: true, description: 'Who last changed a build setting ("Changed by Tunde Bakare yesterday").', properties: { id: { type: string }, name: { type: string } } }
        changed_at: { type: [string, 'null'], format: date-time, readOnly: true }
    ProjectStatus:
      type: string
      description: |
        What the project cards and the project switcher show. `pending` means nothing has been deployed yet.
        `building`, `ready` and `failed` follow the latest deployment (a canceled latest one falls back to production: `ready`, or `pending` if nothing served yet).
      enum: [pending, building, ready, failed, paused]
    GitSettings:
      type: object
      required: [deploy_on_push, preview_pull_requests, comment_on_pull_requests]
      properties:
        deploy_on_push: { type: boolean, description: 'Pushes to the production branch go to production; other branches get a preview.' }
        preview_pull_requests: { type: boolean, description: Each pull request gets its own address. }
        comment_on_pull_requests: { type: boolean, description: Post the preview link on the pull request and update it on every push. }
    LatestDeployment:
      type: object
      description: The newest deployment, as shown on a project card. Null until the project has one.
      required: [id, state, created_at]
      properties:
        id: { type: string, pattern: '^dpl_' }
        state: { $ref: '#/components/schemas/DeploymentState' }
        branch: { type: [string, 'null'] }
        commit_sha: { type: [string, 'null'] }
        commit_message: { type: [string, 'null'], examples: [Update checkout copy] }
        author: { type: [object, 'null'], properties: { name: { type: string }, avatar_url: { type: [string, 'null'] } } }
        failure_reason: { type: [string, 'null'], examples: ["Missing module 'mdsvex'"] }
        created_at: { type: string, format: date-time }
    Project:
      type: object
      required: [id, slug, name, workload, region, status, free_address, git, created_at]
      properties:
        id: { type: string, pattern: '^prj_' }
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        free_address: { type: string, description: 'Host name, `<slug>.theorbits.app`.', examples: [storefront.theorbits.app] }
        workload: { $ref: '#/components/schemas/Workload' }
        source:
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/Source' }
        source_kind: { type: string, enum: [git, upload], default: git, description: '`upload`: deployed by dropping files (`POST .../uploads`); `source` is null and there is no repository.' }
        build: { $ref: '#/components/schemas/BuildConfig' }
        framework_version: { type: [string, 'null'], description: 'Shown next to the framework on the overview header, e.g. `15`.', examples: ['15'] }
        node_version: { type: string, examples: [22.x] }
        region: { type: string, examples: [abj-1] }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        paused: { type: boolean }
        git: { $ref: '#/components/schemas/GitSettings' }
        preview_protection: { type: string, enum: [none, team_members, password], default: team_members, description: 'Who may open previews (production stays public). `password`: the edge asks for the project''s preview password and remembers it for 12 hours. `team_members`: a sign-in through the web app''s `/preview-access` page, which calls `POST /v1/preview-access`; shortcut: enforced only where the server has PREVIEW_TEAM_ACCESS=on, until that page ships.' }
        production_url: { type: [string, 'null'], format: uri }
        latest_deployment_id: { type: [string, 'null'] }
        latest_deployment:
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/LatestDeployment' }
        thumbnail_url: { type: [string, 'null'], format: uri-reference, description: 'API path of the screenshot of what production serves, for the project card (the `screenshot_url` of that deployment). Null until production has one. Fetch it with the session, like any API call.' }
        thumbnail_color: { type: [string, 'null'], pattern: '^#[0-9a-f]{6}$', description: 'The screenshot''s most common strong colour, which the project card glows in. Null without a screenshot, or when the page is all black, white and grey.', examples: ['#7c3aed'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: 'Also the source of the slug and free address, e.g. `checkout-v2`.' }
        slug: { $ref: '#/components/schemas/Slug' }
        workload: { $ref: '#/components/schemas/Workload' }
        source: { $ref: '#/components/schemas/Source' }
        template: { type: string, description: 'Template `key` from `GET /v1/templates`. Mutually exclusive with `source`: Orbits creates the repository in the team''s GitHub account.' }
        source_kind: { type: string, enum: [git, upload], description: 'Default `git`. `upload` creates a project with no repository, deployed by dropping files (`POST /teams/{team}/projects/{project}/uploads`); no deployment is queued until the first drop. Not with `source` or `template`.' }
        build: { $ref: '#/components/schemas/BuildConfig' }
        region: { type: string, default: abj-1 }
        env:
          type: array
          maxItems: 500
          description: Environment variables from the Configure step (Used by Production and Preview). They are saved with the project in one step; field errors come back as `env[0].key`.
          items: { $ref: '#/components/schemas/EnvVarInput' }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        workload: { $ref: '#/components/schemas/Workload' }
        source: { $ref: '#/components/schemas/Source' }
        build: { $ref: '#/components/schemas/BuildConfig' }
        git: { $ref: '#/components/schemas/GitSettingsUpdate' }
        node_version: { type: string, examples: [22.x] }
        preview_protection: { type: string, enum: [none, team_members, password] }
        preview_password: { type: string, writeOnly: true, minLength: 8, description: Only with `preview_protection` `password`. }
        region: { type: string }
    GitSettingsUpdate:
      type: object
      properties:
        deploy_on_push: { type: boolean }
        preview_pull_requests: { type: boolean }
        comment_on_pull_requests: { type: boolean }
    ProjectDeletionImpact:
      type: object
      required: [deployments, environment_variables, flags, domains]
      properties:
        deployments: { type: integer, description: Deployments and their build logs. }
        environment_variables: { type: integer }
        flags: { type: integer, description: Feature flags and their history. }
        domains: { type: integer, description: 'Detached, not deleted; they stay in Domains and DNS.' }
    Template:
      type: object
      required: [key, name, description, category, framework, framework_label, required_env, optional_env]
      properties:
        key: { type: string, examples: [store] }
        name: { type: string, examples: [Store] }
        description: { type: string, examples: ['Product pages, cart, checkout'] }
        category: { type: string, enum: [commerce, content, apps, apis] }
        framework: { type: string, examples: [nextjs] }
        framework_label: { type: string, examples: [Next.js] }
        required_env:
          type: array
          description: Variables the template can't start without; send each in `env` when creating the project.
          items: { $ref: '#/components/schemas/TemplateEnvVar' }
        optional_env:
          type: array
          description: Variables the template reads when they are set.
          items: { $ref: '#/components/schemas/TemplateEnvVar' }
        workload:
          description: How a project from this template runs. Absent means the framework's default.
          type: object
          additionalProperties: true
          examples: [{ type: app, port: 3000, health_check_path: /health }]
        node_version: { type: string, description: 'The Node.js version a project from this template gets, when it needs newer than the default.', examples: [24.x] }
    TemplateEnvVar:
      type: object
      required: [key]
      properties:
        key: { type: string, examples: [PAYSTACK_SECRET_KEY] }
        hint: { type: [string, 'null'], examples: ['From Paystack, Settings → API Keys.'] }
    ProjectPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Project' } }

    # ----- Deployments -----
    DeploymentState:
      type: string
      description: '`queued` waits for a builder; the screens show it as building.'
      enum: [queued, building, ready, failed, canceled]
    DeploymentEnvironment:
      type: string
      description: Where a deployment runs. `development` is only the local `orbits dev` target and an environment-variable scope.
      enum: [production, preview]
    DeploymentStepKey:
      type: string
      description: 'The build log''s fixed steps, in order. The screens label them Queued, Cloning repository, Installing packages, Building, Uploading and Going live.'
      enum: [queued, cloning, installing, building, uploading, going_live]
    DeploymentProject:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, pattern: '^prj_' }
        slug: { type: string }
        name: { type: string }
    Deployment:
      type: object
      required: [id, project, environment, state, trigger, branch, sha, message, author, created_by, url, current, went_live, redeploy_of, promoted_from, pull_request, use_cache, created_at, started_at, finished_at, duration_seconds, screenshot_url, warnings]
      properties:
        id: { type: string, pattern: '^dpl_' }
        project: { $ref: '#/components/schemas/DeploymentProject' }
        environment: { $ref: '#/components/schemas/DeploymentEnvironment' }
        state: { $ref: '#/components/schemas/DeploymentState' }
        trigger:
          type: string
          description: '`git` a push, `manual` deployed by hand, `redeploy`, `promote`, `create` the first deploy of a new project.'
          enum: [git, manual, redeploy, promote, create]
        branch: { type: string, examples: [main] }
        sha: { type: [string, 'null'], description: 'The full commit sha; null until the builder has cloned a branch head. The screens show its first 7 characters.' }
        message: { type: [string, 'null'], description: The commit message's first line., examples: [Update checkout copy] }
        author:
          oneOf:
            - type: 'null'
            - type: object
              required: [name]
              properties:
                name: { type: string, examples: [Shady Asaolu] }
        created_by:
          description: Who asked for it; null for a push.
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
        url:
          type: [string, 'null']
          format: uri
          description: "This deployment's own address, `https://<slug>-<sha7>.<domain>`; null until its sha is known. It answers while the deployment is production or the newest ready preview of its branch."
          examples: ['https://storefront-a1f9c2e.theorbits.app']
        current: { type: boolean, description: Production serves it now. }
        went_live: { type: boolean, description: Production served it at some point. }
        redeploy_of: { type: [string, 'null'], description: The commit sha a redeploy rebuilt. }
        promoted_from: { type: [string, 'null'], description: The `dpl_` id of the deployment a promote rebuilt. }
        pull_request: { type: [integer, 'null'], description: 'The open pull request of the branch, for a preview.' }
        use_cache: { type: boolean }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        duration_seconds: { type: [integer, 'null'], description: From start to finish; null while it runs (count up from `started_at`). }
        screenshot_url:
          type: [string, 'null']
          format: uri-reference
          description: "API path of the deployment's first screen (1280x800 JPEG), `GET /v1/teams/{team}/projects/{project}/deployments/{deployment}/screenshot`. Null until the builder has taken it, a few seconds after the deployment becomes ready; failed and canceled deployments never get one."
          examples: ['/v1/teams/team_d6ecdb07-bdbd-47fa-af1f-1ea403f71e7b/projects/prj_c95dbb97-9f5a-4dc5-839c-200896eb0587/deployments/dpl_8725d680-7b4a-4699-8682-d1ea0649206a/screenshot']
        warnings:
          type: array
          description: "What this deployment may be missing, for its page; empty when nothing is. `missing_env`: public variables the code reads (`import.meta.env.VITE_*`, `process.env.NEXT_PUBLIC_*`, `REACT_APP_*`, `PUBLIC_*`) that weren't set for this environment, nor in a committed `.env` or `.env.production`, when it built; they're baked into the build, so adding them takes a redeploy. Code may have a fallback, so it's a warning, not a failure. `page`: what the browser that takes the screenshot saw on the first load, a few seconds after the deployment became ready: the page's uncaught errors (up to three) and whether its first screen came out blank."
          items: { $ref: '#/components/schemas/DeploymentWarning' }
    DeploymentWarning:
      type: object
      required: [kind, message]
      properties:
        kind: { type: string, enum: [missing_env, page] }
        message: { type: string, examples: ['VITE_SUPABASE_ANON_KEY and VITE_SUPABASE_URL are used in the code but not set for Production. The build bakes them in, so this deployment runs without them.', 'The page threw an error as it loaded and came out blank: Error: supabaseUrl is required.'] }
        keys: { type: array, items: { type: string }, description: '`missing_env`: the variable names, sorted.' }
        errors: { type: array, items: { type: string }, description: '`page`: the uncaught errors, first three.' }
        blank: { type: boolean, description: '`page`: the first screen had nothing on it.' }
    DeploymentStep:
      type: object
      required: [key, state, started_at, finished_at, seconds]
      properties:
        key: { $ref: '#/components/schemas/DeploymentStepKey' }
        state: { type: string, enum: [pending, running, done, failed, skipped] }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        seconds: { type: [integer, 'null'], description: Null until the step ends. }
    DeploymentFailure:
      type: object
      description: Why the build stopped, from the build's own output.
      required: [title, message, step, line]
      properties:
        title: { type: string, examples: ['Type error in lib/cart.ts, line 42'] }
        message: { type: string, examples: ["Property 'total' does not exist on type 'Cart'."] }
        step: { $ref: '#/components/schemas/DeploymentStepKey' }
        line: { type: [integer, 'null'], description: 'The log line `n` that "Jump to error" scrolls to.' }
    ProjectDomain:
      type: object
      required: [name, state, custom]
      properties:
        name: { type: string, examples: [storefront.theorbits.app] }
        state: { type: string, enum: [valid, pending, misconfigured] }
        custom: { type: boolean }
    DeploymentDetail:
      allOf:
        - { $ref: '#/components/schemas/Deployment' }
        - type: object
          required: [framework, region, domains, steps, failure, log_lines, open_graph]
          properties:
            framework: { type: [string, 'null'], description: As the builder detected it., examples: [Next.js 16] }
            region: { type: string, examples: [abj-1] }
            domains:
              type: array
              description: Production's domains, when this is what they serve; otherwise empty. The team's domains serving the project's production (working ones first), then its free address.
              items: { $ref: '#/components/schemas/ProjectDomain' }
            steps: { type: array, items: { $ref: '#/components/schemas/DeploymentStep' } }
            failure:
              oneOf:
                - type: 'null'
                - { $ref: '#/components/schemas/DeploymentFailure' }
            log_lines: { type: integer, description: How many log lines the build has. }
            open_graph:
              description: The home page's link-preview tags. Null until the builder has read them (a second or two after the deployment is ready), for a worker, and when the page could not be read (it answered an error, or redirected to another host).
              oneOf:
                - type: 'null'
                - { $ref: '#/components/schemas/DeploymentOpenGraph' }
    DeploymentOpenGraph:
      type: object
      description: |
        A deployment's home page as a link bot reads it: one plain GET of `/` with no JavaScript, following redirects on the same host, reading the first megabyte. Tags set by JavaScript after the page loads are not here, as link bots don't see them either. URLs are absolute (resolved against the deployment's `url`) and http(s) only; a value that isn't one is null. A page that isn't HTML (an API) has every field null.
      required: [title, description, image, image_was_relative, url, site_name, twitter_card, twitter_title, twitter_description, twitter_image, favicon, fetched_at]
      properties:
        title: { type: [string, 'null'], description: '`og:title`, else `<title>`.', examples: [Fifteen Seconds] }
        description: { type: [string, 'null'], description: '`og:description`, else `<meta name="description">`.' }
        image: { type: [string, 'null'], format: uri, description: '`og:image` (or `og:image:url`, `og:image:secure_url`). The dashboard loads it from its host; the API does not fetch it.', examples: ['https://fifteen-seconds-85234cf.staging.theorbits.app/og.png'] }
        image_was_relative: { type: boolean, description: "The page wrote `og:image` as a relative URL. Some link bots don't resolve it, so the image may not show." }
        url: { type: [string, 'null'], format: uri, description: '`og:url`, else `<link rel="canonical">`.' }
        site_name: { type: [string, 'null'], description: '`og:site_name`.' }
        twitter_card: { type: [string, 'null'], description: '`twitter:card` as written (`summary`, `summary_large_image`, …). Null means X shows a small summary card.', examples: [summary_large_image] }
        twitter_title: { type: [string, 'null'], description: '`twitter:title`; X uses it over `title`.' }
        twitter_description: { type: [string, 'null'], description: '`twitter:description`; X uses it over `description`.' }
        twitter_image: { type: [string, 'null'], format: uri, description: '`twitter:image`; X uses it over `image`.' }
        favicon: { type: [string, 'null'], format: uri, description: '`<link rel="icon">`. Null when the page declares none; most sites still serve `/favicon.ico`.' }
        fetched_at: { type: string, format: date-time, description: When the builder read the page. }
    DeploymentLogLine:
      type: object
      required: ['n', at, step, tone, text]
      properties:
        'n': { type: integer, description: 'Line number, from 1.' }
        at: { type: string, format: date-time }
        step: { $ref: '#/components/schemas/DeploymentStepKey' }
        tone: { type: string, enum: [plain, good, bad], description: 'Green for success lines, red for errors.' }
        text: { type: string }
    DeploymentLogPage:
      type: object
      required: [items, next_after, done]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DeploymentLogLine' } }
        next_after: { type: integer, description: Send as `after` to get the next lines. }
        done: { type: boolean, description: The build has finished and every line has been returned. }
    RuntimeLog:
      type: object
      required: [id, at, source, level, status, method, path, duration_ms, message, stream, request_id, host, region, deployment, headers]
      properties:
        id: { type: string, examples: [log_019a16dc-3a1f-7c2e-9b1d-2f4e8a6b0c11] }
        at: { type: string, format: date-time, description: With milliseconds. }
        source: { type: string, enum: [requests, functions] }
        level: { type: string, enum: [info, warning, error] }
        status: { type: [integer, 'null'], description: A request's HTTP status. }
        method: { type: [string, 'null'], examples: [GET] }
        path: { type: [string, 'null'], description: Without the query string., examples: [/checkout] }
        duration_ms: { type: [integer, 'null'], description: From the edge receiving the request to the last byte of the answer. }
        message: { type: [string, 'null'], description: 'An output line, without colour codes; at most 8192 characters.' }
        stream: { type: [string, 'null'], enum: [stdout, stderr, null] }
        request_id: { type: [string, 'null'], description: 'The edge''s ID for a request, also sent to the app as `X-Request-Id`.' }
        host: { type: [string, 'null'], examples: [shop.theorbits.app] }
        region: { type: string, examples: [abj-1] }
        deployment:
          type: [object, 'null']
          required: [id, sha]
          properties:
            id: { type: string }
            sha: { type: [string, 'null'] }
        headers:
          type: array
          description: 'Some request headers, as `[name, value]` pairs: user-agent, accept, content-type, referer, and x-forwarded-for masked. Cookies and authorization are never stored.'
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
    ObservabilityTotals:
      type: object
      required: [requests, errors, p50_ms, p75_ms, p99_ms]
      properties:
        requests: { type: integer }
        errors: { type: integer, description: Responses with a 5xx status. }
        p50_ms: { type: integer }
        p75_ms: { type: integer }
        p99_ms: { type: integer }
    InsightsRange: { type: string, enum: [24h, 7d, 30d], default: 7d }
    InsightsSwitch:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    InsightsVisits:
      type: object
      required: [visitors, pageviews, bounce_rate, views_per_visit]
      properties:
        visitors: { type: integer }
        pageviews: { type: integer }
        bounce_rate: { type: [number, 'null'], description: 'Share of visitors with one page view, 0 to 1; null without visitors.' }
        views_per_visit: { type: [number, 'null'] }
    Analytics:
      oneOf:
        - type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, const: false }
            locked: { type: boolean, const: true, description: 'Present when the team''s plan doesn''t include this page (Free). Show the upgrade state; nothing is read, and what was collected is kept for when the team is on Pro.' }
        - type: object
          required: [enabled, range, buckets, previous_buckets, totals, previous, pages, referrers, countries, devices, events]
          properties:
            enabled: { type: boolean, const: true }
            range: { $ref: '#/components/schemas/InsightsRange' }
            buckets:
              type: array
              items: { type: object, required: [start, visitors, pageviews], properties: { start: { type: string, format: date-time }, visitors: { type: integer }, pageviews: { type: integer } } }
            previous_buckets:
              type: array
              items: { type: object, required: [start, visitors, pageviews], properties: { start: { type: string, format: date-time }, visitors: { type: integer }, pageviews: { type: integer } } }
            totals: { $ref: '#/components/schemas/InsightsVisits' }
            previous: { $ref: '#/components/schemas/InsightsVisits' }
            pages:
              type: array
              items: { type: object, required: [route, visitors, pageviews], properties: { route: { type: string, examples: ['/products/[id]'] }, visitors: { type: integer }, pageviews: { type: integer } } }
            referrers:
              type: array
              items: { type: object, required: [host, visitors], properties: { host: { type: [string, 'null'], examples: [instagram.com] }, visitors: { type: integer } } }
            countries:
              type: array
              items: { type: object, required: [country, visitors], properties: { country: { type: string, description: ISO 3166-1 alpha-2., examples: [NG] }, visitors: { type: integer } } }
            devices:
              type: array
              items: { type: object, required: [device, visitors], properties: { device: { type: string, enum: [desktop, mobile, tablet] }, visitors: { type: integer } } }
            events:
              type: array
              items: { type: object, required: [name, visitors, count], properties: { name: { type: string, examples: [Signed up] }, visitors: { type: integer }, count: { type: integer } } }
    AnalyticsEvent:
      oneOf:
        - type: object
          required: [enabled]
          properties: { enabled: { type: boolean, const: false } }
        - type: object
          required: [enabled, range, name, count, visitors, properties]
          properties:
            enabled: { type: boolean, const: true }
            range: { $ref: '#/components/schemas/InsightsRange' }
            name: { type: string }
            count: { type: integer }
            visitors: { type: integer }
            properties:
              type: array
              items:
                type: object
                required: [key, count, values]
                properties:
                  key: { type: string, examples: [plan] }
                  count: { type: integer }
                  values:
                    type: array
                    items: { type: object, required: [value, count], properties: { value: { type: string, examples: [pro] }, count: { type: integer } } }
    SpeedInsights:
      oneOf:
        - type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, const: false }
            locked: { type: boolean, const: true, description: 'Present when the team''s plan doesn''t include this page (Free). Show the upgrade state; nothing is read, and what was collected is kept for when the team is on Pro.' }
        - type: object
          required: [enabled, range, device, visits, score, vitals, lcp, routes, targets, connections]
          properties:
            enabled: { type: boolean, const: true }
            range: { $ref: '#/components/schemas/InsightsRange' }
            device: { type: string, enum: [mobile, desktop] }
            visits: { type: integer, description: Page views on the device. }
            score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            vitals:
              type: array
              description: The vitals measured, in the order LCP, INP, CLS, FCP, TTFB.
              items:
                type: object
                required: [name, p75, samples]
                properties:
                  name: { type: string, enum: [LCP, INP, CLS, FCP, TTFB] }
                  p75: { type: number }
                  samples: { type: integer }
            lcp:
              type: array
              items: { type: object, required: [start, p75], properties: { start: { type: string, format: date-time }, p75: { type: [number, 'null'] } } }
            routes:
              type: array
              items:
                type: object
                required: [route, visits, lcp, inp, cls]
                properties:
                  route: { type: string }
                  visits: { type: integer }
                  lcp: { type: [number, 'null'] }
                  inp: { type: [number, 'null'] }
                  cls: { type: [number, 'null'] }
            targets:
              type: array
              items:
                type: object
                required: [name, target, samples, p75]
                properties:
                  name: { type: string, enum: [LCP, INP, CLS] }
                  target: { type: string, examples: ['main>img.hero'] }
                  samples: { type: integer }
                  p75: { type: number }
            connections:
              type: array
              items: { type: object, required: [connection, samples], properties: { connection: { type: string, enum: [4g, 3g, 2g, slow-2g] }, samples: { type: integer } } }
    Observability:
      type: object
      required: [as_of, range, bucket_seconds, totals, previous, buckets, routes, statuses, regions, all_routes]
      properties:
        as_of: { type: string, format: date-time }
        range: { type: string, enum: [1h, 6h, 24h, 7d] }
        bucket_seconds: { type: integer, examples: [3600] }
        totals: { $ref: '#/components/schemas/ObservabilityTotals' }
        previous: { allOf: [{ $ref: '#/components/schemas/ObservabilityTotals' }], description: 'The same for the period before, for "on the hour before".' }
        buckets:
          type: array
          description: Oldest first; zeros where nothing came in. The last is still filling.
          items:
            type: object
            required: [start, requests, errors, p75_ms, p99_ms]
            properties:
              start: { type: string, format: date-time }
              requests: { type: integer }
              errors: { type: integer }
              p75_ms: { type: integer }
              p99_ms: { type: integer }
        routes:
          type: array
          description: The 20 busiest routes, busiest first.
          items:
            type: object
            required: [route, requests, errors, p75_ms, p99_ms]
            properties:
              route: { type: string, examples: ['/products/[id]'] }
              requests: { type: integer }
              errors: { type: integer }
              p75_ms: { type: integer }
              p99_ms: { type: integer }
        statuses:
          type: object
          description: Requests by status class, under every filter but `status`.
          required: [2xx, 3xx, 4xx, 5xx]
          properties:
            2xx: { type: integer }
            3xx: { type: integer }
            4xx: { type: integer }
            5xx: { type: integer }
        regions:
          type: array
          items: { type: object, required: [region, requests], properties: { region: { type: string, examples: [abj-1] }, requests: { type: integer } } }
        all_routes:
          type: array
          description: The 100 busiest routes in the range, for the Route filter.
          items: { type: string }
    AlertMetric:
      type: string
      enum: [error-rate, p75, p99, requests]
      description: '`error-rate`: 5xx responses as a share of requests, in %. `p75`, `p99`: response time in ms. `requests`: requests per minute.'
    AlertChannel:
      type: string
      enum: [webhook, email]
      description: '`webhook`: the team''s webhook. `email`: the team''s owners, admins and members.'
    WorkflowStep:
      type: object
      required: [name, kind, state, seconds, detail, error, attempts, retried_by, wake_at, event, output]
      properties:
        name: { type: string, examples: [update-inventory] }
        kind: { type: string, enum: [step, sleep, wait] }
        state: { type: string, enum: [running, succeeded, failed, waiting, skipped, canceled] }
        seconds: { type: [integer, 'null'], description: Time spent running over every attempt; null for one not reached. }
        detail: { type: string, examples: ['Gave up after 3 attempts'] }
        error: { type: [array, 'null'], items: { type: string }, description: 'The last attempt''s error: message, then where.' }
        attempts: { type: integer }
        retried_by: { oneOf: [{ $ref: '#/components/schemas/FlagPerson' }, { type: 'null' }] }
        wake_at: { type: [string, 'null'], format: date-time, description: 'A sleep''s end, or a wait''s timeout.' }
        event: { type: [string, 'null'], description: What a wait waits for. }
        output: { description: The step's result; a wait's is the event's data. }
    WorkflowRun:
      type: object
      required: [id, workflow, state, trigger, trigger_text, started_by, started_at, finished_at, seconds, deployment, input, output, error, attempts, next_at, steps]
      properties:
        id: { type: string }
        workflow: { type: string, examples: [sync-stock] }
        state: { type: string, enum: [running, succeeded, failed, canceled] }
        trigger: { type: string, enum: [schedule, event, manual] }
        trigger_text: { type: string, examples: [Every 15 minutes] }
        started_by: { oneOf: [{ $ref: '#/components/schemas/FlagPerson' }, { type: 'null' }], description: Who pressed Run now; null for a schedule or an event. }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        seconds: { type: integer, description: 'From start to finish, or so far.' }
        deployment: { type: object, required: [id, sha], properties: { id: { type: string }, sha: { type: [string, 'null'] } } }
        input: { description: The JSON it started with. }
        output: { description: What the workflow returned. }
        error: { type: [array, 'null'], items: { type: string } }
        attempts: { type: string, examples: ['3 on step 3'] }
        next_at: { type: [string, 'null'], format: date-time, description: When the app is called for it next. }
        steps: { type: array, items: { $ref: '#/components/schemas/WorkflowStep' } }
    WorkflowsPage:
      type: object
      required: [workflows, runs]
      properties:
        workflows:
          type: array
          items:
            type: object
            required: [name, description, schedule, event, retries, trigger_text, last_run, success_rate]
            properties:
              name: { type: string }
              description: { type: string }
              schedule: { type: [string, 'null'], description: 'Five-field cron, in UTC.' }
              event: { type: [string, 'null'] }
              retries: { type: integer, description: 'Attempts after the first, for each step.' }
              trigger_text: { type: string }
              last_run:
                oneOf:
                  - { type: 'null' }
                  - type: object
                    required: [id, state, at]
                    properties: { id: { type: string }, state: { type: string, enum: [running, succeeded, failed, canceled] }, at: { type: string, format: date-time } }
              success_rate: { type: [number, 'null'], minimum: 0, maximum: 1 }
        runs: { type: array, items: { $ref: '#/components/schemas/WorkflowRun' } }
    SandboxRuntime: { type: string, enum: [node22, python312, go123] }
    SandboxSize: { type: string, enum: [small, large], description: 'small = 0.5 vCPU, 512 MB, 2 GB disk; large = 1 vCPU, 2 GB, 4 GB disk. Several pack onto one node.' }
