                channels:
                  type: object
                  propertyNames: { enum: [deploy.failed, deploy.live, domain.attention, member.joined] }
                  additionalProperties: { type: [string, 'null'], examples: ['#alerts'] }
                scope: { $ref: '#/components/schemas/IntegrationScopeInput' }
