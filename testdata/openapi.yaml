        '422': { $ref: '#/components/responses/Invalid' }
    post:
      tags: [Flags]
      operationId: createFlag
      summary: Create a flag
      description: |
        **Status:** Implemented.

        A boolean flag starts off in each environment unless `environments.<name>.on` says otherwise, at 100% rollout and with no rules. A string or number flag needs `environments.<name>.value` for all three. Keys are lowercase letters, digits and single dashes, unique in the project.

        **Permissions:** Owners, admins and members. Viewers get 403.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
