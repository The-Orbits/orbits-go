                    production: { $ref: '#/components/schemas/FlagEnvironmentInput' }
                    preview: { $ref: '#/components/schemas/FlagEnvironmentInput' }
                    development: { $ref: '#/components/schemas/FlagEnvironmentInput' }
      responses:
        '201':
