        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/flags/{flag}/environments/{environment}/rules:
    parameters:
      - { $ref: '#/components/parameters/Team' }
      - { $ref: '#/components/parameters/Project' }
      - { name: flag, in: path, required: true, schema: { type: string } }
      - { name: environment, in: path, required: true, schema: { $ref: '#/components/schemas/FlagEnvironmentName' } }
    post:
      tags: [Flags]
      operationId: addFlagRule
      summary: Add a targeting rule
      description: |
        **Status:** Implemented.

        Rules are checked in order before the environment's switch: the first that matches decides, `serve` being on or off for a boolean flag and the value for the others. `attribute` names what the app passes to `flag()` (`email`, `id`, `plan`, `user.country`); `one_of` takes several values, every other operator one; comparisons ignore case, and an attribute the app didn't pass matches nothing. 20 rules at most.

        **Permissions:** Owners, admins and members.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attribute, operator, values, serve]
              properties:
                attribute: { type: string, maxLength: 64, examples: [email] }
                operator: { $ref: '#/components/schemas/FlagRuleOperator' }
                values: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 200 }, examples: [['@kudi.ng']] }
                serve: { type: [boolean, string, number] }
      responses:
        '201':
          description: The flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flag' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /teams/{team}/projects/{project}/flags/{flag}/environments/{environment}/rules/{rule}:
    parameters:
